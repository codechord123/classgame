<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>분수 폭발! 스피드 게임</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }

    @keyframes pulse-grow {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .grow-pulse { animation: pulse-grow 0.45s ease-out; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.4s ease-in-out; }

    @keyframes pop {
      0% { transform: scale(1); opacity: 1; }
      40% { transform: scale(1.6) rotate(-8deg); opacity: 1; }
      70% { transform: scale(2.2) rotate(6deg); opacity: 0.9; }
      100% { transform: scale(3.5) rotate(0deg); opacity: 0; }
    }
    .pop { animation: pop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    @keyframes confetti {
      0% { transform: translate(0,0) rotate(0); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) rotate(var(--r)); opacity: 0; }
    }
    .confetti { animation: confetti 1.2s ease-out forwards; }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ============== 수학 유틸 ==============
    const gcd = (a, b) => (b === 0 ? a : gcd(b, a % b));
    const lcmOf = (a, b) => (a * b) / gcd(a, b);
    const rint = (n) => Math.floor(Math.random() * n);
    const shuffle = (arr) => {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    };
    const sameChoice = (a, b) => {
      if (!a || !b || a.type !== b.type) return false;
      if (a.type === 'reduce') return a.n === b.n && a.d === b.d;
      return a.n1 === b.n1 && a.n2 === b.n2 && a.d === b.d;
    };
    const isEquivalent = (a, b) => a.n * b.d === a.d * b.n;

    // ============== 문제 생성 ==============
    // 모든 problem 객체는 { type, subtype, original, questionText, correctAnswer, choices } 형태.

    // 1. 기약분수로 약분 (텍스트는 "약분" / "기약분수" 둘 중 랜덤)
    function makeReduceProblem() {
      let d, n, g;
      do {
        d = 4 + rint(14);                 // 4..17
        n = 1 + rint(d - 1);
        g = gcd(n, d);
      } while (g === 1);
      const cn = n / g, cd = d / g;
      const correct = { type: 'reduce', n: cn, d: cd };

      const choices = [correct];
      let tries = 0;
      while (choices.length < 3 && tries < 60) {
        tries++;
        const r = Math.random();
        let wn, wd;
        if (r < 0.45) {
          // 약분이 덜 된 함정 (cn*k / cd*k)
          const k = 2 + rint(2);
          wn = cn * k; wd = cd * k;
        } else if (r < 0.75) {
          wn = Math.max(1, cn + (Math.random() > 0.5 ? 1 : -1));
          wd = cd;
        } else {
          wn = Math.max(1, cn + (Math.random() > 0.5 ? 1 : -1));
          wd = Math.max(2, cd + (Math.random() > 0.5 ? 1 : -1));
        }
        if (wn >= wd) wd = wn + 1;
        const cand = { type: 'reduce', n: wn, d: wd };
        if (!sameChoice(cand, correct) && !choices.some(c => sameChoice(c, cand))) {
          choices.push(cand);
        }
      }
      while (choices.length < 3) {
        choices.push({ type: 'reduce', n: cn + choices.length, d: cd + choices.length + 2 });
      }

      const questionText = Math.random() < 0.5 ? '을(를) 약분하면?' : '을(를) 기약분수로 나타내면?';
      const tag = questionText.includes('기약') ? '✨ 기약분수 만들기' : '✂️ 약분 문제';

      return {
        type: 'reduce',
        subtype: 'reduce',
        tag,
        original: { n, d },
        questionText,
        correctAnswer: correct,
        choices: shuffle(choices),
      };
    }

    // 2. 동치분수 찾기 — 주어진 분수와 크기가 같은 분수 고르기
    function makeEquivalentProblem() {
      // 기약 상태에서 출발 (질문에서 보여주는 분수)
      let d, n;
      do {
        d = 2 + rint(7);                   // 2..8
        n = 1 + rint(d - 1);
      } while (gcd(n, d) !== 1);
      const k = 2 + rint(4);               // 2..5 → 정답
      const correct = { type: 'reduce', n: n * k, d: d * k };

      const choices = [correct];
      let tries = 0;
      while (choices.length < 3 && tries < 80) {
        tries++;
        const r = Math.random();
        let cand;
        if (r < 0.45) {
          // 분자/분모에 서로 다른 수를 곱한 함정
          const a = 2 + rint(5);
          const b = 2 + rint(5);
          if (a !== b) cand = { type: 'reduce', n: n * a, d: d * b };
        } else if (r < 0.75) {
          // 정답에서 분자만 ±1
          const off = Math.random() > 0.5 ? 1 : -1;
          cand = { type: 'reduce', n: Math.max(1, correct.n + off), d: correct.d };
        } else {
          // 분자/분모 모두 +1 (같은 양 더하기 함정)
          cand = { type: 'reduce', n: correct.n + 1, d: correct.d + 1 };
        }
        if (cand && !isEquivalent(cand, { n, d }) && !choices.some(c => sameChoice(c, cand))) {
          choices.push(cand);
        }
      }
      while (choices.length < 3) {
        choices.push({ type: 'reduce', n: correct.n + choices.length + 2, d: correct.d + choices.length + 1 });
      }

      return {
        type: 'reduce',
        subtype: 'equivalent',
        tag: '🟰 동치분수 찾기',
        original: { n, d },
        questionText: '와(과) 크기가 같은 분수는?',
        correctAnswer: correct,
        choices: shuffle(choices),
      };
    }

    // 3. 통분 (최소공배수)
    function makeCommonLcmProblem() {
      let d1, d2;
      do {
        d1 = 2 + rint(7);                  // 2..8
        d2 = 2 + rint(7);
      } while (d1 === d2 || lcmOf(d1, d2) === Math.max(d1, d2));
      const n1 = 1 + rint(d1 - 1);
      const n2 = 1 + rint(d2 - 1);
      const lcm = lcmOf(d1, d2);
      const correct = { type: 'common', n1: n1 * (lcm / d1), n2: n2 * (lcm / d2), d: lcm };

      const choices = [correct];
      let tries = 0;
      while (choices.length < 3 && tries < 60) {
        tries++;
        const r = Math.random();
        let cand;
        if (r < 0.5) {
          // 두 분모의 곱(=lcm이 아닌 공배수)로 통분한 함정 — 가장 흔한 오답
          const prod = d1 * d2;
          if (prod !== lcm) {
            cand = { type: 'common', n1: n1 * d2, n2: n2 * d1, d: prod };
          }
        } else if (r < 0.8) {
          cand = { type: 'common',
                   n1: Math.max(1, correct.n1 + (Math.random() > 0.5 ? 1 : -1)),
                   n2: correct.n2, d: lcm };
        } else {
          cand = { type: 'common', n1: correct.n1, n2: correct.n2 + 1, d: lcm };
        }
        if (cand && !choices.some(c => sameChoice(c, cand))) choices.push(cand);
      }
      while (choices.length < 3) {
        choices.push({ type: 'common', n1: correct.n1 + choices.length, n2: correct.n2 + choices.length, d: lcm + choices.length });
      }

      const questionText = Math.random() < 0.5 ? '을(를) 통분하면?' : '을(를) 최소공배수로 통분하면?';
      const tag = questionText.includes('최소공배수') ? '🤝 통분 (최소공배수)' : '🤝 통분 문제';

      return {
        type: 'common',
        subtype: 'common-lcm',
        tag,
        original: { n1, d1, n2, d2 },
        questionText,
        correctAnswer: correct,
        choices: shuffle(choices),
      };
    }

    // 4. 통분 (두 분모의 곱)
    function makeCommonProductProblem() {
      let d1, d2;
      do {
        d1 = 2 + rint(7);                  // 2..8
        d2 = 2 + rint(7);
      } while (d1 === d2 || lcmOf(d1, d2) === d1 * d2 || lcmOf(d1, d2) === Math.max(d1, d2));
      const n1 = 1 + rint(d1 - 1);
      const n2 = 1 + rint(d2 - 1);
      const prod = d1 * d2;
      const correct = { type: 'common', n1: n1 * d2, n2: n2 * d1, d: prod };

      const choices = [correct];
      let tries = 0;
      while (choices.length < 3 && tries < 60) {
        tries++;
        const r = Math.random();
        let cand;
        if (r < 0.55) {
          // 최소공배수로 통분한 함정
          const lcm = lcmOf(d1, d2);
          cand = { type: 'common', n1: n1 * (lcm / d1), n2: n2 * (lcm / d2), d: lcm };
        } else if (r < 0.85) {
          // 분자에 자기 분모를 곱한 잘못 (자주 하는 실수)
          cand = { type: 'common', n1: n1 * d1, n2: n2 * d2, d: prod };
        } else {
          cand = { type: 'common',
                   n1: Math.max(1, correct.n1 + (Math.random() > 0.5 ? 1 : -1)),
                   n2: correct.n2, d: prod };
        }
        if (cand && !choices.some(c => sameChoice(c, cand))) choices.push(cand);
      }
      while (choices.length < 3) {
        choices.push({ type: 'common', n1: correct.n1 + choices.length, n2: correct.n2 + choices.length, d: prod + choices.length });
      }

      return {
        type: 'common',
        subtype: 'common-product',
        tag: '✖️ 통분 (두 분모의 곱)',
        original: { n1, d1, n2, d2 },
        questionText: '을(를) 두 분모의 곱으로 통분하면?',
        correctAnswer: correct,
        choices: shuffle(choices),
      };
    }

    const generateProblem = () => {
      const r = Math.random();
      if (r < 0.28) return makeReduceProblem();
      if (r < 0.48) return makeEquivalentProblem();
      if (r < 0.78) return makeCommonLcmProblem();
      return makeCommonProductProblem();
    };

    // ============== 분수 표시 ==============
    const Frac = ({ n, d, color = "text-slate-800" }) => (
      <span className={`inline-flex flex-col items-center mx-1 ${color} font-black leading-none`}>
        <span className="text-current">{n}</span>
        <span className="block w-full border-b-[3px] border-current my-0.5"></span>
        <span className="text-current">{d}</span>
      </span>
    );

    const ChoiceCard = ({ choice, onPick, disabled, idx }) => {
      const labels = ['A', 'B', 'C'];
      const colors = [
        'from-sky-400 to-sky-600 border-sky-300',
        'from-rose-400 to-rose-600 border-rose-300',
        'from-emerald-400 to-emerald-600 border-emerald-300',
      ];
      return (
        <button
          onClick={() => onPick(choice)}
          disabled={disabled}
          className={`relative bg-gradient-to-br ${colors[idx]} text-white rounded-2xl md:rounded-3xl p-4 md:p-6 border-4 shadow-xl active:scale-95 hover:scale-[1.03] transition-transform disabled:opacity-50 disabled:active:scale-100 flex-1 min-h-[120px] md:min-h-[160px] flex flex-col items-center justify-center gap-2 md:gap-3`}
        >
          <span className="absolute top-2 left-3 text-base md:text-xl font-black opacity-80">{labels[idx]}</span>
          <div className="flex items-center justify-center gap-1 md:gap-2 text-2xl md:text-4xl">
            {choice.type === 'reduce' ? (
              <Frac n={choice.n} d={choice.d} color="text-white" />
            ) : (
              <>
                <Frac n={choice.n1} d={choice.d} color="text-white" />
                <span className="text-2xl md:text-4xl font-black">,</span>
                <Frac n={choice.n2} d={choice.d} color="text-white" />
              </>
            )}
          </div>
        </button>
      );
    };

    // ============== 캐릭터 ==============
    const Character = ({ scale = 1, popping = false, className = "" }) => (
      <div
        className={`${popping ? 'pop' : ''} ${className}`}
        style={{ transform: popping ? undefined : `scale(${scale})`, transformOrigin: 'center center', transition: popping ? undefined : 'transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1)' }}
      >
        <svg viewBox="0 0 220 220" width="160" height="160" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M 40,90 Q 38,18 110,18 Q 188,18 188,100 Q 195,200 110,200 Q 28,200 28,110 Q 28,98 40,90 Z"
            fill="#fef3c7" stroke="#1f2937" strokeWidth="4" strokeLinejoin="round" strokeLinecap="round"
          />
          <path d="M 62,80 Q 110,72 158,80" stroke="#1f2937" strokeWidth="3" fill="none" strokeLinecap="round" />
          <circle cx="82" cy="108" r="4" fill="none" stroke="#1f2937" strokeWidth="2.5" />
          <circle cx="138" cy="108" r="4" fill="none" stroke="#1f2937" strokeWidth="2.5" />
          <path d="M 95,92 L 100,148 L 110,138 L 120,148 L 125,92" stroke="#1f2937" strokeWidth="3" fill="none" strokeLinejoin="round" strokeLinecap="round" />
          <path d="M 88,170 L 98,162 L 108,170 L 118,162 L 128,170" stroke="#1f2937" strokeWidth="2.5" fill="none" strokeLinejoin="round" strokeLinecap="round" />
        </svg>
      </div>
    );

    // ============== 타이머 표시 ==============
    const formatTime = (ms) => {
      const totalCs = Math.floor(ms / 10);
      const m = Math.floor(totalCs / 6000);
      const s = Math.floor((totalCs % 6000) / 100);
      const cs = totalCs % 100;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
    };

    // ============== 리더보드 (GAS 공유 ↔ localStorage 폴백) ==============
    const LB_KEY = 'fraction-pop-game-leaderboard-v2';
    const loadLocalLB = () => { try { return JSON.parse(localStorage.getItem(LB_KEY) || '[]'); } catch { return []; } };
    const saveLocalLB = (entries) => { try { localStorage.setItem(LB_KEY, JSON.stringify(entries)); } catch {} };

    const isGAS = () => typeof window !== 'undefined' && window.google && window.google.script && window.google.script.run;

    const callGAS = (fn, ...args) => new Promise((resolve, reject) => {
      if (!isGAS()) return reject(new Error('not GAS'));
      try {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
      } catch (e) { reject(e); }
    });

    async function fetchLeaderboard() {
      if (isGAS()) {
        try {
          const data = await callGAS('getLeaderboard');
          if (Array.isArray(data)) return data;
        } catch {}
      }
      return loadLocalLB();
    }

    async function submitScoreRemote(name, time) {
      if (isGAS()) {
        try {
          const data = await callGAS('submitScore', name, time);
          if (Array.isArray(data)) return data;
        } catch {}
      }
      // 폴백: localStorage
      const entry = { name, time, date: Date.now() };
      const updated = [...loadLocalLB(), entry].sort((a,b) => a.time - b.time).slice(0, 50);
      saveLocalLB(updated);
      return updated;
    }

    async function clearLeaderboardRemote() {
      if (isGAS()) {
        try {
          await callGAS('clearLeaderboard');
          return [];
        } catch {}
      }
      saveLocalLB([]);
      return [];
    }

    // ============== 메인 앱 ==============
    const TOTAL_PROBLEMS = 30;
    const PENALTY_MS = 3000;

    function App() {
      const [screen, setScreen] = useState('title');
      const [name, setName] = useState('');
      const [solved, setSolved] = useState(0);
      const [problem, setProblem] = useState(null);
      const [feedback, setFeedback] = useState(null);
      const [elapsed, setElapsed] = useState(0);
      const [countdown, setCountdown] = useState(3);
      const [finalTime, setFinalTime] = useState(0);
      const [leaderboard, setLeaderboard] = useState([]);
      const [lbBusy, setLbBusy] = useState(false);
      const [confettiBits, setConfettiBits] = useState([]);
      const [usingRemote, setUsingRemote] = useState(false);

      const startRef = useRef(0);
      const penaltyRef = useRef(0);
      const rafRef = useRef(null);
      const lockRef = useRef(false);

      const refreshLB = useCallback(async () => {
        setLbBusy(true);
        const data = await fetchLeaderboard();
        setLeaderboard(data);
        setLbBusy(false);
      }, []);

      useEffect(() => {
        setUsingRemote(isGAS());
        refreshLB();
      }, [refreshLB]);

      // 타이머
      useEffect(() => {
        if (screen !== 'playing') return;
        const tick = () => {
          setElapsed(Date.now() - startRef.current + penaltyRef.current);
          rafRef.current = requestAnimationFrame(tick);
        };
        rafRef.current = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafRef.current);
      }, [screen]);

      // 카운트다운
      useEffect(() => {
        if (screen !== 'countdown') return;
        if (countdown <= 0) {
          startRef.current = Date.now();
          penaltyRef.current = 0;
          setElapsed(0);
          setSolved(0);
          setProblem(generateProblem());
          setScreen('playing');
          return;
        }
        const t = setTimeout(() => setCountdown(c => c - 1), 700);
        return () => clearTimeout(t);
      }, [screen, countdown]);

      const startGame = () => {
        if (!name.trim()) return;
        setCountdown(3);
        setScreen('countdown');
      };

      const handlePick = (choice) => {
        if (lockRef.current || !problem) return;
        const isCorrect = sameChoice(choice, problem.correctAnswer);
        lockRef.current = true;

        if (isCorrect) {
          const next = solved + 1;
          setFeedback('correct');
          setSolved(next);
          if (next >= TOTAL_PROBLEMS) {
            setTimeout(() => {
              setScreen('popping');
              const bits = Array.from({ length: 28 }).map((_, i) => ({
                id: i,
                tx: (Math.random() - 0.5) * 800,
                ty: (Math.random() - 0.5) * 600 - 100,
                r: Math.random() * 720 - 360,
                emoji: ['🎉','✨','⭐','💥','🎊','💫'][Math.floor(Math.random()*6)]
              }));
              setConfettiBits(bits);

              setTimeout(async () => {
                const t = Date.now() - startRef.current + penaltyRef.current;
                setFinalTime(t);
                setLbBusy(true);
                const updated = await submitScoreRemote(name.trim(), t);
                setLeaderboard(updated);
                setLbBusy(false);
                setScreen('result');
              }, 1500);
            }, 250);
          } else {
            setTimeout(() => {
              setProblem(generateProblem());
              setFeedback(null);
              lockRef.current = false;
            }, 220);
          }
        } else {
          penaltyRef.current += PENALTY_MS;
          setFeedback('wrong');
          setTimeout(() => {
            setFeedback(null);
            lockRef.current = false;
          }, 420);
        }
      };

      const resetGame = () => {
        setScreen('title');
        setSolved(0);
        setElapsed(0);
        setFeedback(null);
        setProblem(null);
        lockRef.current = false;
        refreshLB();
      };

      const clearLB = async () => {
        if (!confirm('명예의 전당을 모두 지울까요? (모든 학생 기록 삭제)')) return;
        setLbBusy(true);
        const data = await clearLeaderboardRemote();
        setLeaderboard(data);
        setLbBusy(false);
      };

      // ============== 화면 렌더 ==============
      if (screen === 'title') {
        return (
          <div className="w-full h-[100dvh] bg-gradient-to-br from-indigo-700 via-purple-700 to-pink-600 flex items-center justify-center p-4 font-sans overflow-y-auto">
            <div className="bg-white/95 rounded-3xl shadow-2xl p-6 md:p-8 max-w-lg w-full text-center animate-fade-in my-4">
              <div className="flex justify-center mb-3">
                <Character scale={0.9} />
              </div>
              <h1 className="text-3xl md:text-5xl font-black text-slate-800 mb-1 tracking-tight">분수 폭발!</h1>
              <p className="text-base md:text-lg text-slate-500 font-bold mb-4">약분·통분 스피드 게임 ⚡</p>

              <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 md:p-4 text-left text-sm md:text-base text-amber-900 mb-5 leading-relaxed break-keep">
                <div className="font-bold mb-1">📜 규칙</div>
                <ul className="list-disc list-inside space-y-0.5 marker:text-amber-500">
                  <li>총 <strong>30문제</strong> (약분/기약분수/동치분수/통분 무작위)</li>
                  <li><strong>A·B·C 카드 중 정답</strong>을 선택하면 캐릭터가 커집니다</li>
                  <li>오답 시 <strong className="text-rose-600">시간 +3초</strong> 페널티</li>
                  <li>30문제 완주 시 캐릭터가 <strong>펑!</strong> 터집니다 💥</li>
                </ul>
              </div>

              <input
                type="text"
                value={name}
                onChange={e => setName(e.target.value)}
                placeholder="이름 또는 모둠 닉네임"
                maxLength={12}
                className="w-full px-4 py-3 text-lg md:text-xl text-center font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-500 outline-none mb-3"
              />
              <button
                onClick={startGame}
                disabled={!name.trim()}
                className="w-full bg-gradient-to-r from-indigo-600 to-pink-600 hover:from-indigo-700 hover:to-pink-700 text-white text-xl md:text-2xl font-black py-3.5 rounded-2xl shadow-lg active:scale-95 transition disabled:opacity-50 disabled:active:scale-100"
              >
                🚀 시작하기
              </button>

              <div className="mt-5 text-left">
                <div className="flex items-center justify-between mb-2">
                  <span className="font-black text-slate-700 flex items-center gap-1.5">
                    🏆 명예의 전당
                    {usingRemote
                      ? <span className="text-[10px] md:text-xs bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded-md font-bold">공유</span>
                      : <span className="text-[10px] md:text-xs bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded-md font-bold">기기 저장</span>}
                  </span>
                  <div className="flex gap-2">
                    <button onClick={refreshLB} disabled={lbBusy} className="text-xs font-bold text-slate-500 hover:text-indigo-600 disabled:opacity-50">🔄 새로고침</button>
                    <button onClick={clearLB} disabled={lbBusy} className="text-xs text-slate-400 hover:text-rose-500 underline disabled:opacity-50">초기화</button>
                  </div>
                </div>
                {lbBusy && leaderboard.length === 0 && (
                  <div className="text-slate-400 text-center py-3 text-sm">불러오는 중...</div>
                )}
                {!lbBusy && leaderboard.length === 0 && (
                  <div className="text-slate-400 text-center py-3 text-sm">아직 기록이 없습니다. 첫 번째 도전자가 되어보세요!</div>
                )}
                {leaderboard.length > 0 && (
                  <div className="space-y-1">
                    {leaderboard.slice(0, 5).map((e, i) => (
                      <div key={i} className={`flex justify-between items-center px-3 py-2 rounded-lg text-sm md:text-base font-bold ${i === 0 ? 'bg-yellow-100 text-yellow-800' : i === 1 ? 'bg-slate-100 text-slate-700' : i === 2 ? 'bg-amber-100 text-amber-800' : 'bg-slate-50 text-slate-600'}`}>
                        <span>{i+1}. {e.name}</span>
                        <span className="font-mono">{formatTime(e.time)}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      if (screen === 'countdown') {
        return (
          <div className="w-full h-[100dvh] bg-gradient-to-br from-indigo-700 via-purple-700 to-pink-600 flex items-center justify-center font-sans">
            <div className="text-white text-[12rem] md:text-[20rem] font-black drop-shadow-2xl animate-fade-in" style={{ animationDuration: '0.2s' }}>
              {countdown > 0 ? countdown : 'GO!'}
            </div>
          </div>
        );
      }

      if (screen === 'playing' || screen === 'popping') {
        const scale = 0.5 + (solved / TOTAL_PROBLEMS) * 3.5;
        const progressPct = (solved / TOTAL_PROBLEMS) * 100;
        return (
          <div className="w-full h-[100dvh] bg-gradient-to-br from-slate-900 to-slate-700 flex flex-col font-sans text-white overflow-hidden">
            <div className="flex justify-between items-center px-4 md:px-8 py-3 md:py-4 bg-black/30 border-b border-white/10 flex-shrink-0">
              <div className="flex items-center gap-2 md:gap-3">
                <span className="text-amber-300 font-black text-base md:text-xl">{name}</span>
                <span className="text-xs md:text-sm text-slate-300 bg-white/10 px-2 py-0.5 rounded-md">{solved}/{TOTAL_PROBLEMS}</span>
              </div>
              <div className="text-2xl md:text-4xl font-mono font-black tracking-tight tabular-nums">
                {formatTime(elapsed)}
              </div>
            </div>

            <div className="h-2 md:h-3 bg-white/10 flex-shrink-0">
              <div className="h-full bg-gradient-to-r from-emerald-400 to-cyan-400 transition-all duration-300" style={{ width: `${progressPct}%` }}></div>
            </div>

            <div className={`flex-1 flex flex-col lg:flex-row items-center justify-center p-3 md:p-8 gap-3 md:gap-8 overflow-y-auto ${feedback === 'wrong' ? 'shake' : ''}`}>
              <div className="flex-shrink-0 relative flex items-center justify-center w-full lg:w-1/2 h-[140px] sm:h-[180px] md:h-[260px] lg:h-full">
                <div className={feedback === 'correct' && screen === 'playing' ? 'grow-pulse' : ''}>
                  <Character scale={scale} popping={screen === 'popping'} />
                </div>
                {screen === 'popping' && (
                  <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                    {confettiBits.map(b => (
                      <span
                        key={b.id}
                        className="absolute text-3xl md:text-5xl confetti"
                        style={{ '--tx': `${b.tx}px`, '--ty': `${b.ty}px`, '--r': `${b.r}deg` }}
                      >{b.emoji}</span>
                    ))}
                  </div>
                )}
              </div>

              <div className="w-full lg:w-1/2 flex flex-col gap-3 md:gap-5">
                {problem && screen === 'playing' && (
                  <>
                    <div className="bg-white text-slate-800 rounded-2xl md:rounded-3xl px-4 py-4 md:px-8 md:py-6 text-center shadow-2xl">
                      <div className="text-xs md:text-sm font-bold text-slate-400 mb-1 md:mb-2">
                        {problem.tag}
                      </div>
                      <div className="text-xl md:text-3xl font-black flex items-center justify-center flex-wrap gap-1 md:gap-2">
                        {problem.type === 'reduce' ? (
                          <>
                            <Frac n={problem.original.n} d={problem.original.d} />
                            <span>{problem.questionText}</span>
                          </>
                        ) : (
                          <>
                            <Frac n={problem.original.n1} d={problem.original.d1} />
                            <span>와(과)</span>
                            <Frac n={problem.original.n2} d={problem.original.d2} />
                            <span>{problem.questionText}</span>
                          </>
                        )}
                      </div>
                    </div>

                    <div className="flex flex-col sm:flex-row gap-2 md:gap-4">
                      {problem.choices.map((c, i) => (
                        <ChoiceCard key={i} choice={c} idx={i} onPick={handlePick} disabled={lockRef.current} />
                      ))}
                    </div>

                    {feedback === 'wrong' && (
                      <div className="text-center text-rose-300 font-black text-lg md:text-2xl animate-fade-in">
                        ❌ 오답! +3초 페널티
                      </div>
                    )}
                    {feedback === 'correct' && (
                      <div className="text-center text-emerald-300 font-black text-lg md:text-2xl animate-fade-in">
                        ⭕ 정답!
                      </div>
                    )}
                  </>
                )}

                {screen === 'popping' && (
                  <div className="text-center text-yellow-300 font-black text-3xl md:text-6xl animate-fade-in">
                    💥 펑!
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      if (screen === 'result') {
        const myRank = leaderboard.findIndex(e => e.time === finalTime && e.name === name.trim()) + 1;
        return (
          <div className="w-full h-[100dvh] bg-gradient-to-br from-pink-600 via-purple-700 to-indigo-700 flex items-center justify-center p-4 font-sans overflow-y-auto">
            <div className="bg-white/95 rounded-3xl shadow-2xl p-6 md:p-8 max-w-xl w-full text-center animate-fade-in my-4">
              <div className="text-6xl md:text-8xl mb-2">🎉</div>
              <h2 className="text-2xl md:text-4xl font-black text-slate-800 mb-1">캐릭터 폭발 성공!</h2>
              <p className="text-slate-500 font-bold mb-5">{name} 님 수고하셨습니다</p>

              <div className="bg-slate-900 text-white rounded-2xl p-5 md:p-7 mb-5 shadow-inner">
                <div className="text-xs md:text-sm text-slate-400 mb-1">최종 기록</div>
                <div className="text-4xl md:text-6xl font-black font-mono tabular-nums text-amber-300">{formatTime(finalTime)}</div>
                {myRank > 0 && myRank <= 5 && (
                  <div className="mt-2 text-emerald-300 font-bold text-sm md:text-base">🏅 명예의 전당 {myRank}위 등극!</div>
                )}
              </div>

              <div className="text-left mb-5">
                <div className="flex items-center justify-between mb-2">
                  <div className="font-black text-slate-700 flex items-center gap-1.5">
                    🏆 명예의 전당
                    {usingRemote
                      ? <span className="text-[10px] md:text-xs bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded-md font-bold">공유</span>
                      : <span className="text-[10px] md:text-xs bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded-md font-bold">기기 저장</span>}
                  </div>
                  <button onClick={refreshLB} disabled={lbBusy} className="text-xs font-bold text-slate-500 hover:text-indigo-600 disabled:opacity-50">🔄 새로고침</button>
                </div>
                <div className="space-y-1">
                  {leaderboard.slice(0, 5).map((e, i) => {
                    const isMine = e.time === finalTime && e.name === name.trim();
                    return (
                      <div key={i} className={`flex justify-between items-center px-3 py-2 rounded-lg text-sm md:text-base font-bold ${isMine ? 'bg-indigo-200 text-indigo-900 ring-2 ring-indigo-500' : i === 0 ? 'bg-yellow-100 text-yellow-800' : 'bg-slate-100 text-slate-700'}`}>
                        <span>{i+1}. {e.name}{isMine && ' ⭐'}</span>
                        <span className="font-mono">{formatTime(e.time)}</span>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="flex flex-col sm:flex-row gap-3">
                <button
                  onClick={() => { setName(''); resetGame(); }}
                  className="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl transition"
                >
                  👥 다음 사람
                </button>
                <button
                  onClick={() => { setCountdown(3); setScreen('countdown'); }}
                  className="flex-1 bg-gradient-to-r from-indigo-600 to-pink-600 hover:from-indigo-700 hover:to-pink-700 text-white font-black py-3 rounded-xl shadow-lg transition active:scale-95"
                >
                  🔁 다시 도전
                </button>
              </div>
            </div>
          </div>
        );
      }

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
