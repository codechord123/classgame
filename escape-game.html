<body class="bg-slate-900 overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ============== 수학 유틸 ==============
    const gcd = (a, b) => (b === 0 ? a : gcd(b, a % b));
    const lcmOf = (a, b) => (a * b) / gcd(a, b);
    const rint = (n) => Math.floor(Math.random() * n);
    const shuffle = (arr) => {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    };

    function normalizeAnswer(num, den) {
      const g = gcd(num, den);
      const rn = num / g, rd = den / g;
      const whole = Math.floor(rn / rd);
      const remN = rn % rd;
      if (remN === 0) return { whole, n: 0, d: 1 };
      return { whole, n: remN, d: rd };
    }
    function rawAnswer(num, den) {
      const whole = Math.floor(num / den);
      const remN = num % den;
      if (remN === 0) return { whole, n: 0, d: 1 };
      return { whole, n: remN, d: den };
    }
    function sameAnswer(a, b) {
      if (a.whole !== b.whole) return false;
      if (a.n === 0 && b.n === 0) return true;
      return a.n === b.n && a.d === b.d;
    }
    function validAnswer(a) {
      return a && a.whole >= 0 && a.n >= 0 && a.d >= 1 && (a.n === 0 || a.n < a.d);
    }
    function buildChoices(correct, candidates) {
      const choices = [correct];
      for (const c of candidates) {
        if (choices.length >= 4) break;
        if (validAnswer(c) && !choices.some(x => sameAnswer(x, c))) choices.push(c);
      }
      let tries = 0;
      while (choices.length < 4 && tries < 40) {
        tries++;
        const base = choices[choices.length - 1];
        const dir = Math.random() < 0.5 ? 1 : -1;
        let cand;
        if (base.n === 0) cand = { whole: Math.max(0, base.whole + dir), n: 1 + rint(3), d: 2 + rint(6) };
        else cand = { whole: Math.max(0, base.whole + dir), n: base.n, d: base.d };
        if (validAnswer(cand) && !choices.some(x => sameAnswer(x, cand))) choices.push(cand);
      }
      return shuffle(choices);
    }

    // 이분모 덧셈 (lcmCap 으로 난이도 제어)
    function makeDiffDenomAdd(lcmCap) {
      let d1, d2, tries = 0;
      do {
        d1 = 2 + rint(9);
        d2 = 2 + rint(9);
        tries++;
        if (tries > 60) { d1 = 3; d2 = 4; break; }
      } while (d1 === d2 || lcmOf(d1, d2) > lcmCap);
      const n1 = 1 + rint(d1 - 1);
      const n2 = 1 + rint(d2 - 1);
      const lcm = lcmOf(d1, d2);
      const sumNum = n1 * (lcm / d1) + n2 * (lcm / d2);
      const correct = normalizeAnswer(sumNum, lcm);
      const candidates = [
        rawAnswer(sumNum, lcm),
        normalizeAnswer(n1 + n2, lcm),
        normalizeAnswer(n1 + n2, d1 + d2),
        normalizeAnswer(sumNum + 1, lcm),
        normalizeAnswer(Math.max(1, sumNum - 1), lcm),
      ];
      return { op: '+', tag: '이분모 덧셈 (통분·약분)', a: { n: n1, d: d1 }, b: { n: n2, d: d2 }, correctAnswer: correct, choices: buildChoices(correct, candidates) };
    }

    // 이분모 뺄셈
    function makeDiffDenomSub(lcmCap) {
      let d1, d2, tries = 0;
      do {
        d1 = 2 + rint(9);
        d2 = 2 + rint(9);
        tries++;
        if (tries > 60) { d1 = 3; d2 = 4; break; }
      } while (d1 === d2 || lcmOf(d1, d2) > lcmCap);
      let n1 = 1 + rint(d1 - 1);
      let n2 = 1 + rint(d2 - 1);
      const lcm = lcmOf(d1, d2);
      let a = n1 * (lcm / d1), b = n2 * (lcm / d2);
      if (a === b) { n1 = n1 < d1 - 1 ? n1 + 1 : Math.max(1, n1 - 1); a = n1 * (lcm / d1); }
      if (a < b) { [d1, d2] = [d2, d1]; [n1, n2] = [n2, n1]; [a, b] = [b, a]; }
      const diffNum = a - b;
      const correct = normalizeAnswer(diffNum, lcm);
      const candidates = [
        rawAnswer(diffNum, lcm),
        normalizeAnswer(Math.max(1, n1 - n2), lcm),
        normalizeAnswer(diffNum + 1, lcm),
        normalizeAnswer(Math.max(1, diffNum - 1), lcm),
        normalizeAnswer(a + b, lcm),
      ];
      return { op: '-', tag: '이분모 뺄셈 (통분·약분)', a: { n: n1, d: d1 }, b: { n: n2, d: d2 }, correctAnswer: correct, choices: buildChoices(correct, candidates) };
    }

    const generateProblem = (lcmCap) => {
      return Math.random() < 0.5 ? makeDiffDenomAdd(lcmCap) : makeDiffDenomSub(lcmCap);
    };

    // ============== 방 구성 ==============
    // objects: 방 안을 돌아다니며 조사할 수 있는 물건들. 매 판마다 이 중 3개에 열쇠가 숨겨짐.
    const ROOMS = [
      { id: 1, name: '실험실', emoji: '🧪', lcmCap: 12, bg: 'from-slate-800 via-emerald-900 to-slate-900',
        objects: [
          { emoji: '🧪', name: '시험관' }, { emoji: '⚗️', name: '플라스크' }, { emoji: '🗄️', name: '캐비닛' },
          { emoji: '🔬', name: '현미경' }, { emoji: '📦', name: '실험 상자' }, { emoji: '🧫', name: '배양 접시' },
        ] },
      { id: 2, name: '도서관', emoji: '📚', lcmCap: 15, bg: 'from-amber-900 via-yellow-950 to-stone-900',
        objects: [
          { emoji: '📕', name: '낡은 책' }, { emoji: '📗', name: '두꺼운 백과사전' }, { emoji: '🕰️', name: '괘종시계' },
          { emoji: '🗃️', name: '서랍장' }, { emoji: '🪑', name: '오래된 의자' }, { emoji: '🕯️', name: '촛대' },
        ] },
      { id: 3, name: '시계탑', emoji: '⏰', lcmCap: 18, bg: 'from-indigo-900 via-purple-950 to-slate-900',
        objects: [
          { emoji: '⚙️', name: '거대한 톱니' }, { emoji: '🕰️', name: '벽시계' }, { emoji: '🔔', name: '청동 종' },
          { emoji: '🪜', name: '낡은 사다리' }, { emoji: '🧰', name: '공구함' }, { emoji: '📦', name: '나무 상자' },
        ] },
      { id: 4, name: '비밀의 정원', emoji: '🌿', lcmCap: 20, bg: 'from-emerald-800 via-green-900 to-teal-950',
        objects: [
          { emoji: '🌸', name: '커다란 꽃' }, { emoji: '🪨', name: '이끼 낀 바위' }, { emoji: '🏺', name: '깨진 화분' },
          { emoji: '🍄', name: '수상한 버섯' }, { emoji: '⛲', name: '분수대' }, { emoji: '🌳', name: '고목나무' },
        ] },
      { id: 5, name: '고대 사원', emoji: '🏛️', lcmCap: 24, bg: 'from-stone-800 via-orange-950 to-stone-950',
        objects: [
          { emoji: '🏺', name: '고대 항아리' }, { emoji: '🗿', name: '석상' }, { emoji: '📜', name: '두루마리' },
          { emoji: '🪔', name: '등잔' }, { emoji: '⚱️', name: '봉인된 단지' }, { emoji: '🧱', name: '헐거운 벽돌' },
        ] },
      { id: 6, name: '우주 정거장', emoji: '🚀', lcmCap: 24, bg: 'from-slate-950 via-indigo-950 to-purple-950',
        objects: [
          { emoji: '🎛️', name: '컨트롤 패널' }, { emoji: '📡', name: '안테나' }, { emoji: '🧯', name: '소화기' },
          { emoji: '🛰️', name: '위성 모형' }, { emoji: '🪛', name: '공구 세트' }, { emoji: '📦', name: '보급 상자' },
        ] },
      { id: 7, name: '보물 창고', emoji: '💎', lcmCap: 30, bg: 'from-amber-900 via-rose-950 to-stone-950',
        objects: [
          { emoji: '💰', name: '금화 주머니' }, { emoji: '🏺', name: '황금 항아리' }, { emoji: '👑', name: '왕관' },
          { emoji: '🗿', name: '수호 석상' }, { emoji: '💎', name: '보석함' }, { emoji: '⚱️', name: '고대 단지' },
        ] },
    ];
    const TOTAL_ROOMS = ROOMS.length;
    const KEYS_PER_ROOM = 3;

    // 물건 배치 좌표 (% 단위, 게임 영역 기준) — 바닥 영역에 골고루
    const OBJECT_SPOTS = [
      { x: 15, y: 38 }, { x: 50, y: 32 }, { x: 84, y: 40 },
      { x: 22, y: 66 }, { x: 58, y: 72 }, { x: 86, y: 68 },
    ];
    const DOOR_POS = { x: 50, y: 12 };
    const SPAWN_POS = { x: 14, y: 84 };

    // ============== 모둠 ==============
    const TEAMS = [
      { id: 1, name: '1모둠', emoji: '🔴', grad: 'from-red-500 to-rose-600',     bg: 'bg-red-50',     text: 'text-red-700',     border: 'border-red-400'     },
      { id: 2, name: '2모둠', emoji: '🔵', grad: 'from-blue-500 to-indigo-600',  bg: 'bg-blue-50',    text: 'text-blue-700',    border: 'border-blue-400'    },
      { id: 3, name: '3모둠', emoji: '🟢', grad: 'from-emerald-500 to-green-600',bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-400' },
      { id: 4, name: '4모둠', emoji: '🟠', grad: 'from-orange-500 to-amber-600', bg: 'bg-orange-50',  text: 'text-orange-700',  border: 'border-orange-400'  },
      { id: 5, name: '5모둠', emoji: '🟣', grad: 'from-purple-500 to-fuchsia-600',bg: 'bg-purple-50', text: 'text-purple-700',  border: 'border-purple-400'  },
      { id: 0, name: '익명',  emoji: '🎭', grad: 'from-slate-500 to-slate-700',  bg: 'bg-slate-100',  text: 'text-slate-700',   border: 'border-slate-400'   },
    ];
    const TEAM_SIZE = 5;
    const teamMeta = (id) => TEAMS.find(t => t.id === Number(id)) || null;

    function bestPerPlayer(entries) {
      const best = {};
      entries.forEach(e => {
        if (!e || !e.name || typeof e.time !== 'number') return;
        const key = `${e.name}#${e.team || 0}`;
        if (!best[key] || e.time < best[key].time) best[key] = e;
      });
      return Object.values(best).sort((a, b) => a.time - b.time);
    }
    function computeTeamStats(entries) {
      const playersBest = bestPerPlayer(entries);
      const teams = {};
      TEAMS.filter(t => t.id !== 0).forEach(t => { teams[t.id] = { team: t.id, players: [], sum: 0, count: 0, avg: 0 }; });
      playersBest.forEach(e => {
        const t = Number(e.team);
        if (!teams[t]) return; // 익명(0)은 모둠 통계 제외
        teams[t].players.push(e);
      });
      const arr = Object.values(teams).map(t => {
        const players = t.players.slice().sort((a,b) => a.time - b.time);
        const sum = players.reduce((acc, p) => acc + p.time, 0);
        const count = players.length;
        const avg = count > 0 ? sum / count : 0;
        return { team: t.team, players, sum, count, avg };
      });
      arr.sort((a, b) => {
        if (a.count !== b.count) return b.count - a.count;
        if (a.count === 0) return 0;
        return a.sum - b.sum;
      });
      return arr;
    }

    // ============== 분수 표시 ==============
    const Frac = ({ n, d, color = "text-slate-800", size = "text-2xl sm:text-3xl md:text-4xl" }) => (
      <span className={`inline-flex flex-col items-center mx-1 ${color} ${size} font-black leading-none`}>
        <span className="text-current">{n}</span>
        <span className="block w-full border-b-[3px] border-current my-0.5"></span>
        <span className="text-current">{d}</span>
      </span>
    );
    const FracOrMixed = ({ whole = 0, n = 0, d = 1, color = "text-slate-800", size = "text-2xl sm:text-3xl md:text-4xl" }) => {
      if (n === 0) return <span className={`inline-block mx-1 ${color} font-black ${size}`}>{whole}</span>;
      if (whole === 0) return <Frac n={n} d={d} color={color} size={size} />;
      return (
        <span className={`inline-flex items-center mx-1 ${color} font-black`}>
          <span className={`mr-1 text-current ${size}`}>{whole}</span>
          <Frac n={n} d={d} color={color} size={size} />
        </span>
      );
    };

    const formatTime = (ms) => {
      const totalCs = Math.floor(ms / 10);
      const m = Math.floor(totalCs / 6000);
      const s = Math.floor((totalCs % 6000) / 100);
      const cs = totalCs % 100;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
    };

    // ============== 리더보드 (방탈출 전용 키) ==============
    const LB_KEY = 'fraction-escape-game-leaderboard-v1';
    const loadLocalLB = () => { try { return JSON.parse(localStorage.getItem(LB_KEY) || '[]'); } catch { return []; } };
    const saveLocalLB = (entries) => { try { localStorage.setItem(LB_KEY, JSON.stringify(entries)); } catch {} };
    const isGAS = () => typeof window !== 'undefined' && window.google && window.google.script && window.google.script.run;

    function runnerWithTimeout(timeoutMs) {
      return function (callFn) {
        return new Promise(function (resolve, reject) {
          if (!isGAS()) { reject(new Error('not GAS')); return; }
          var done = false;
          var timer = setTimeout(function () {
            if (!done) { done = true; reject(new Error('서버 응답 시간 초과')); }
          }, timeoutMs);
          try {
            var runner = google.script.run
              .withSuccessHandler(function (v) { if (!done) { done = true; clearTimeout(timer); resolve(v); } })
              .withFailureHandler(function (e) {
                if (!done) { done = true; clearTimeout(timer); reject(e instanceof Error ? e : new Error((e && e.message) || String(e))); }
              });
            callFn(runner);
          } catch (e) {
            if (!done) { done = true; clearTimeout(timer); reject(e); }
          }
        });
      };
    }
    var runGAS = runnerWithTimeout(10000);

    async function fetchLeaderboard() {
      if (isGAS()) {
        try {
          const data = await runGAS(function (r) { r.getLeaderboardEscape(); });
          if (Array.isArray(data)) return data;
        } catch (e) { console.warn('getLeaderboardEscape 실패, 로컬 사용:', e); }
      }
      return loadLocalLB();
    }
    async function submitScoreRemote(name, team, time) {
      if (isGAS()) {
        try {
          const data = await runGAS(function (r) { r.submitScoreEscape(name, team, time); });
          if (Array.isArray(data)) return { data, saved: 'remote', error: null };
        } catch (e) {
          const msg = (e && e.message) || String(e);
          const entry = { name, team: Number(team) || 0, time, date: Date.now() };
          const updated = [...loadLocalLB(), entry];
          saveLocalLB(updated.slice(-200));
          return { data: updated, saved: 'local-fallback', error: msg };
        }
      }
      const entry = { name, team: Number(team) || 0, time, date: Date.now() };
      const updated = [...loadLocalLB(), entry];
      saveLocalLB(updated.slice(-200));
      return { data: updated, saved: 'local', error: null };
    }
    async function clearLeaderboardRemote(password) {
      if (isGAS()) {
        await runGAS(function (r) { r.clearLeaderboardEscape(password); });
        return [];

    );

    // ============== 풀이 메모장 (펜슬/손가락 손글씨) ==============
    const DrawPad = () => {
      const canvasRef = useRef(null);
      const wrapRef = useRef(null);
      const [tool, setTool] = useState('pen');
      const toolRef = useRef('pen');
      toolRef.current = tool;
      const drawingRef = useRef(false);
      const lastRef = useRef({ x: 0, y: 0 });
      const penSeenRef = useRef(false); // 펜슬 감지 시 손바닥(터치) 무시

      const clearCanvas = () => {
        const c = canvasRef.current;
        if (!c) return;
        const ctx = c.getContext('2d');
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.restore();
      };

      useEffect(() => {
        const c = canvasRef.current;
        if (!c) return;
        const setup = () => {
          const rect = c.getBoundingClientRect();
          if (rect.width === 0 || rect.height === 0) return;
          const dpr = window.devicePixelRatio || 1;
          c.width = rect.width * dpr;
          c.height = rect.height * dpr;
          const ctx = c.getContext('2d');
          ctx.scale(dpr, dpr);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
        };
        // 레이아웃 확정 후 사이즈 잡기
        const raf = requestAnimationFrame(setup);
        return () => cancelAnimationFrame(raf);
      }, []);

      const getPos = (e) => {
        const rect = canvasRef.current.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top, p: e.pressure || 0.5, type: e.pointerType };
      };
      const down = (e) => {
        if (e.pointerType === 'pen') penSeenRef.current = true;
        if (e.pointerType === 'touch' && penSeenRef.current) return;
        e.preventDefault();
        try { canvasRef.current.setPointerCapture(e.pointerId); } catch {}
        drawingRef.current = true;
        lastRef.current = getPos(e);
      };
      const move = (e) => {
        if (!drawingRef.current) return;
        if (e.pointerType === 'touch' && penSeenRef.current) return;
        e.preventDefault();
        const pos = getPos(e);
        const ctx = canvasRef.current.getContext('2d');
        if (toolRef.current === 'eraser') {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.lineWidth = 24;
        } else {
          ctx.globalCompositeOperation = 'source-over';
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = pos.type === 'pen' ? Math.max(1.2, 4.5 * pos.p) : 2.5; // 펜슬 필압 반영
        }
        ctx.beginPath();
        ctx.moveTo(lastRef.current.x, lastRef.current.y);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        lastRef.current = pos;
      };
      const up = () => { drawingRef.current = false; };

      return (
        <div ref={wrapRef} className="flex flex-col h-full">
          <div className="flex items-center justify-between mb-1.5 gap-1">
            <span className="font-display text-slate-600 text-xs sm:text-sm whitespace-nowrap">✏️ 풀이 메모장</span>
            <div className="flex gap-1">
              <button type="button" onClick={() => setTool('pen')}
                className={`px-2 py-1 rounded-lg text-[11px] sm:text-xs font-bold transition ${tool === 'pen' ? 'bg-indigo-500 text-white shadow' : 'bg-slate-100 text-slate-500'}`}>✏️ 펜</button>
              <button type="button" onClick={() => setTool('eraser')}
                className={`px-2 py-1 rounded-lg text-[11px] sm:text-xs font-bold transition ${tool === 'eraser' ? 'bg-rose-500 text-white shadow' : 'bg-slate-100 text-slate-500'}`}>🧽 지우개</button>
              <button type="button" onClick={clearCanvas}
                className="px-2 py-1 rounded-lg text-[11px] sm:text-xs font-bold bg-slate-100 text-slate-500 hover:bg-slate-200 transition">🗑️ 모두</button>
            </div>
          </div>
          <canvas ref={canvasRef}
            onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onPointerLeave={up}
            className="w-full flex-1 min-h-[150px] md:min-h-[280px] bg-amber-50/90 rounded-xl border-2 border-dashed border-amber-300 cursor-crosshair"
            style={{ touchAction: 'none' }} />
          <div className="text-[9px] sm:text-[10px] text-slate-400 mt-1 text-center">디벗 펜슬이나 손가락으로 통분 과정을 적어보세요</div>
        </div>
      );
    };

    // ============== 메인 ==============
    const PENALTY_MS = 8000;
    const CHAR_SPEED = 36; // %/초

    function App() {
      const [screen, setScreen] = useState('title');
      const [name, setName] = useState('');
      const [team, setTeam] = useState(null);
      const [roomIdx, setRoomIdx] = useState(0);
      const [objects, setObjects] = useState([]);   // {id, emoji, name, x, y, hasKey, opened, examined}
      const [keysFound, setKeysFound] = useState(0);
      const [nearTarget, setNearTarget] = useState(null); // {type:'object', id} | {type:'door'}
      const [modal, setModal] = useState(null);     // {objId, problem}
      const [modalFeedback, setModalFeedback] = useState(null);
      const [toast, setToast] = useState(null);     // {id, text}
      const [keyGetAnim, setKeyGetAnim] = useState(0);
      const [elapsed, setElapsed] = useState(0);
      const [countdown, setCountdown] = useState(3);
      const [finalTime, setFinalTime] = useState(0);
      const [leaderboard, setLeaderboard] = useState([]);
      const [lbBusy, setLbBusy] = useState(false);
      const [lbUpdatedAt, setLbUpdatedAt] = useState(0);
      const [showPwModal, setShowPwModal] = useState(false);
      const [pwInput, setPwInput] = useState('');
      const [lbTab, setLbTab] = useState('team');
      const [confettiBits, setConfettiBits] = useState([]);
      const [usingRemote, setUsingRemote] = useState(false);
      const [submitStatus, setSubmitStatus] = useState(null);
      const [moving, setMoving] = useState(false);
      const [facing, setFacing] = useState(1); // 1 오른쪽, -1 왼쪽

      const startRef = useRef(0);
      const penaltyRef = useRef(0);
      const rafTimerRef = useRef(null);
      const lockRef = useRef(false);

      // 캐릭터 이동용 ref
      const areaRef = useRef(null);
      const charRef = useRef(null);
      const posRef = useRef({ ...SPAWN_POS });
      const dirRef = useRef({ x: 0, y: 0 });       // 터치 D-패드
      const keysDownRef = useRef(new Set());        // 키보드
      const moveRafRef = useRef(null);
      const toastIdRef = useRef(0);

      const playersBest = useMemo(() => bestPerPlayer(leaderboard), [leaderboard]);
      const teamStats = useMemo(() => computeTeamStats(leaderboard), [leaderboard]);

      const currentRoom = ROOMS[roomIdx];

      const refreshLB = useCallback(async () => {
        setLbBusy(true);
        try {
          const data = await fetchLeaderboard();
          setLeaderboard(data);
          setLbUpdatedAt(Date.now());
        } catch (e) { console.warn(e); }
        finally { setLbBusy(false); }
      }, []);

      useEffect(() => { setUsingRemote(isGAS()); refreshLB(); }, [refreshLB]);

      const showToast = useCallback((text) => {
        toastIdRef.current += 1;
        setToast({ id: toastIdRef.current, text });
      }, []);

      // 방 초기화: 물건 배치 + 열쇠 3개 랜덤 숨김
      const initRoom = useCallback((idx) => {
        const room = ROOMS[idx];
        const spots = shuffle(OBJECT_SPOTS);
        const keyIdx = new Set(shuffle([0,1,2,3,4,5]).slice(0, KEYS_PER_ROOM));
        const objs = room.objects.map((o, i) => ({
          id: i, emoji: o.emoji, name: o.name,
          x: spots[i].x, y: spots[i].y,
          hasKey: keyIdx.has(i), opened: false, examined: false,
        }));
        setObjects(objs);
        setKeysFound(0);
        setNearTarget(null);
        setModal(null);
        setModalFeedback(null);
        posRef.current = { ...SPAWN_POS };
        if (charRef.current) {
          charRef.current.style.left = SPAWN_POS.x + '%';
          charRef.current.style.top = SPAWN_POS.y + '%';
        }
      }, []);

      // 타이머
      useEffect(() => {
        if (screen !== 'playing') return;
        const tick = () => {
          setElapsed(Date.now() - startRef.current + penaltyRef.current);
          rafTimerRef.current = requestAnimationFrame(tick);
        };
        rafTimerRef.current = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafTimerRef.current);
      }, [screen]);

      // 카운트다운
      useEffect(() => {
        if (screen !== 'countdown') return;
        if (countdown <= 0) {
          startRef.current = Date.now();
          penaltyRef.current = 0;
          setElapsed(0);
          setRoomIdx(0);
          initRoom(0);
          setScreen('playing');
          return;
        }
        const t = setTimeout(() => setCountdown(c => c - 1), 700);
        return () => clearTimeout(t);
      }, [screen, countdown, initRoom]);

      // ===== 키보드 입력 =====
      useEffect(() => {
        const down = (e) => {
          if (screen !== 'playing') return;
          const k = e.key.toLowerCase();
          if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)) {
            e.preventDefault();
            keysDownRef.current.add(k);
          }
          if ((k === ' ' || k === 'enter' || k === 'e') && !modal) {
            e.preventDefault();
            interactRef.current && interactRef.current();
          }
        };
        const up = (e) => { keysDownRef.current.delete(e.key.toLowerCase()); };
        window.addEventListener('keydown', down);
        window.addEventListener('keyup', up);
        return () => { window.removeEventListener('keydown', down); window.removeEventListener('keyup', up); };
      }, [screen, modal]);

      // ===== 이동 루프 =====
      const objectsRef = useRef(objects);
      objectsRef.current = objects;
      const keysFoundRef = useRef(keysFound);
      keysFoundRef.current = keysFound;
      const modalRef = useRef(modal);
      modalRef.current = modal;
      const nearTargetRef = useRef(nearTarget);
      nearTargetRef.current = nearTarget;

      useEffect(() => {
        if (screen !== 'playing') return;
        let last = performance.now();
        let movingNow = false;

        const loop = (now) => {
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;

          let dx = dirRef.current.x, dy = dirRef.current.y;
          const kd = keysDownRef.current;
          if (kd.has('arrowleft') || kd.has('a')) dx -= 1;
          if (kd.has('arrowright') || kd.has('d')) dx += 1;
          if (kd.has('arrowup') || kd.has('w')) dy -= 1;
          if (kd.has('arrowdown') || kd.has('s')) dy += 1;
          dx = Math.max(-1, Math.min(1, dx));
          dy = Math.max(-1, Math.min(1, dy));

          const isMoving = (dx !== 0 || dy !== 0) && !modalRef.current;
          if (isMoving !== movingNow) { movingNow = isMoving; setMoving(isMoving); }
          if (dx > 0) setFacing(1);
          else if (dx < 0) setFacing(-1);

          if (isMoving) {
            const len = Math.hypot(dx, dy) || 1;
            const p = posRef.current;
            p.x = Math.max(4, Math.min(96, p.x + (dx/len) * CHAR_SPEED * dt));
            p.y = Math.max(7, Math.min(92, p.y + (dy/len) * CHAR_SPEED * dt));
            if (charRef.current) {
              charRef.current.style.left = p.x + '%';
              charRef.current.style.top = p.y + '%';
            }
          }

          // 근접 감지
          const area = areaRef.current;
          if (area) {
            const rect = area.getBoundingClientRect();
            const px = posRef.current.x / 100 * rect.width;
            const py = posRef.current.y / 100 * rect.height;
            const radius = Math.max(55, Math.min(rect.width, rect.height) * 0.13);

            let best = null, bestDist = Infinity;
            objectsRef.current.forEach(o => {
              if (o.opened) return;
              const ox = o.x / 100 * rect.width, oy = o.y / 100 * rect.height;
              const dist = Math.hypot(px - ox, py - oy);
              if (dist < radius && dist < bestDist) { best = { type: 'object', id: o.id }; bestDist = dist; }
            });
            const doorX = DOOR_POS.x / 100 * rect.width, doorY = DOOR_POS.y / 100 * rect.height;
            const doorDist = Math.hypot(px - doorX, py - doorY);
            if (doorDist < radius && doorDist < bestDist) best = { type: 'door' };

            const cur = nearTargetRef.current;
            const same = (cur === null && best === null) ||
              (cur && best && cur.type === best.type && cur.id === best.id);
            if (!same) setNearTarget(best);
          }

          moveRafRef.current = requestAnimationFrame(loop);
        };
        moveRafRef.current = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(moveRafRef.current);
      }, [screen]);

      // ===== 다음 방 / 클리어 =====
      const proceedAfterRoom = useCallback(() => {
        setScreen('roomCleared');
        setTimeout(() => {
          const nextRoom = roomIdx + 1;
          if (nextRoom >= TOTAL_ROOMS) {
            const bits = Array.from({ length: 40 }).map((_, i) => ({
              id: i,
              tx: (Math.random() - 0.5) * 900,
              ty: (Math.random() - 0.5) * 700 - 120,
              r: Math.random() * 720 - 360,
              emoji: ['🎉','✨','⭐','🏆','💎','🗝️','🔓'][Math.floor(Math.random()*7)]
            }));
            setConfettiBits(bits);
            setScreen('finishing');
            setTimeout(async () => {
              const t = Date.now() - startRef.current + penaltyRef.current;
              setFinalTime(t);
              setLbBusy(true);
              const result = await submitScoreRemote(name.trim(), team, t);
              setLeaderboard(result.data);
              setSubmitStatus({ saved: result.saved, error: result.error });
              setLbUpdatedAt(Date.now());
              setLbBusy(false);
              setScreen('result');
            }, 1800);
          } else {
            setRoomIdx(nextRoom);
            initRoom(nextRoom);
            setScreen('playing');
            lockRef.current = false;
          }
        }, 1800);
      }, [roomIdx, name, team, initRoom]);

      // ===== 조사(상호작용) =====
      const interact = useCallback(() => {
        if (screen !== 'playing' || modalRef.current || lockRef.current) return;
        const target = nearTargetRef.current;
        if (!target) return;

        if (target.type === 'door') {
          if (keysFoundRef.current >= KEYS_PER_ROOM) {
            lockRef.current = true;
            proceedAfterRoom();
          } else {
            showToast(`🔒 문이 잠겨있다! 열쇠 ${KEYS_PER_ROOM - keysFoundRef.current}개 더 필요해`);
          }
          return;
        }

        const obj = objectsRef.current.find(o => o.id === target.id);
        if (!obj || obj.opened) return;

        if (obj.hasKey) {
          // 분수 문제 출제!
          setModal({ objId: obj.id, problem: generateProblem(ROOMS[roomIdx].lcmCap) });
          setModalFeedback(null);
        } else {
          if (!obj.examined) {
            setObjects(prev => prev.map(o => o.id === obj.id ? { ...o, examined: true } : o));
          }
          showToast(`${obj.emoji} ${obj.name}... 열쇠가 없다!`);
        }
      }, [screen, roomIdx, proceedAfterRoom, showToast]);

      const interactRef = useRef(interact);
      interactRef.current = interact;

      // ===== 문제 풀이 =====
      const handleAnswer = (choice) => {
        if (!modal || lockRef.current) return;
        const isCorrect = sameAnswer(choice, modal.problem.correctAnswer);
        lockRef.current = true;

        if (isCorrect) {
          setModalFeedback('correct');
          setTimeout(() => {
            setObjects(prev => prev.map(o => o.id === modal.objId ? { ...o, opened: true } : o));
            setKeysFound(k => k + 1);
            setKeyGetAnim(a => a + 1);
            setModal(null);
            setModalFeedback(null);
            showToast('🗝️ 열쇠 획득!');
            lockRef.current = false;
          }, 700);
        } else {
          penaltyRef.current += PENALTY_MS;
          setModalFeedback('wrong');
          setTimeout(() => {
            setModalFeedback(null);
            lockRef.current = false;
          }, 700);
        }
      };

      const startGame = () => {
        if (!name.trim() || team === null) return;
        setCountdown(3);
        setScreen('countdown');
      };
      const useAnonymous = () => {
        if (!name.trim()) setName(`익명${Math.floor(Math.random() * 900) + 100}`);
        setTeam(0);
      };
      const resetGame = (clearName = false) => {
        setScreen('title');
        setElapsed(0); setModal(null); setModalFeedback(null);
        lockRef.current = false;
        if (clearName) { setName(''); setTeam(null); }
        refreshLB();
      };
      const clearLB = () => { setPwInput(''); setShowPwModal(true); };
      const doActualClear = async () => {
        setShowPwModal(false);
        setLbBusy(true);
        try {
          const data = await clearLeaderboardRemote(pwInput);
          setLeaderboard(data);
          setLbUpdatedAt(Date.now());
        } catch (e) {
          alert((e && e.message) || '비밀번호가 틀렸거나 서버 오류가 발생했습니다.');
        } finally { setLbBusy(false); }
      };

      // D-패드 핸들러
      const dpadPress = (dx, dy) => (e) => { e.preventDefault(); dirRef.current = { x: dx, y: dy }; };
      const dpadRelease = (e) => { e.preventDefault(); dirRef.current = { x: 0, y: 0 }; };

      const TeamPicker = ({ value, onChange }) => (
        <div className="space-y-2">
          <div className="grid grid-cols-5 gap-1.5 md:gap-2">
            {TEAMS.filter(t => t.id !== 0).map(t => (
              <button key={t.id} onClick={() => onChange(t.id)} type="button"
                className={`py-2 md:py-2.5 rounded-xl font-black text-sm md:text-base transition border-2 ${value === t.id ? `bg-gradient-to-br ${t.grad} text-white border-white shadow-lg scale-105` : `${t.bg} ${t.text} border-transparent hover:scale-105`}`}>
                {t.id}모둠
              </button>
            ))}
          </div>
          <button onClick={() => { useAnonymous(); }} type="button"
            className={`w-full py-2 md:py-2.5 rounded-xl font-black text-sm md:text-base transition border-2 flex items-center justify-center gap-2 ${value === 0 ? 'bg-gradient-to-br from-slate-500 to-slate-700 text-white border-white shadow-lg scale-[1.02]' : 'bg-slate-100 text-slate-700 border-transparent hover:scale-[1.02]'}`}>
            🎭 익명으로 참가 {value === 0 && '(선택됨)'}
          </button>
        </div>
      );

      const TeamLeaderboard = ({ stats, highlightTeam }) => (
        <div className="space-y-2">
          {stats.map((ts, i) => {
            const m = teamMeta(ts.team);
            if (!m) return null;
            const isHighlight = highlightTeam === ts.team;
            const isTop = i === 0 && ts.count > 0;
            return (
              <div key={ts.team} className={`rounded-xl p-2.5 md:p-3 border-l-4 ${m.border} ${isHighlight ? 'bg-indigo-50 ring-2 ring-indigo-400' : isTop ? 'bg-yellow-50' : 'bg-slate-50'}`}>
                <div className="flex justify-between items-center mb-1">
                  <div className={`font-black text-sm md:text-base flex items-center gap-1.5 ${m.text}`}>
                    <span className="bg-white/80 text-slate-700 px-1.5 py-0.5 rounded-md text-xs">{i+1}위</span>
                    {m.emoji} {m.name}
                    {isHighlight && <span className="text-[10px] bg-indigo-500 text-white px-1.5 py-0.5 rounded-md">우리 모둠</span>}
                  </div>
                  <span className="text-xs md:text-sm font-bold text-slate-500">{ts.count}/{TEAM_SIZE}명</span>
                </div>
                <div className="flex justify-between text-xs md:text-sm">
                  <span className="text-slate-600">합산: <span className="font-mono font-bold text-slate-800">{ts.count > 0 ? formatTime(ts.sum) : '-'}</span></span>
                  <span className="text-slate-600">평균: <span className="font-mono font-bold text-slate-800">{ts.count > 0 ? formatTime(ts.avg) : '-'}</span></span>
                </div>
                {ts.players.length > 0 && (
                  <div className="mt-1.5 pl-2 border-l-2 border-slate-200 space-y-0.5">
                    {ts.players.map((p, j) => (
                      <div key={j} className="flex justify-between text-[11px] md:text-xs text-slate-600">
                        <span className="truncate">{j+1}. {p.name}</span>
                        <span className="font-mono">{formatTime(p.time)}</span>
                      </div>
                    ))}
                    {Array.from({length: Math.max(0, TEAM_SIZE - ts.players.length)}).map((_, j) => (
                      <div key={`empty-${j}`} className="flex justify-between text-[11px] md:text-xs text-slate-300">
                        <span>· · · · · ·</span>
                        <span className="font-mono">--:--.--</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );

      const IndividualLeaderboard = ({ entries, highlight }) => (
        <div className="space-y-1">
          {entries.length === 0 && <div className="text-slate-400 text-center py-3 text-sm">아직 기록이 없습니다.</div>}
          {entries.slice(0, 15).map((e, i) => {
            const m = teamMeta(e.team);
            const isMine = highlight && e.name === highlight.name && Number(e.team) === Number(highlight.team) && e.time === highlight.time;
            return (
              <div key={i} className={`flex justify-between items-center px-3 py-2 rounded-lg text-sm md:text-base font-bold ${isMine ? 'bg-indigo-200 text-indigo-900 ring-2 ring-indigo-500' : i === 0 ? 'bg-yellow-100 text-yellow-800' : i === 1 ? 'bg-slate-100 text-slate-700' : i === 2 ? 'bg-amber-100 text-amber-800' : 'bg-slate-50 text-slate-600'}`}>
                <span className="flex items-center gap-1.5 min-w-0">
                  <span>{i+1}.</span>
                  <span className="truncate">{e.name}</span>
                  {m && <span className={`text-[10px] md:text-xs px-1.5 py-0.5 rounded ${m.bg} ${m.text} font-black`}>{m.emoji}{m.id === 0 ? '' : m.id}</span>}
                  {isMine && <span> ⭐</span>}
                </span>
                <span className="font-mono">{formatTime(e.time)}</span>
              </div>
            );
          })}
        </div>
      );

      const LeaderboardSection = ({ highlight }) => (
        <>
          {showPwModal && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50" onClick={() => setShowPwModal(false)}>
              <div className="bg-white rounded-2xl p-6 w-80 shadow-2xl" onClick={e => e.stopPropagation()}>
                <h3 className="font-black text-slate-800 text-lg mb-1">🔒 선생님 인증</h3>
                <p className="text-slate-500 text-sm mb-4">명예의 전당 전체 초기화는 선생님만 가능합니다.</p>
                <input type="password" value={pwInput} onChange={e => setPwInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && doActualClear()}
                  placeholder="비밀번호" autoFocus
                  className="w-full px-4 py-2.5 rounded-xl border-2 border-slate-300 focus:border-indigo-500 outline-none mb-3 text-slate-800" />
                <div className="flex gap-2">
                  <button onClick={() => setShowPwModal(false)}
                    className="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 rounded-xl transition">취소</button>
                  <button onClick={doActualClear}
                    className="flex-1 bg-rose-500 hover:bg-rose-600 text-white font-black py-2.5 rounded-xl shadow transition">초기화</button>
                </div>
              </div>
            </div>
          )}
          <div className="text-left">
            <div className="flex items-center justify-between mb-2">
              <div className="font-black text-slate-700 flex items-center gap-1.5">
                🏆 명예의 전당
                {usingRemote
                  ? <span className="text-[10px] md:text-xs bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded-md font-bold">실시간 공유</span>
                  : <span className="text-[10px] md:text-xs bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded-md font-bold">기기 저장</span>}
              </div>
              <div className="flex gap-2 items-center">
                {lbUpdatedAt > 0 && (
                  <span className="text-[10px] text-slate-400 font-mono">
                    {new Date(lbUpdatedAt).toLocaleTimeString('ko-KR', { hour12: false })} · {leaderboard.length}건
                  </span>
                )}
                <button onClick={refreshLB} disabled={lbBusy} className="text-xs font-bold text-slate-500 hover:text-indigo-600 disabled:opacity-50">{lbBusy ? '⏳' : '🔄'} 새로고침</button>
                <button onClick={clearLB} disabled={lbBusy} className="text-xs text-slate-400 hover:text-rose-500 underline disabled:opacity-50">초기화</button>
              </div>
            </div>
            <div className="flex gap-1 bg-slate-100 p-1 rounded-xl mb-3">
              <button onClick={() => setLbTab('team')} className={`flex-1 py-2 rounded-lg font-bold text-sm transition ${lbTab === 'team' ? 'bg-white text-indigo-600 shadow' : 'text-slate-500'}`}>🤝 모둠전</button>
              <button onClick={() => setLbTab('individual')} className={`flex-1 py-2 rounded-lg font-bold text-sm transition ${lbTab === 'individual' ? 'bg-white text-indigo-600 shadow' : 'text-slate-500'}`}>🏆 개인전</button>
            </div>
            {lbBusy && leaderboard.length === 0 && <div className="text-slate-400 text-center py-3 text-sm">불러오는 중...</div>}
            {lbTab === 'team' && <TeamLeaderboard stats={teamStats} highlightTeam={highlight?.team} />}
            {lbTab === 'individual' && <IndividualLeaderboard entries={playersBest} highlight={highlight} />}
          </div>
        </>
      );

      // ============== 화면: 타이틀 ==============
      if (screen === 'title') {
        return (
          <div className="vignette relative w-full h-[100dvh] bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 flex flex-col overflow-hidden">
            <div className="absolute inset-0 opacity-40"><RoomScene roomId={5} /></div>
            <AmbientFX roomId={7} />
            <div className="relative z-10 flex-shrink-0 flex flex-col items-center px-4 pt-4 pb-2 gap-2">
              <div className="text-center text-white">
                <div className="text-4xl sm:text-5xl drop-shadow-2xl">🗝️</div>
                <h1 className="font-display text-3xl sm:text-4xl md:text-5xl tracking-wider text-yellow-300 title-glow">분수 방탈출</h1>
                <p className="text-xs sm:text-sm text-white/85 font-bold mt-1 tracking-wide">7개의 방 · 숨겨진 열쇠 · 이분모 분수의 비밀</p>
              </div>

              <div className="glass-panel rounded-2xl shadow-2xl p-3 sm:p-5 w-full max-w-lg animate-fade-in">
                <div className="bg-amber-50 border border-amber-200 rounded-xl p-2 sm:p-3 text-left text-[11px] sm:text-xs md:text-sm text-amber-900 mb-3 leading-relaxed break-keep">
                  <span className="font-bold">📜 게임 방법: </span>
                  캐릭터를 움직여 방 안 물건을 <strong>조사</strong>하세요 · 열쇠가 숨겨진 물건에선 <strong>이분모 분수 문제</strong>가! · 맞히면 🗝️ 획득 · <strong>열쇠 3개</strong>를 모아 문으로 탈출 · 총 <strong>7개 방</strong> · 오답 <strong className="text-rose-600">+8초</strong>
                  <div className="mt-1 text-[10px] sm:text-[11px] text-amber-700">🎮 PC: 방향키/WASD 이동, 스페이스로 조사 · 📱 화면 버튼으로 이동/조사</div>
                </div>
                <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="내 이름 (또는 익명으로 참가)"
                  className="w-full px-4 py-2.5 sm:py-3 rounded-xl border-2 border-slate-300 focus:border-indigo-500 outline-none mb-3 font-bold text-slate-800" />
                <TeamPicker value={team} onChange={setTeam} />
                <button onClick={startGame} disabled={!name.trim() || team === null}
                  className="w-full mt-3 bg-gradient-to-r from-amber-500 via-orange-500 to-rose-500 hover:from-amber-400 hover:via-orange-400 hover:to-rose-400 disabled:from-slate-300 disabled:via-slate-300 disabled:to-slate-400 text-white font-display py-3 sm:py-4 rounded-xl shadow-[0_8px_24px_rgba(249,115,22,0.4)] text-lg sm:text-xl tracking-wider transition ring-2 ring-white/30">
                  🚪 탐험 시작
                </button>
                <div className="mt-3 grid grid-cols-7 gap-1">
                  {ROOMS.map((r) => (
                    <div key={r.id} className="bg-slate-100 rounded-lg p-1.5 text-center text-[10px] sm:text-xs">
                      <div className="text-base sm:text-xl">{r.emoji}</div>
                      <div className="font-black text-slate-700 truncate">{r.id}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            <div className="relative z-10 flex-1 overflow-y-auto px-4 pb-4 hide-scrollbar">
              <div className="glass-panel rounded-2xl shadow-2xl p-3 sm:p-5 w-full max-w-lg mx-auto">
                <LeaderboardSection />
              </div>
            </div>
          </div>
        );
      }

      // ============== 화면: 카운트다운 ==============
      if (screen === 'countdown') {
        return (
          <div className="vignette relative w-full h-[100dvh] bg-slate-950 flex items-center justify-center overflow-hidden">
            <div className="absolute inset-0 opacity-25"><RoomScene roomId={1} /></div>
            <div className="relative z-10 text-center">
              <div className="mx-auto w-fit mb-3"><ExplorerChar moving={true} facing={1} /></div>
              <div className="font-display text-yellow-300 text-7xl sm:text-9xl drop-shadow-[0_0_30px_rgba(251,191,36,0.5)]">{countdown || 'GO!'}</div>
              <div className="text-white/70 text-sm sm:text-base font-bold mt-3 tracking-widest">{ROOMS[0].emoji} {ROOMS[0].name}에 잠입한다...</div>
            </div>
          </div>
        );
      }

      // ============== 화면: 방 클리어 ==============
      if (screen === 'roomCleared') {
        const room = currentRoom;
        const nextRoom = ROOMS[roomIdx + 1];
        return (
          <div className={`relative w-full h-[100dvh] bg-gradient-to-br ${room.bg} flex flex-col items-center justify-center p-4 overflow-hidden`}>
            <RoomScene roomId={room.id} />
            <div className="relative z-10 glass-panel rounded-3xl shadow-2xl p-5 sm:p-8 max-w-md w-full animate-fade-in text-center">
              <div className="text-5xl sm:text-7xl mb-2">🚪✨</div>
              <div className="text-xs sm:text-sm font-black text-slate-500 mb-1">방 {room.id} 탈출!</div>
              <h2 className="font-display text-2xl sm:text-3xl text-slate-800 mb-3 tracking-wide">{room.emoji} {room.name}</h2>
              <div className="font-mono text-lg sm:text-2xl font-black text-indigo-600 mb-3">{formatTime(elapsed)}</div>
              {nextRoom && (
                <div className="mt-4 text-slate-600 text-sm sm:text-base">
                  <div className="font-bold">다음 방으로 이동 중...</div>
                  <div className="mt-1 text-xl sm:text-2xl font-black text-slate-800">{nextRoom.emoji} {nextRoom.name}</div>
                </div>
              )}
            </div>
          </div>
        );
      }

      // ============== 화면: 결승 폭죽 ==============
      if (screen === 'finishing') {
        return (
          <div className="w-full h-[100dvh] bg-gradient-to-br from-yellow-500 via-orange-500 to-rose-600 flex items-center justify-center relative overflow-hidden">
            {confettiBits.map(b => (
              <span key={b.id} className="absolute text-3xl confetti"
                style={{ '--tx': `${b.tx}px`, '--ty': `${b.ty}px`, '--r': `${b.r}deg` }}>
                {b.emoji}
              </span>
            ))}
            <div className="text-center text-white drop-shadow-2xl animate-fade-in">
              <div className="text-7xl sm:text-9xl">🏆</div>
              <div className="font-display text-4xl sm:text-6xl mt-2 tracking-wider title-glow">전체 탈출 성공!</div>
            </div>
          </div>
        );
      }

      // ============== 화면: 결과 ==============
      if (screen === 'result') {
        const highlight = { name: name.trim(), team, time: finalTime };
        return (
          <div className="w-full h-[100dvh] bg-gradient-to-br from-indigo-700 via-purple-700 to-slate-900 flex flex-col overflow-hidden">
            <div className="flex-shrink-0 px-3 sm:px-4 pt-3 sm:pt-4 pb-2">
              <div className="glass-panel rounded-2xl shadow-2xl p-3 sm:p-5 max-w-lg mx-auto animate-fade-in">
                <div className="text-center">
                  <div className="text-3xl sm:text-5xl mb-1">🗝️🏆</div>
                  <h2 className="font-display text-xl sm:text-3xl text-slate-800 tracking-wide">7개 방 전체 탈출!</h2>
                  <div className="font-mono text-3xl sm:text-5xl font-black text-indigo-600 mt-1">{formatTime(finalTime)}</div>
                  <div className="text-xs sm:text-sm text-slate-500 mt-1">
                    {name} · {teamMeta(team)?.name}
                  </div>
                </div>
                {submitStatus && (
                  <div className={`mt-3 text-xs sm:text-sm font-bold rounded-lg p-2 text-center
                    ${submitStatus.saved === 'remote' ? 'bg-emerald-50 text-emerald-700' :
                      submitStatus.saved === 'local-fallback' ? 'bg-amber-50 text-amber-700' :
                      'bg-sky-50 text-sky-700'}`}>
                    {submitStatus.saved === 'remote' && '✅ 공유 명예의 전당에 기록됨'}
                    {submitStatus.saved === 'local-fallback' && `⚠️ 서버 저장 실패, 기기에만 임시 저장 (${submitStatus.error || '오류'})`}
                    {submitStatus.saved === 'local' && 'ℹ️ 이 기기에만 기록 저장됨 (앱스크립트 미연결)'}
                  </div>
                )}
                <div className="grid grid-cols-2 gap-2 mt-3">
                  <button onClick={() => { setCountdown(3); setScreen('countdown'); }}
                    className="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-black py-2.5 sm:py-3 rounded-xl shadow transition">🔁 다시 도전</button>
                  <button onClick={() => resetGame(true)}
                    className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-black py-2.5 sm:py-3 rounded-xl transition">🏠 처음으로</button>
                </div>
              </div>
            </div>
            <div className="flex-1 overflow-y-auto px-3 sm:px-4 pb-4 hide-scrollbar">
              <div className="glass-panel rounded-2xl shadow-2xl p-3 sm:p-5 max-w-lg mx-auto">
                <LeaderboardSection highlight={highlight} />
              </div>
            </div>
          </div>
        );
      }

      // ============== 화면: 플레이 (탐험!) ==============
      if (screen === 'playing') {
        const room = currentRoom;
        const doorUnlocked = keysFound >= KEYS_PER_ROOM;
        const nearObj = nearTarget && nearTarget.type === 'object'
          ? objects.find(o => o.id === nearTarget.id) : null;
        const nearDoor = nearTarget && nearTarget.type === 'door';

        return (
          <div className={`relative w-full h-[100dvh] bg-gradient-to-br ${room.bg} flex flex-col overflow-hidden`}>
            {/* HUD */}
            <div className="relative flex-shrink-0 glass-dark text-white px-3 py-2 flex items-center justify-between gap-2 z-30 border-b border-white/10">
              <div className="flex items-center gap-2 min-w-0">
                <span className="text-xl sm:text-2xl drop-shadow-lg">{room.emoji}</span>
                <div className="min-w-0">
                  <div className="flex items-center gap-1 mb-0.5">
                    {ROOMS.map(r => (
                      <span key={r.id} className={`w-1.5 h-1.5 rounded-full transition-all ${r.id - 1 < roomIdx ? 'bg-emerald-400' : r.id - 1 === roomIdx ? 'bg-yellow-300 ring-2 ring-yellow-300/40 scale-125' : 'bg-white/25'}`} />
                    ))}
                  </div>
                  <div className="text-sm sm:text-lg font-display tracking-wide truncate">{room.name}</div>
                </div>
              </div>
              {/* 열쇠 수집 현황 */}
              <div key={keyGetAnim} className="flex items-center gap-1 bg-black/40 border border-yellow-500/30 rounded-xl px-2.5 py-1 shadow-inner">
                {[...Array(KEYS_PER_ROOM)].map((_, i) => (
                  <span key={i} className={`text-lg sm:text-2xl ${i < keysFound ? (i === keysFound-1 ? 'key-pop' : '') : 'opacity-25 grayscale'}`}>🗝️</span>
                ))}
              </div>
              <div className="font-mono font-black text-base sm:text-xl bg-black/40 border border-white/10 rounded-xl px-2.5 py-1 tabular-nums">{formatTime(elapsed)}</div>
            </div>

            {/* ===== 게임 영역 (탐험) ===== */}
            <div ref={areaRef} className="vignette relative flex-1 overflow-hidden select-none">
              <RoomScene roomId={room.id} />
              <AmbientFX roomId={room.id} />

              {/* 문 */}
              <div className="absolute z-10 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center"
                style={{ left: DOOR_POS.x + '%', top: DOOR_POS.y + '%' }}
                onClick={() => { if (nearDoor) interact(); }}>
                {doorUnlocked && <div className="text-xl sm:text-2xl sparkle absolute -top-6 z-10">✨</div>}
                <div className={`${doorUnlocked ? 'glow' : 'drop-shadow-[0_5px_8px_rgba(0,0,0,0.6)]'} ${nearDoor ? 'cursor-pointer scale-105' : ''} transition-transform`}>
                  <DoorSprite unlocked={doorUnlocked} />
                </div>
                <div className={`text-[9px] sm:text-xs font-display px-2 py-0.5 rounded-md -mt-1 shadow-lg ${doorUnlocked ? 'bg-gradient-to-r from-yellow-400 to-amber-400 text-yellow-950' : 'glass-dark text-white/90'}`}>
                  {doorUnlocked ? '탈출구 OPEN!' : `🔒 열쇠 ${KEYS_PER_ROOM}개`}
                </div>
                {nearDoor && (
                  <div className="absolute -top-10 glass-panel text-slate-800 text-[10px] sm:text-xs font-display px-2.5 py-1 rounded-lg shadow-2xl bounce-soft whitespace-nowrap">
                    {doorUnlocked ? '🔓 조사 버튼으로 탈출!' : '잠겨있다...'}
                  </div>
                )}
              </div>

              {/* 물건들 */}
              {objects.map(o => {
                const isNear = nearObj && nearObj.id === o.id;
                return (
                  <div key={o.id}
                    className="absolute z-10 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center"
                    style={{ left: o.x + '%', top: o.y + '%' }}
                    onClick={() => { if (isNear) interact(); }}>
                    {/* 바닥 그림자 */}
                    <div className="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-1.5 w-10 sm:w-12 h-2.5 bg-black/40 rounded-full blur-[3px]" />
                    {isNear && !o.opened && (
                      <>
                        <div className="pulse-ring absolute inset-0 -m-2 rounded-full border-2 border-yellow-300/80" />
                        <div className="absolute -top-9 glass-dark text-yellow-200 text-[10px] sm:text-xs font-display px-2.5 py-1 rounded-lg bounce-soft whitespace-nowrap shadow-2xl">🔍 {o.name}</div>
                      </>
                    )}
                    <div className={`relative text-3xl sm:text-4xl md:text-5xl transition-all duration-200 ${o.opened ? 'opacity-35 grayscale' : ''} ${o.examined && !o.hasKey ? 'opacity-50' : ''} ${isNear && !o.opened ? 'scale-125 cursor-pointer drop-shadow-[0_0_12px_rgba(253,224,71,0.9)]' : 'drop-shadow-[0_4px_5px_rgba(0,0,0,0.55)]'}`}>
                      {o.emoji}
                    </div>
                    {o.opened && <div className="text-[9px] sm:text-[11px] font-display text-emerald-300 glass-dark px-1.5 py-0.5 rounded-md">✔ 획득</div>}
                    {o.examined && !o.hasKey && !o.opened && <div className="text-[9px] sm:text-[11px] font-display text-slate-300 glass-dark px-1.5 py-0.5 rounded-md">텅 빔</div>}
                  </div>
                );
              })}

              {/* 캐릭터 */}
              <div ref={charRef}
                className="absolute z-20 -translate-x-1/2 -translate-y-1/2 pointer-events-none"
                style={{ left: SPAWN_POS.x + '%', top: SPAWN_POS.y + '%' }}>
                <div className="drop-shadow-[0_6px_8px_rgba(0,0,0,0.55)]">
                  <ExplorerChar moving={moving} facing={facing} />
                </div>
                <div className="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-10 h-2.5 bg-black/35 rounded-full blur-[3px]" />
              </div>

              {/* 토스트 메시지 */}
              {toast && (
                <div key={toast.id} className="absolute left-1/2 -translate-x-1/2 bottom-[30%] z-40 toast-in pointer-events-none">
                  <div className="glass-dark text-white font-display text-sm sm:text-base px-4 py-2 rounded-2xl shadow-2xl whitespace-nowrap tracking-wide">
                    {toast.text}
                  </div>
                </div>
              )}

              {/* 안내 (처음) */}
              {keysFound === 0 && !objects.some(o => o.examined || o.opened) && !modal && (
                <div className="absolute left-1/2 -translate-x-1/2 top-[24%] z-10 pointer-events-none animate-fade-in">
                  <div className="bg-black/60 text-white/95 font-bold text-[11px] sm:text-sm px-3 py-1.5 rounded-xl text-center">
                    물건을 조사해서 🗝️ 열쇠 {KEYS_PER_ROOM}개를 찾아라!
                  </div>
                </div>
              )}
            </div>

            {/* ===== 조작 패널 (모바일 D-패드 + 조사 버튼) ===== */}
            <div className="relative flex-shrink-0 glass-dark px-3 py-2 sm:py-3 flex items-center justify-between z-30 border-t border-white/10">
              {/* D-패드 */}
              <div className="grid grid-cols-3 grid-rows-3 gap-0.5 w-[110px] h-[110px] sm:w-[130px] sm:h-[130px]">
                <div />
                <button className="dpad-btn bg-gradient-to-b from-white/25 to-white/10 active:from-yellow-400/70 active:to-amber-500/50 border border-white/20 shadow-lg rounded-xl text-white text-lg font-black flex items-center justify-center"
                  onPointerDown={dpadPress(0,-1)} onPointerUp={dpadRelease} onPointerLeave={dpadRelease} onPointerCancel={dpadRelease}>▲</button>
                <div />
                <button className="dpad-btn bg-gradient-to-b from-white/25 to-white/10 active:from-yellow-400/70 active:to-amber-500/50 border border-white/20 shadow-lg rounded-xl text-white text-lg font-black flex items-center justify-center"
                  onPointerDown={dpadPress(-1,0)} onPointerUp={dpadRelease} onPointerLeave={dpadRelease} onPointerCancel={dpadRelease}>◀</button>
                <div className="bg-white/5 rounded-lg" />
                <button className="dpad-btn bg-gradient-to-b from-white/25 to-white/10 active:from-yellow-400/70 active:to-amber-500/50 border border-white/20 shadow-lg rounded-xl text-white text-lg font-black flex items-center justify-center"
                  onPointerDown={dpadPress(1,0)} onPointerUp={dpadRelease} onPointerLeave={dpadRelease} onPointerCancel={dpadRelease}>▶</button>
                <div />
                <button className="dpad-btn bg-gradient-to-b from-white/25 to-white/10 active:from-yellow-400/70 active:to-amber-500/50 border border-white/20 shadow-lg rounded-xl text-white text-lg font-black flex items-center justify-center"
                  onPointerDown={dpadPress(0,1)} onPointerUp={dpadRelease} onPointerLeave={dpadRelease} onPointerCancel={dpadRelease}>▼</button>
                <div />
              </div>

              <div className="hidden md:block text-white/40 text-xs font-bold text-center">
                방향키/WASD 이동<br/>스페이스 조사
              </div>

              {/* 조사 버튼 */}
              <button onClick={interact}
                disabled={!nearTarget}
                className={`w-[90px] h-[90px] sm:w-[110px] sm:h-[110px] rounded-full font-display text-white text-sm sm:text-base flex flex-col items-center justify-center gap-0.5 border-4 transition active:scale-90
                  ${nearTarget
                    ? (nearDoor && doorUnlocked
                      ? 'bg-gradient-to-br from-yellow-400 to-orange-500 border-yellow-200 glow shadow-[0_0_24px_rgba(251,191,36,0.5)]'
                      : 'bg-gradient-to-br from-indigo-500 to-purple-600 border-indigo-300 shadow-[0_0_20px_rgba(129,140,248,0.45)]')
                    : 'bg-white/10 border-white/15 text-white/40'}`}>
                <span className="text-2xl sm:text-3xl">{nearDoor ? (doorUnlocked ? '🔓' : '🚪') : '🔍'}</span>
                {nearDoor ? (doorUnlocked ? '탈출!' : '문 조사') : nearObj ? '조사하기' : '가까이 가자'}
              </button>
            </div>

            {/* ===== 문제 모달 (열쇠 도전!) ===== */}
            {modal && (
              <div className="absolute inset-0 z-50 bg-black/75 backdrop-blur-[2px] flex items-center justify-center p-3">
                <div className={`glass-panel rounded-3xl shadow-[0_0_60px_rgba(251,191,36,0.25)] border-4 border-yellow-400/70 p-4 sm:p-6 w-full max-w-md md:max-w-3xl max-h-[94dvh] overflow-y-auto hide-scrollbar animate-fade-in ${modalFeedback === 'wrong' ? 'shake' : ''}`}>
                  <div className="text-center mb-2">
                    <div className="relative inline-block">
                      <div className="text-3xl sm:text-4xl mb-1">
                        {objects.find(o => o.id === modal.objId)?.emoji}
                      </div>
                      <div className="sparkle absolute -top-1 -right-4 text-lg">✨</div>
                    </div>
                    <div className="font-display text-slate-800 text-base sm:text-lg tracking-wide">
                      {objects.find(o => o.id === modal.objId)?.name} 속에 열쇠가 있다!
                    </div>
                    <div className="text-[11px] sm:text-xs text-slate-500">문제를 맞히면 🗝️ 열쇠 획득 · {modal.problem.tag}</div>
                  </div>

                  <div className="md:flex md:gap-5 md:items-stretch">
                  <div className="md:flex-1 md:min-w-0">
                  <div className="bg-slate-50 rounded-2xl border-2 border-slate-200 py-3 sm:py-4 mb-3 flex items-center justify-center">
                    <Frac n={modal.problem.a.n} d={modal.problem.a.d} size="text-3xl sm:text-4xl" />
                    <span className="font-black text-slate-800 text-3xl sm:text-4xl mx-1">{modal.problem.op}</span>
                    <Frac n={modal.problem.b.n} d={modal.problem.b.d} size="text-3xl sm:text-4xl" />
                    <span className="font-black text-slate-800 text-3xl sm:text-4xl ml-1">= ?</span>
                  </div>
                  <div className="text-center text-[10px] sm:text-xs text-slate-400 mb-2">기약분수/대분수로 답하세요</div>

                  <div className="grid grid-cols-2 gap-2">
                    {modal.problem.choices.map((c, i) => {
                      const colors = [
                        'from-sky-500 to-sky-700 border-sky-300',
                        'from-rose-500 to-rose-700 border-rose-300',
                        'from-emerald-500 to-emerald-700 border-emerald-300',
                        'from-amber-500 to-amber-700 border-amber-300',
                      ];
                      return (
                        <button key={i} onClick={() => handleAnswer(c)} disabled={lockRef.current}
                          className={`relative bg-gradient-to-br ${colors[i]} text-white rounded-xl px-2 py-3 border-[3px] shadow-lg active:scale-95 hover:scale-[1.02] transition-transform disabled:opacity-70 flex items-center justify-center min-h-[58px] sm:min-h-[70px]`}>
                          <span className="absolute top-1 left-1.5 text-[9px] sm:text-xs font-black opacity-90 bg-white/20 rounded px-1">{['A','B','C','D'][i]}</span>
                          <FracOrMixed whole={c.whole} n={c.n} d={c.d} color="text-white" size="text-xl sm:text-2xl" />
                        </button>
                      );
                    })}
                  </div>

                  {modalFeedback === 'correct' && (
                    <div className="mt-3 text-center font-black text-emerald-600 text-base sm:text-lg animate-fade-in">🗝️ 정답! 열쇠 획득!</div>
                  )}
                  {modalFeedback === 'wrong' && (
                    <div className="mt-3 text-center font-black text-rose-600 text-base sm:text-lg animate-fade-in">❌ 오답! +8초... 다시 도전!</div>
                  )}
                  </div>

                  {/* 풀이 메모장 (디벗 펜슬 지원) */}
                  <div className="mt-3 md:mt-0 md:w-[320px] md:flex-shrink-0 flex flex-col">
                    <DrawPad />
                  </div>
                  </div>

                  <button onClick={() => { if (!lockRef.current) { setModal(null); setModalFeedback(null); } }}
                    className="w-full mt-3 bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold py-2 rounded-xl text-xs sm:text-sm transition">
                    😅 일단 도망가기 (나중에 다시 도전)
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      return null;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
