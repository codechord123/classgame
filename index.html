  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }

    .animate-fade-in {

    }
    @keyframes bounce-short {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10%); }
    }
    .animate-bounce-short {
      animation: bounce-short 0.5s ease-in-out infinite;
    }
    /* 모바일 가로 스크롤바 숨기기 (깔끔한 UI 유지) */

      scrollbar-width: none;
    }
    /* 숫자 입력 화살표 숨기기 */

    const Shield = ({ size = 24, className = "" }) => (<svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>);

    const SettingsIcon = ({ size = 24, className = "" }) => (<svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>);
    const Sparkles = ({ size = 24, className = "" }) => (<svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"></path></svg>);

    // ==========================================
    // 수학 유틸리티 및 문제 생성 함수
    // ==========================================
    const getGCD = (a, b) => (b === 0 ? a : getGCD(b, a % b));
    const getLCM = (a, b) => (a * b) / getGCD(a, b);

    const getEgyptianFractions = (n, d) => {
      if (n === 0 || d === 0 || n >= d) return [];
      const fractions = [];
      let nr = n, dr = d;
      while (nr !== 0 && fractions.length < 6) {
        let c = Math.ceil(dr / nr);
        fractions.push(c);
        nr = nr * c - dr;
        dr = dr * c;
        let gcd = getGCD(Math.abs(nr), Math.abs(dr));
        nr /= gcd; dr /= gcd;
      }
      return fractions;
    };

    const generateFractionProblem = (difficultyLevel = 1) => {
      const isLCM = Math.random() > 0.5;
      const maxBase = 6 + (difficultyLevel * 2);
      let problem = {};

      if (isLCM) {
        let d1 = Math.floor(Math.random() * maxBase) + 2;
        let d2 = Math.floor(Math.random() * maxBase) + 2;
        while(d1 === d2) d2 = Math.floor(Math.random() * maxBase) + 2;

        let n1 = Math.floor(Math.random() * (d1 - 1)) + 1;
        let n2 = Math.floor(Math.random() * (d2 - 1)) + 1;
        const lcm = getLCM(d1, d2);

        problem = {
          type: 'common',
          qText: `통분: ${n1}/${d1}, ${n2}/${d2}`,
          ansN1: n1 * (lcm / d1),
          ansN2: n2 * (lcm / d2),
          ansD: lcm
        };
      } else {
        let d = Math.floor(Math.random() * (maxBase * 2)) + 4;
        let n = Math.floor(Math.random() * (d - 1)) + 1;
        let gcd = getGCD(n, d);
        while(gcd === 1) {
            d = Math.floor(Math.random() * (maxBase * 2)) + 4;
            n = Math.floor(Math.random() * (d - 1)) + 1;
            gcd = getGCD(n, d);
        }
        problem = {
          type: 'reduce',
          qText: `약분: ${n}/${d}`,
          ansN: n / gcd,
          ansD: d / gcd
        };
      }
      return problem;
    };

    // ==========================================
    // 모험(RPG) 전투용 문제 + 4지선다 보기 생성
    // ==========================================
    const shuffleArr = (arr) => {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    };

    // 약분 문제 한 개 생성
    const makeReduceProblem = (difficulty) => {
      const maxBase = 6 + difficulty * 2;
      let n, d, g;
      do {
        d = Math.floor(Math.random() * (maxBase * 2)) + 4;
        n = Math.floor(Math.random() * (d - 1)) + 1;
        g = getGCD(n, d);
      } while (g === 1);
      return { kind: 'reduce', n, d, ansN: n / g, ansD: d / g };
    };

    // 통분 문제 한 개 생성
    const makeCommonProblem = (difficulty) => {
      const maxBase = 6 + difficulty * 2;
      let d1 = Math.floor(Math.random() * maxBase) + 2;
      let d2 = Math.floor(Math.random() * maxBase) + 2;
      while (d1 === d2) d2 = Math.floor(Math.random() * maxBase) + 2;
      const n1 = Math.floor(Math.random() * (d1 - 1)) + 1;
      const n2 = Math.floor(Math.random() * (d2 - 1)) + 1;
      const lcm = getLCM(d1, d2);
      return {
        kind: 'common',
        n1, d1, n2, d2,
        ansN1: n1 * (lcm / d1), ansN2: n2 * (lcm / d2), ansD: lcm
      };
    };

    // 종류(reduce / common / mixed)와 난이도로 문제 + 보기 4개 생성
    const makeBattleProblem = (kind, difficulty) => {
      const realKind = kind === 'mixed' ? (Math.random() < 0.5 ? 'reduce' : 'common') : kind;
      const p = realKind === 'reduce' ? makeReduceProblem(difficulty) : makeCommonProblem(difficulty);

      if (p.kind === 'reduce') {
        const correct = { n: p.ansN, d: p.ansD };
        const keyOf = (o) => `${o.n}/${o.d}`;
        const used = new Set([keyOf(correct)]);
        const choices = [{ ...correct, correct: true }];
        const candidates = [
          { n: p.ansN + 1, d: p.ansD },
          { n: p.ansN, d: p.ansD + 1 },
          { n: p.ansN - 1, d: p.ansD },
          { n: p.n, d: p.d },            // 약분하지 않은 원래 분수
          { n: p.ansN, d: p.ansD - 1 },
          { n: p.ansN + 1, d: p.ansD + 1 }
        ];
        for (const c of shuffleArr(candidates)) {
          if (choices.length >= 4) break;
          if (c.n >= 1 && c.d >= 2 && c.n < c.d && !used.has(keyOf(c))) {
            used.add(keyOf(c));
            choices.push({ ...c, correct: false });
          }
        }
        let guard = 0;
        while (choices.length < 4 && guard++ < 40) {
          const c = { n: p.ansN, d: p.ansD + 1 + Math.floor(Math.random() * 4) };
          if (c.n < c.d && !used.has(keyOf(c))) { used.add(keyOf(c)); choices.push({ ...c, correct: false }); }
        }
        return { ...p, qText: `${p.n}/${p.d}`, choices: shuffleArr(choices) };
      } else {
        const correct = { n1: p.ansN1, n2: p.ansN2, d: p.ansD };
        const keyOf = (o) => `${o.n1}/${o.d},${o.n2}/${o.d}`;
        const used = new Set([keyOf(correct)]);
        const choices = [{ ...correct, correct: true }];
        const product = p.d1 * p.d2;
        const candidates = [
          { n1: p.ansN1 + 1, n2: p.ansN2, d: p.ansD },
          { n1: p.ansN1, n2: p.ansN2 + 1, d: p.ansD },
          { n1: p.ansN2, n2: p.ansN1, d: p.ansD },               // 분자 자리 바꿈
          { n1: p.n1 * p.d2, n2: p.n2 * p.d1, d: product },        // 최소공배수 대신 두 분모의 곱
          { n1: p.ansN1 - 1, n2: p.ansN2, d: p.ansD },
          { n1: p.ansN1, n2: p.ansN2 - 1, d: p.ansD }
        ];
        for (const c of shuffleArr(candidates)) {
          if (choices.length >= 4) break;
          if (c.n1 >= 1 && c.n2 >= 1 && c.d >= 2 && c.n1 < c.d && c.n2 < c.d && !used.has(keyOf(c))) {
            used.add(keyOf(c));
            choices.push({ ...c, correct: false });
          }
        }
        let guard = 0;
        while (choices.length < 4 && guard++ < 40) {
          const c = { n1: p.ansN1, n2: Math.min(p.ansN2 + 1 + Math.floor(Math.random() * 3), p.ansD - 1), d: p.ansD };
          if (c.n2 >= 1 && !used.has(keyOf(c))) { used.add(keyOf(c)); choices.push({ ...c, correct: false }); }
        }
        return { ...p, qText: `${p.n1}/${p.d1} 와 ${p.n2}/${p.d2}`, choices: shuffleArr(choices) };
      }
    };

    // 모험 캐릭터 정의 (성장형)
    const HEROES = {
      mage:    { id: 'mage',    name: '마법사 메릴', emoji: '🧙', maxHp: 70,  atk: 30, color: 'violet', tag: '강한 공격, 적은 체력', skill: '✨' },
      warrior: { id: 'warrior', name: '전사 강철',   emoji: '🛡️', maxHp: 120, atk: 18, color: 'rose',   tag: '튼튼한 체력, 안정적', skill: '⚔️' },
      archer:  { id: 'archer',  name: '궁수 바람',   emoji: '🏹', maxHp: 95,  atk: 24, color: 'emerald',tag: '균형 잡힌 능력치',   skill: '🎯' }
    };

    // 모험 스테이지 정의
    const ADV_STAGES = [
      { id: 1, name: '약분의 숲',     icon: '🌲', kind: 'reduce', difficulty: 1, count: 5, mhp: 45, matk: 8,  desc: '약분 기초', monsters: ['🟢','🍄','🐛'] },
      { id: 2, name: '약분의 동굴',   icon: '🕳️', kind: 'reduce', difficulty: 2, count: 6, mhp: 60, matk: 12, desc: '약분 심화', monsters: ['🦇','🕷️','🐻'] },
      { id: 3, name: '약분 마왕성',   icon: '🏰', kind: 'reduce', difficulty: 3, count: 6, mhp: 75, matk: 15, desc: '약분 보스', monsters: ['💀','👺','👹'] },
      { id: 4, name: '통분의 호수',   icon: '🌊', kind: 'common', difficulty: 1, count: 5, mhp: 55, matk: 10, desc: '통분 기초', monsters: ['🐟','🪼','🐢'] },
      { id: 5, name: '통분의 설산',   icon: '⛰️', kind: 'common', difficulty: 2, count: 6, mhp: 70, matk: 14, desc: '통분 심화', monsters: ['🦅','🐺','🧊'] },
      { id: 6, name: '통분 마왕성',   icon: '🌙', kind: 'common', difficulty: 3, count: 6, mhp: 85, matk: 17, desc: '통분 보스', monsters: ['👻','🦹','🧟'] },
      { id: 7, name: '최후의 결전',   icon: '👑', kind: 'mixed',  difficulty: 3, count: 8, mhp: 95, matk: 19, desc: '약분+통분', monsters: ['🔢','🐲','👑'] }
    ];

    const ADV_SAVE_KEY = 'fractionAdventureSave_v1';
    const expToNext = (lvl) => 40 + lvl * 25;

    // 공통 경로 상수
    const GAME_PATH = [
      { x: -10, y: 15 }, { x: 80, y: 15 }, { x: 80, y: 50 },
      { x: 20, y: 50 }, { x: 20, y: 85 }, { x: 100, y: 85 }

    // ==========================================
    // 메인 앱 컴포넌트
    // ==========================================
    function App() {
      const [activeTab, setActiveTab] = useState('explain');
      const [solvedCount, setSolvedCount] = useState(0);

      // 선생님 설정 - 목표 횟수 상태 관리
      const [targetCount, setTargetCount] = useState(30);
      const [showSettings, setShowSettings] = useState(false);

      const isDefenseUnlocked = solvedCount >= targetCount;

      return (
        <div className="w-full h-[100dvh] bg-slate-100 flex flex-col font-sans text-slate-800 md:p-4 lg:p-6 box-border overflow-hidden">
          <div className="w-full h-full max-w-7xl mx-auto bg-white shadow-none md:shadow-2xl rounded-none md:rounded-3xl flex flex-col overflow-hidden border-0 md:border border-slate-200 relative">

            {/* 고정 헤더 */}
            <div className="bg-gradient-to-r from-indigo-600 to-blue-500 p-4 md:p-6 text-center text-white relative overflow-hidden flex-shrink-0">
              <div className="absolute top-0 left-0 w-full h-full opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white to-transparent pointer-events-none"></div>
              <h1 className="text-2xl md:text-4xl lg:text-5xl font-black tracking-tight drop-shadow-md relative z-10">
                분수 마스터 프로
              </h1>
              <p className="mt-1 md:mt-2 text-indigo-100 text-xs sm:text-sm md:text-lg font-medium relative z-10">약분과 통분 정복하기</p>

              {/* 선생님 설정 버튼 */}
