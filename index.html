                  <AreaGridModel num={f1.n} den={f1.d} color="#4f46e5" mode={mode} isF1={true} lcm={commonLCM} />
                  <div className="hidden md:block text-slate-200 text-6xl font-black italic">VS</div>
                  <div className="block md:hidden text-slate-200 text-2xl font-black italic w-full text-center border-b-2 border-dashed border-slate-200 pb-2">VS</div>
                  <AreaGridModel num={f2.n} den={f2.d} color="#0d9488" mode={mode} isF1={false} lcm={commonLCM} />
                </div>
              </div>
            )}
            {subTab === 'numberLine' && (
              <div className="w-full max-w-4xl animate-fade-in space-y-16 sm:space-y-20 md:space-y-24 py-6 md:py-10 px-2 md:px-0">
                 <NumberLineModel num={f1.n} den={f1.d} color="#4f46e5" mode={mode} commonLCM={commonLCM} maxScale={maxScale} />
                 <NumberLineModel num={f2.n} den={f2.d} color="#0d9488" mode={mode} commonLCM={commonLCM} maxScale={maxScale} />
              </div>
            )}
            {subTab === 'egyptian' && (
              <div className="w-full max-w-4xl animate-fade-in flex flex-col items-center py-4 px-2 md:px-0">
                 <div className="flex flex-col md:flex-row justify-center items-center gap-6 md:gap-12 w-full">
                   <EgyptianModel num={f1.n} den={f1.d} color="#4f46e5" />
                   <div className="w-full h-px md:w-px md:h-64 bg-slate-200 hidden md:block"></div>
                   <div className="block md:hidden w-full text-center border-b-2 border-dashed border-slate-200 pb-2 my-2 text-slate-300 font-bold">AND</div>
                   <EgyptianModel num={f2.n} den={f2.d} color="#0d9488" />
                 </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function NumberLineModel({ num, den, color, mode, commonLCM, maxScale = 1 }) {
      const targetDen = mode === 'common' ? commonLCM : (mode === 'reduce' ? den / getGCD(num, den) : den);
      const targetNum = mode === 'common' ? num * (commonLCM / den) : (mode === 'reduce' ? num / getGCD(num, den) : num);

      const hasChanged = mode !== 'input' && (targetDen !== den || targetNum !== num);

      const renderLine = (currentNum, currentDen, isOriginal) => {
        const ratio = (currentNum / currentDen) / maxScale;
        const totalTicks = currentDen * maxScale;
        const renderTicks = totalTicks <= 120;

        let labelNode;
        if (isOriginal) {
           labelNode = (
             <div className="absolute -top-10 md:-top-12 left-1/2 transform -translate-x-1/2 px-2 md:px-3 py-0.5 md:py-1 rounded-lg text-white shadow-md z-10 whitespace-nowrap text-[10px] md:text-sm font-bold bg-slate-400">
               {currentNum} / {currentDen} <span className="text-slate-200 text-[9px] md:text-xs hidden sm:inline">(원래)</span>
               <div className="absolute -bottom-1 left-1/2 transform -translate-x-1/2 w-2 h-2 rotate-45 bg-slate-400"></div>
             </div>
           );
        } else {
           labelNode = (
             <div className="absolute -top-12 md:-top-14 left-1/2 transform -translate-x-1/2 px-2 md:px-3 py-1 md:py-1.5 rounded-lg text-white shadow-lg z-10 whitespace-nowrap flex items-center gap-1 md:gap-1.5" style={{ backgroundColor: color }}>
               {mode !== 'input' && hasChanged && (
                 <>
                   <span className="text-white/80 text-[10px] md:text-sm font-bold">{num} / {den}</span>
                   <span className="text-white/80 text-[10px] md:text-sm font-bold">=</span>
                 </>
               )}
               <span className="text-xs md:text-base font-black">{currentNum} / {currentDen}</span>
               {mode === 'reduce' && !hasChanged && mode !== 'input' && (
                 <span className="ml-1 text-[9px] md:text-xs text-yellow-300 font-bold hidden sm:inline">(기약)</span>
               )}
               <div className="absolute -bottom-1 left-1/2 transform -translate-x-1/2 w-2 h-2 rotate-45" style={{ backgroundColor: color }}></div>
             </div>
           );
        }

        return (
          <div className={`relative w-full h-10 md:h-16 ${isOriginal ? 'opacity-60' : ''}`}>
            <span className="absolute -left-1 md:-left-3 top-4 md:top-10 font-black text-sm md:text-xl text-slate-400">0</span>
            <span className="absolute -right-1 md:-right-3 top-4 md:top-10 font-black text-sm md:text-xl text-slate-400">{maxScale}</span>
            <div className="absolute top-2 md:top-5 left-0 right-0 h-1.5 md:h-3 bg-slate-200 rounded-full"></div>
            <div className="absolute top-1.5 md:top-4 left-0 h-2.5 md:h-5 rounded-full transition-all duration-700 shadow-sm" style={{ width: `calc(${ratio * 100}%)`, backgroundColor: isOriginal ? '#94a3b8' : color }}></div>
            <div className="absolute top-0.5 md:top-1 left-0 right-0 h-6 md:h-10 flex justify-between">
              {renderTicks ? (
                Array.from({ length: totalTicks + 1 }).map((_, i) => (
                  <div key={i} className="w-[1px] md:w-[2px] bg-slate-400 h-4 md:h-10 relative">
                     {i === currentNum && labelNode}
                  </div>
                ))
              ) : (
                <div className="absolute h-4 md:h-10 w-[1px] md:w-[2px] bg-slate-400" style={{ left: `calc(${(currentNum/totalTicks)*100}%)` }}>
                   {labelNode}
                </div>
              )}
            </div>
          </div>
        );
      };

      return (
        <div className="flex flex-col gap-6 md:gap-12 w-full">
          {hasChanged && renderLine(num, den, true)}
          {renderLine(targetNum, targetDen, false)}
        </div>
      );
    }

    function AreaGridModel({ num, den, color, mode, isF1, lcm }) {
      const viewBoxSize = 100;
      const m = lcm / den;
      const cols = isF1 ? den : (mode === 'common' ? m : 1);
      const rows = !isF1 ? den : (mode === 'common' ? m : 1);
      const fillWidth = isF1 ? (Math.min(num, den) / den) * viewBoxSize : viewBoxSize;
      const fillHeight = !isF1 ? (Math.min(num, den) / den) * viewBoxSize : viewBoxSize;

      const gcd = getGCD(num, den);
      const reducedNum = num / gcd;
      const reducedDen = den / gcd;

      const commonNum = num * m;
      const commonDen = lcm;

      return (
        <div className="flex flex-col items-center gap-3 md:gap-6 w-full">
          <div className="w-32 h-32 sm:w-48 sm:h-48 md:w-64 md:h-64 bg-white border-2 md:border-4 border-slate-300 shadow-inner relative overflow-hidden rounded-lg md:rounded-xl flex-shrink-0">
            <svg viewBox={`0 0 ${viewBoxSize} ${viewBoxSize}`} className="w-full h-full block">
              <rect x="0" y="0" width={fillWidth} height={fillHeight} fill={color} opacity="0.6" className="transition-all duration-700" />
              {Array.from({ length: rows - 1 }).map((_, i) => <line key={`h-${i}`} x1="0" y1={(viewBoxSize / rows) * (i + 1)} x2={viewBoxSize} y2={(viewBoxSize / rows) * (i + 1)} stroke="#94a3b8" strokeWidth="0.8" />)}
              {Array.from({ length: cols - 1 }).map((_, i) => <line key={`v-${i}`} x1={(viewBoxSize / cols) * (i + 1)} y1="0" x2={(viewBoxSize / cols) * (i + 1)} y2={viewBoxSize} stroke="#94a3b8" strokeWidth="0.8" />)}
            </svg>
          </div>
          <div className="flex flex-col items-center text-xl sm:text-2xl md:text-4xl font-black text-slate-700 w-full text-center">
            {mode === 'input' && (
              <span>{num} / {den}</span>
            )}
            {mode === 'reduce' && (
              <div className="flex flex-col items-center gap-1">
                <div className="flex items-center justify-center gap-2 md:gap-3 flex-wrap">
                  <span className="text-base sm:text-xl md:text-2xl text-slate-400 whitespace-nowrap">{num} / {den}</span>
                  <span className="text-base sm:text-xl md:text-2xl text-slate-300">=</span>
                  <span className="text-2xl sm:text-3xl md:text-4xl whitespace-nowrap" style={{ color }}>{reducedNum} / {reducedDen}</span>
                </div>
                {gcd === 1 && <span className="text-[10px] sm:text-xs md:text-sm font-bold text-emerald-500">(기약분수)</span>}
              </div>
            )}
            {mode === 'common' && (
              <div className="flex items-center justify-center gap-2 md:gap-3 flex-wrap">
                <span className="text-base sm:text-xl md:text-2xl text-slate-400 whitespace-nowrap">{num} / {den}</span>
                <span className="text-base sm:text-xl md:text-2xl text-slate-300">=</span>
                <span className="text-2xl sm:text-3xl md:text-4xl whitespace-nowrap" style={{ color }}>{commonNum} / {commonDen}</span>
              </div>
            )}
          </div>
        </div>
      );
    }

    function EgyptianModel({ num, den, color }) {
      if (num >= den) return <div className="text-slate-400 font-bold text-xs sm:text-sm md:text-lg text-center flex items-center justify-center w-full min-h-[60px] md:min-h-[100px] break-keep">진분수(분자 &lt; 분모)만 분해할 수 있습니다.</div>;
      const fractions = getEgyptianFractions(num, den);
      if (fractions.length === 0) return <div className="text-slate-400 font-bold text-sm md:text-lg text-center">분해할 수 없습니다.</div>;
      return (
        <div className="flex flex-col items-center gap-2 md:gap-6 w-full">
          <div className="flex flex-col items-center justify-center text-3xl sm:text-4xl md:text-5xl font-black" style={{ color }}>
            <span>{num}</span><div className="w-10 sm:w-12 md:w-16 h-1 bg-current my-1 md:my-2 rounded-full"></div><span>{den}</span>
          </div>
          <span className="text-slate-300 font-bold text-2xl sm:text-3xl md:text-4xl my-1 md:my-2">=</span>
          <div className="flex flex-wrap items-center justify-center gap-2 md:gap-4 w-full">
            {fractions.map((d, index) => (
              <React.Fragment key={index}>
                <div className="flex flex-col items-center gap-1 md:gap-3 bg-slate-50 p-2 md:p-4 rounded-xl md:rounded-2xl border border-slate-200 shadow-sm">
                  <svg viewBox="0 0 32 32" className="w-10 h-10 sm:w-16 sm:h-16 md:w-24 md:h-24 -rotate-90 rounded-full shadow-inner bg-slate-200 block">
                     <circle cx="16" cy="16" r="16" fill={color} opacity="0.8" strokeDasharray={`${(1/d) * 100.53} 100.53`} />
                  </svg>
                  <div className="flex flex-col items-center justify-center text-sm sm:text-lg md:text-xl font-black text-slate-700">
                    <span>1</span><div className="w-4 md:w-6 h-1 bg-slate-400 my-0.5 md:my-1 rounded-full"></div><span>{d}</span>
                  </div>
                </div>
                {index < fractions.length - 1 && <span className="text-slate-300 font-bold text-xl sm:text-2xl md:text-3xl">+</span>}
              </React.Fragment>
            ))}
          </div>
        </div>
      );
    }

    // ==========================================
    // 2. 훈련소 탭
    // ==========================================
    function PracticeTab({ solvedCount, setSolvedCount, targetCount, onGoToGame }) {
      const [problem, setProblem] = useState(() => generateFractionProblem(1));
      const [inputN, setInputN] = useState("");
      const [inputD, setInputD] = useState("");
      const [inputN2, setInputN2] = useState("");
      const [feedback, setFeedback] = useState(null);

      const handleSubmit = (e) => {
        e.preventDefault();
        let isCorrect = false;
        const uN = parseInt(inputN);
        const uD = parseInt(inputD);
        const uN2 = parseInt(inputN2);

        if (problem.type === 'common') {
          isCorrect = (uN === problem.ansN1 && uN2 === problem.ansN2 && uD === problem.ansD);
        } else {
          isCorrect = (uN === problem.ansN && uD === problem.ansD);
        }

        if (isCorrect) {
          setFeedback('correct');
          setTimeout(() => {
            setFeedback(null);
            setInputN(""); setInputD(""); setInputN2("");
            const newCount = solvedCount + 1;
            setSolvedCount(newCount);
            if (newCount < targetCount) {
              setProblem(generateFractionProblem(Math.floor(newCount / 5) + 1));
            }
          }, 1000);
        } else {
          setFeedback('wrong');
          setTimeout(() => setFeedback(null), 1000);
        }
      };

      const progressPercent = Math.min(100, (solvedCount / targetCount) * 100);

      if (solvedCount >= targetCount) {
        return (
          <div className="animate-fade-in flex flex-col items-center justify-center flex-1 w-full h-full text-center bg-stone-50 rounded-2xl md:rounded-3xl border border-stone-200 p-4">
            <div className="text-5xl md:text-6xl mb-4 md:mb-6">🎉</div>
            <h2 className="text-2xl sm:text-3xl md:text-4xl font-black text-stone-800 mb-2 md:mb-4">훈련 완료!</h2>
            <p className="text-sm sm:text-base md:text-lg text-stone-600 mb-6 md:mb-8 px-2 break-keep">성벽을 방어할 준비가 되었습니다.</p>
            <button onClick={onGoToGame} className="bg-gradient-to-r from-amber-500 to-amber-600 text-white px-6 sm:px-8 md:px-10 py-3 md:py-4 rounded-xl font-bold text-lg sm:text-xl md:text-2xl shadow-lg hover:scale-105 transition">
              디펜스 게임 입장하기
            </button>
          </div>
        );
      }

      return (
        <div className="animate-fade-in flex flex-col items-center justify-center w-full max-w-4xl mx-auto flex-1 py-2 md:py-10">
          <div className="w-full bg-stone-100 rounded-2xl md:rounded-3xl p-4 md:p-8 border border-stone-200 shadow-md relative overflow-hidden flex flex-col flex-1 min-h-[350px]">

            <div className="mb-4 md:mb-10 w-full flex-shrink-0">
              <div className="flex justify-between items-end mb-1 md:mb-2">
                <span className="font-bold text-stone-500 flex items-center gap-1 md:gap-2 text-xs md:text-base"><Swords size={16} className="md:w-5 md:h-5"/> 훈련 달성도</span>
                <span className="text-lg md:text-2xl font-black text-amber-600">{solvedCount} / {targetCount}</span>
              </div>
              <div className="w-full bg-stone-300 rounded-full h-2 md:h-4 overflow-hidden">
                <div className="bg-amber-500 h-full rounded-full transition-all duration-500" style={{ width: `${progressPercent}%` }}></div>
              </div>
            </div>

            <div className="bg-white rounded-xl md:rounded-2xl p-4 md:p-10 shadow-sm border border-stone-100 flex flex-col items-center flex-1 justify-center relative">
              <div className="text-amber-600 font-bold text-sm md:text-xl mb-3 md:mb-6 flex items-center gap-1 md:gap-2 text-center break-keep">
                <span className="bg-amber-100 p-1 md:p-2 rounded-full hidden sm:block">💡</span> 다음 분수를 올바르게 변환하세요.
              </div>

              <div className="text-2xl sm:text-3xl md:text-5xl font-black text-stone-800 mb-5 md:mb-10 bg-stone-50 px-4 md:px-8 py-3 md:py-6 rounded-xl md:rounded-2xl border-2 border-stone-200 text-center w-full break-keep overflow-hidden">
                {problem.qText}
              </div>

              <form onSubmit={handleSubmit} className="flex flex-col w-full items-center justify-center gap-4 md:gap-6">
                <div className="flex items-center justify-center w-full">
                  {problem.type === 'reduce' ? (
                    <div className="flex items-center justify-center gap-2 md:gap-4 flex-wrap">
                      <input type="number" required autoFocus value={inputN} onChange={e => setInputN(e.target.value)} placeholder="분자" className="w-16 h-12 sm:w-20 sm:h-14 md:w-24 md:h-16 text-center text-lg sm:text-xl md:text-3xl font-black bg-stone-50 border-2 border-stone-300 rounded-xl focus:border-amber-500 outline-none transition" />
                      <span className="text-stone-400 text-2xl md:text-4xl font-light">/</span>
                      <input type="number" required value={inputD} onChange={e => setInputD(e.target.value)} placeholder="분모" className="w-16 h-12 sm:w-20 sm:h-14 md:w-24 md:h-16 text-center text-lg sm:text-xl md:text-3xl font-black bg-stone-50 border-2 border-stone-300 rounded-xl focus:border-amber-500 outline-none transition" />
                    </div>
                  ) : (
                    <div className="flex items-center justify-center gap-1 sm:gap-2 md:gap-3 flex-wrap">
                      <div className="flex items-center gap-1 sm:gap-2">
                        <input type="number" required autoFocus value={inputN} onChange={e => setInputN(e.target.value)} placeholder="분자" className="w-12 h-10 sm:w-16 sm:h-12 md:w-20 md:h-16 text-center text-base sm:text-lg md:text-2xl font-black bg-stone-50 border-2 border-stone-300 rounded-lg md:rounded-xl focus:border-amber-500 outline-none transition px-0" />
                        <span className="text-stone-400 text-lg sm:text-xl md:text-3xl font-light">/</span>
                        <input type="number" required value={inputD} onChange={e => setInputD(e.target.value)} placeholder="공통" className="w-12 h-10 sm:w-16 sm:h-12 md:w-20 md:h-16 text-center text-base sm:text-lg md:text-2xl font-black bg-stone-50 border-2 border-amber-300 rounded-lg md:rounded-xl focus:border-amber-500 outline-none transition px-0" />
                      </div>
                      <span className="text-stone-300 font-bold text-xl sm:text-2xl md:text-4xl mx-1 sm:mx-2 pb-2">,</span>
                      <div className="flex items-center gap-1 sm:gap-2">
                        <input type="number" required value={inputN2} onChange={e => setInputN2(e.target.value)} placeholder="분자" className="w-12 h-10 sm:w-16 sm:h-12 md:w-20 md:h-16 text-center text-base sm:text-lg md:text-2xl font-black bg-stone-50 border-2 border-stone-300 rounded-lg md:rounded-xl focus:border-amber-500 outline-none transition px-0" />
                        <span className="text-stone-400 text-lg sm:text-xl md:text-3xl font-light">/</span>
                        <input type="number" required value={inputD} onChange={e => setInputD(e.target.value)} placeholder="공통" className="w-12 h-10 sm:w-16 sm:h-12 md:w-20 md:h-16 text-center text-base sm:text-lg md:text-2xl font-black bg-stone-50 border-2 border-amber-300 rounded-lg md:rounded-xl focus:border-amber-500 outline-none transition px-0" />
                      </div>
                    </div>
                  )}
                </div>

                <button type="submit" disabled={feedback !== null} className="w-full sm:w-auto bg-stone-800 hover:bg-stone-900 text-white font-bold px-6 sm:px-10 py-3 md:py-4 rounded-xl shadow-lg transition-transform hover:-translate-y-1 text-base sm:text-lg md:text-xl disabled:opacity-50 whitespace-nowrap mt-2">
                  정답 확인
                </button>
              </form>

              {feedback === 'correct' && (
                <div className="absolute inset-0 bg-white/95 flex flex-col justify-center items-center z-10 animate-fade-in rounded-xl md:rounded-2xl">
                  <div className="text-5xl md:text-8xl mb-2 md:mb-4 animate-bounce-short">⭕</div>
                  <h3 className="text-xl md:text-3xl font-black text-emerald-500">정답입니다!</h3>
                </div>
              )}
              {feedback === 'wrong' && (
                <div className="absolute inset-0 bg-white/95 flex flex-col justify-center items-center z-10 animate-fade-in rounded-xl md:rounded-2xl">
                  <div className="text-5xl md:text-8xl mb-2 md:mb-4 text-rose-500">❌</div>
                  <h3 className="text-xl md:text-3xl font-black text-rose-600">다시 생각해볼까요?</h3>
                </div>
              )}

            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 3. 캐슬 디펜스 게임 탭
    // ==========================================
    const WEAPONS = [
      { id: 'dagger', name: '단검', icon: '🗡️', cost: 35, desc: '타겟 즉시 처치' },
      { id: 'heal', name: '수리', icon: '🛠️', cost: 60, desc: '체력 +10' },
      { id: 'web', name: '거미줄', icon: '🕸️', cost: 90, desc: '4초간 전체 50% 둔화' },
      { id: 'bomb', name: '폭탄', icon: '💣', cost: 130, desc: '타겟 및 주변 폭사' },
      { id: 'poison', name: '독구름', icon: '☁️', cost: 200, desc: '무작위 3마리 처치' },
      { id: 'lightning', name: '번개', icon: '⚡', cost: 250, desc: '타겟 + 무작위 2마리' },
      { id: 'icespear', name: '얼음창', icon: '🧊', cost: 320, desc: '처치 + 2초 빙결' },
      { id: 'greatheal', name: '대회복', icon: '💖', cost: 280, desc: '체력 +30' },
      { id: 'blizzard', name: '눈보라', icon: '❄️', cost: 500, desc: '4초간 전체 빙결' },
      { id: 'swamp', name: '늪지대', icon: '늪', cost: 550, desc: '8초간 전체 70% 둔화' },
      { id: 'meteor', name: '메테오', icon: '☄️', cost: 900, desc: '최대 6마리 처치' },
      { id: 'holylight', name: '천상의 빛', icon: '✨', cost: 1500, desc: '체력 +60 & 최대 8마리' }
    ];

    function DefenseGameTab({ isUnlocked, requiredCount, currentCount, onGoToPractice, isActive }) {
      if (!isUnlocked) {
        return (
          <div className="flex flex-col items-center justify-center flex-1 h-full bg-slate-50 md:rounded-3xl border-2 border-dashed border-slate-300 p-4 text-center">
            <Lock size={48} className="text-slate-400 mb-4 md:mb-6 md:w-20 md:h-20" />
            <h2 className="text-xl md:text-3xl font-black text-slate-700 mb-2 md:mb-4">잠겨있는 구역입니다.</h2>
            <p className="text-sm md:text-lg text-slate-500 mb-6 md:mb-8 break-keep">
              훈련소에서 {requiredCount}문제를 풀어 자격을 증명하세요. <br/>
              현재 진행 상황: <strong className="text-amber-600">{currentCount} / {requiredCount}</strong>
            </p>
            <button onClick={onGoToPractice} className="bg-amber-500 hover:bg-amber-600 text-white px-6 md:px-8 py-3 md:py-4 rounded-lg font-bold text-base md:text-xl shadow transition whitespace-nowrap">
              훈련소로 이동하기
            </button>
          </div>
        );
      }

      const [gameState, setGameState] = useState('menu');
      const [hp, setHp] = useState(50);
      const [gold, setGold] = useState(30);
      const [score, setScore] = useState(0);
      const [level, setLevel] = useState(1);
      const [enemies, setEnemies] = useState([]);

      const [activeEnemyId, setActiveEnemyId] = useState(null);
      const [inputN, setInputN] = useState("");
      const [inputD, setInputD] = useState("");
      const [inputN2, setInputN2] = useState("");

      // 문제 풀이(골드 획득) 패널용 상태
      const [problem, setProblem] = useState(() => generateFractionProblem(1));
      const [solveFx, setSolveFx] = useState(null); // { type:'correct'|'wrong', amt, key }
      const solveFxTimer = useRef(null);

      const requestRef = useRef();
      const lastTimeRef = useRef();

      // 타이머 관리용 refs (무기 효과 충돌 방지)
      const freezeTimeoutRef = useRef(null);
      const slowTimeoutRef = useRef(null);

      // ====== 게임 상태/효과 refs (gameLoop 재생성 방지) ======
      const gameRef = useRef({ spawned: 0, eliminated: 0, maxEnemies: 10, spawnTimer: 0 });
      const enemiesRef = useRef([]); // 동기적 적 목록 (게임루프 전용)
      const levelRef = useRef(1);
      const isFrozenRef = useRef(false);
      const slowFactorRef = useRef(1.0);
      const activeEnemyIdRef = useRef(null);
      const gameStateRef = useRef('menu');
      const isActiveRef = useRef(isActive);

      const [isFrozen, setIsFrozen] = useState(false);
      const [isSlowed, setIsSlowed] = useState(false);

      // ref 동기화
      useEffect(() => { levelRef.current = level; }, [level]);
      useEffect(() => { isFrozenRef.current = isFrozen; }, [isFrozen]);
      useEffect(() => { activeEnemyIdRef.current = activeEnemyId; }, [activeEnemyId]);
      useEffect(() => { gameStateRef.current = gameState; }, [gameState]);
      useEffect(() => { isActiveRef.current = isActive; }, [isActive]);

      const spawnEnemy = useCallback(() => {
        if (gameRef.current.spawned >= gameRef.current.maxEnemies) return;

        const enemyIcons = ['🧟', '🦇', '🐺', '🐉', '💀', '👺', '🕷️', '🦂', '🐍', '🐊', '🦖', '🦑'];
        const currentLevel = levelRef.current;
        const baseSpeed = 1.0;
        const levelSpeedMultiplier = currentLevel * 0.3;
        const calculatedSpeed = Math.min(baseSpeed + levelSpeedMultiplier, 12);

        const enemy = {
          id: Math.random().toString(36).substr(2, 9),
          x: GAME_PATH[0].x, y: GAME_PATH[0].y, wp: 1,
          speed: calculatedSpeed * (0.9 + Math.random() * 0.2),
          icon: enemyIcons[Math.floor(Math.random() * enemyIcons.length)]
        };

        gameRef.current.spawned += 1;
        enemiesRef.current = [...enemiesRef.current, enemy];
        setEnemies(enemiesRef.current);
      }, []);

      // gameLoop은 한 번만 생성되고 모든 가변 상태는 ref로 읽음
      const gameLoop = useCallback((time) => {
        if (gameStateRef.current !== 'playing' || !isActiveRef.current) {
          lastTimeRef.current = time;
          if (gameStateRef.current === 'playing') {
            requestRef.current = requestAnimationFrame(gameLoop);
          }
          return;
        }

        if (lastTimeRef.current !== undefined) {
          const deltaTime = Math.min(time - lastTimeRef.current, 50); // 오버슛 방지

          // enemiesRef를 동기적으로 읽고 써서 비동기 setEnemies 의존 제거
          let currentDamage = 0;
          let currentEscaped = 0;
          const newEnemies = [];

          enemiesRef.current.forEach(e => {
            const target = GAME_PATH[e.wp];
            const dx = target.x - e.x;
            const dy = target.y - e.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            const currentSpeed = isFrozenRef.current ? 0 : e.speed * slowFactorRef.current * (deltaTime * 0.005);

            if (dist <= currentSpeed || dist < 0.5) {
              if (e.wp === GAME_PATH.length - 1) {
                currentDamage += 1;
                currentEscaped += 1;
                if (activeEnemyIdRef.current === e.id) {
                   activeEnemyIdRef.current = null;
                   setActiveEnemyId(null);
                   setInputN(""); setInputD(""); setInputN2("");
                }
              } else {
                newEnemies.push({ ...e, x: target.x, y: target.y, wp: e.wp + 1 });
              }
            } else {
              newEnemies.push({
                ...e,
                x: e.x + (dx / dist) * currentSpeed,
                y: e.y + (dy / dist) * currentSpeed
              });
            }
          });

          enemiesRef.current = newEnemies;
          setEnemies(newEnemies);

          if (currentDamage > 0) {
             setHp(h => {
               const newHp = h - currentDamage;
               if (newHp <= 0) {
                 gameStateRef.current = 'gameover';
                 setGameState('gameover');
               }
               return newHp;
             });
          }
          // currentEscaped는 이제 동기적으로 정확히 계산됨
          gameRef.current.eliminated += currentEscaped;

          // 레벨 클리어: 전부 스폰됐고 전부 처치/이탈됐을 때
          if (gameRef.current.spawned >= gameRef.current.maxEnemies &&
              gameRef.current.eliminated >= gameRef.current.maxEnemies) {
            const cur = levelRef.current;
            const nextLevel = cur + 1;
            levelRef.current = nextLevel;
            setLevel(nextLevel);
            setGold(g => g + 40 + (cur * 20)); // 웨이브 클리어 보너스
            gameRef.current.spawned = 0;
            gameRef.current.eliminated = 0;
            gameRef.current.maxEnemies = 10 + (cur * 5);
            gameRef.current.spawnTimer = 0;
            activeEnemyIdRef.current = null;
            setActiveEnemyId(null);
            setInputN(""); setInputD(""); setInputN2("");
            enemiesRef.current = [];
            setEnemies([]);
          }

          // 스폰 처리
          gameRef.current.spawnTimer += deltaTime;
          const currentSpawnRate = Math.max(1200, 2500 - (levelRef.current * 100));
          if (gameRef.current.spawnTimer > currentSpawnRate) {
            spawnEnemy();
            gameRef.current.spawnTimer = 0;
          }
        }

        lastTimeRef.current = time;
        requestRef.current = requestAnimationFrame(gameLoop);
      }, [spawnEnemy]);

      useEffect(() => {
        if (gameState === 'playing') {
          lastTimeRef.current = undefined; // 새 시작 시 시간 리셋
          requestRef.current = requestAnimationFrame(gameLoop);
        }
        return () => {
          if (requestRef.current) cancelAnimationFrame(requestRef.current);
        };
      }, [gameState, gameLoop]);

      // 문제를 풀어 골드 획득 (적 처치는 무기로!)
      const handleSubmit = (e) => {
        e.preventDefault();

        const uN = parseInt(inputN);
        const uD = parseInt(inputD);
        const uN2 = parseInt(inputN2);

        let isCorrect = false;
        if (problem.type === 'common') {
          isCorrect = (uN === problem.ansN1 && uN2 === problem.ansN2 && uD === problem.ansD);
        } else {
          isCorrect = (uN === problem.ansN && uD === problem.ansD);
        }

        if (solveFxTimer.current) clearTimeout(solveFxTimer.current);

        if (isCorrect) {
          const reward = 14 + levelRef.current * 4;
          setGold(g => g + reward);
          setScore(s => s + 50 * levelRef.current);
          setProblem(generateFractionProblem(levelRef.current));
          setInputN(""); setInputD(""); setInputN2("");
          setSolveFx({ type: 'correct', amt: reward, key: Date.now() });
        } else {
          setInputN(""); setInputD(""); setInputN2("");
          setSolveFx({ type: 'wrong', key: Date.now() });
        }
        solveFxTimer.current = setTimeout(() => setSolveFx(null), 1100);
      };

      // 무기 사용 (enemiesRef를 직접 동기 조작)
      const buyWeapon = (type, cost) => {
        if (gold < cost) return;

        const cur = enemiesRef.current;
        const requiresTarget = ['dagger', 'bomb', 'lightning', 'icespear'].includes(type);
        // 선택된 적이 없으면 성벽에 가장 가까운(앞선) 적을 자동 타깃
        let target = cur.find(en => en.id === activeEnemyIdRef.current);
        if (requiresTarget && !target && cur.length > 0) {
          target = [...cur].sort((a, b) => b.wp - a.wp)[0];
        }
        if (requiresTarget && !target) return;

        setGold(g => g - cost);

        const clearTarget = () => {
          activeEnemyIdRef.current = null;
          setActiveEnemyId(null);
        };
        const applyEnemies = (next) => {
          enemiesRef.current = next;
          setEnemies(next);
        };

        if (type === 'dagger') {
          gameRef.current.eliminated += 1;
          clearTarget();
          applyEnemies(cur.filter(en => en.id !== target.id));
        }
        else if (type === 'heal') {
          setHp(h => h + 10);
        }
        else if (type === 'web') {
          slowFactorRef.current = 0.5;
          setIsSlowed(true);
          if(slowTimeoutRef.current) clearTimeout(slowTimeoutRef.current);
          slowTimeoutRef.current = setTimeout(() => { slowFactorRef.current = 1.0; setIsSlowed(false); }, 4000);
        }
        else if (type === 'bomb') {
          let killedCount = 0;
          const next = cur.filter(en => {
            const dist = Math.sqrt(Math.pow(en.x - target.x, 2) + Math.pow(en.y - target.y, 2));
            if (dist < 20) { killedCount++; return false; }
            return true;
          });
          gameRef.current.eliminated += killedCount;
          clearTarget();
          applyEnemies(next);
        }
        else if (type === 'poison') {
          const shuffled = [...cur].sort(() => 0.5 - Math.random());
          const killedIds = new Set(shuffled.slice(0, 3).map(en => en.id));
          gameRef.current.eliminated += killedIds.size;
          clearTarget();
          applyEnemies(cur.filter(en => !killedIds.has(en.id)));
        }
        else if (type === 'lightning') {
          const others = cur.filter(en => en.id !== target.id).sort(() => 0.5 - Math.random());
          const killedIds = new Set([target.id, ...others.slice(0, 2).map(en => en.id)]);
          gameRef.current.eliminated += killedIds.size;
          clearTarget();
          applyEnemies(cur.filter(en => !killedIds.has(en.id)));
        }
        else if (type === 'icespear') {
          isFrozenRef.current = true;
          setIsFrozen(true);
          if(freezeTimeoutRef.current) clearTimeout(freezeTimeoutRef.current);
          freezeTimeoutRef.current = setTimeout(() => { isFrozenRef.current = false; setIsFrozen(false); }, 2000);
          gameRef.current.eliminated += 1;
          clearTarget();
          applyEnemies(cur.filter(en => en.id !== target.id));
        }
        else if (type === 'greatheal') {
          setHp(h => h + 30);
        }
        else if (type === 'blizzard') {
          isFrozenRef.current = true;
          setIsFrozen(true);
          if(freezeTimeoutRef.current) clearTimeout(freezeTimeoutRef.current);
          freezeTimeoutRef.current = setTimeout(() => { isFrozenRef.current = false; setIsFrozen(false); }, 4000);
        }
        else if (type === 'swamp') {
          slowFactorRef.current = 0.3;
          setIsSlowed(true);
          if(slowTimeoutRef.current) clearTimeout(slowTimeoutRef.current);
          slowTimeoutRef.current = setTimeout(() => { slowFactorRef.current = 1.0; setIsSlowed(false); }, 8000);
        }
        else if (type === 'meteor') {
          // 성벽에 가까운 순서로 최대 6마리만 처치
          const sorted = [...cur].sort((a, b) => b.wp - a.wp);
          const killedIds = new Set(sorted.slice(0, 6).map(en => en.id));
          gameRef.current.eliminated += killedIds.size;
          clearTarget();
          applyEnemies(cur.filter(en => !killedIds.has(en.id)));
        }
        else if (type === 'holylight') {
          setHp(h => h + 60);
          const sorted = [...cur].sort((a, b) => b.wp - a.wp);
          const killedIds = new Set(sorted.slice(0, 8).map(en => en.id));
          gameRef.current.eliminated += killedIds.size;
          clearTarget();
          applyEnemies(cur.filter(en => !killedIds.has(en.id)));
        }
      };

      const startGame = () => {
        setHp(50);
        setGold(50);
        setScore(0);
        setLevel(1);
        levelRef.current = 1;
        enemiesRef.current = [];
        setEnemies([]);
        setActiveEnemyId(null);
        activeEnemyIdRef.current = null;
        setInputN(""); setInputD(""); setInputN2("");
        setProblem(generateFractionProblem(1));
        setSolveFx(null);
        if (solveFxTimer.current) clearTimeout(solveFxTimer.current);
        setIsFrozen(false);
        isFrozenRef.current = false;
        setIsSlowed(false);
        slowFactorRef.current = 1.0;
        if(freezeTimeoutRef.current) clearTimeout(freezeTimeoutRef.current);
        if(slowTimeoutRef.current) clearTimeout(slowTimeoutRef.current);
        gameRef.current = { spawned: 0, eliminated: 0, maxEnemies: 10, spawnTimer: 0 };
        lastTimeRef.current = undefined;
        gameStateRef.current = 'playing';
        setGameState('playing');
      };

      if (gameState === 'menu') {
        return (
          <div className="flex flex-col items-center justify-center p-4 py-10 md:py-16 animate-fade-in text-center bg-stone-900 md:rounded-3xl border-y-4 md:border-4 border-amber-900 text-stone-200 font-serif relative overflow-hidden flex-1 w-full h-full min-h-[300px]">
            <div className="absolute inset-0 bg-black opacity-40 pointer-events-none"></div>
            <Shield className="text-amber-500 mb-4 drop-shadow-[0_0_20px_rgba(245,158,11,0.6)] relative z-10 w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24" />
            <h2 className="text-2xl sm:text-4xl md:text-5xl font-black text-amber-100 mb-3 md:mb-6 tracking-widest relative z-10 drop-shadow-lg break-keep">분수 왕국 대전투</h2>
            <p className="text-xs sm:text-base md:text-xl text-stone-300 mb-6 md:mb-10 max-w-2xl leading-relaxed relative z-10 px-2 md:px-4 break-keep">
              거대한 몬스터 군단이 성벽으로 진격합니다!<br/>
              <strong className="text-amber-400">약분·통분 문제를 풀어 골드를 모으고</strong>, 그 골드로 <strong className="text-amber-400">무기를 구매</strong>해 몬스터를 막아내세요!<br/>
            </p>
            <button onClick={startGame} className="relative z-10 bg-gradient-to-b from-amber-600 to-amber-800 hover:from-amber-500 hover:to-amber-700 border-2 border-amber-400 text-white px-8 sm:px-12 md:px-16 py-3 md:py-5 rounded-lg font-black text-lg sm:text-2xl md:text-3xl shadow-[0_0_30px_rgba(245,158,11,0.4)] transition transform hover:scale-105 uppercase tracking-widest whitespace-nowrap">
              전투 시작
            </button>
          </div>
        );
      }

      if (gameState === 'gameover') {
        return (
          <div className="flex flex-col items-center justify-center py-10 md:py-20 animate-fade-in text-center bg-stone-900 md:rounded-3xl border-y-4 md:border-4 border-rose-900 text-stone-200 font-serif flex-1 w-full h-full min-h-[300px]">
            <Skull className="text-rose-600 mb-4 drop-shadow-[0_0_30px_rgba(225,29,72,0.8)] animate-pulse w-16 h-16 md:w-24 md:h-24" />
            <h2 className="text-3xl md:text-5xl font-black text-rose-500 mb-4 tracking-widest">왕국 함락</h2>
            <p className="text-lg md:text-3xl font-bold text-stone-400 mb-2">도달 레벨: {level}</p>
            <p className="text-base md:text-2xl text-stone-500 mb-8">최종 점수: {score}점</p>
            <button onClick={startGame} className="bg-gradient-to-b from-rose-700 to-rose-900 hover:from-rose-600 hover:to-rose-800 border-2 border-rose-400 text-white px-8 md:px-16 py-3 md:py-5 rounded-lg font-black text-lg md:text-2xl shadow-xl transition transform hover:scale-105 uppercase tracking-widest whitespace-nowrap">
              재도전
            </button>
          </div>
        );
      }

      return (
        <div className="flex flex-col flex-1 w-full h-full p-0 md:p-2 bg-transparent text-stone-100 animate-fade-in overflow-hidden max-w-5xl mx-auto">

          <div className="flex justify-between items-center bg-amber-950 border-b-2 md:border-b-4 border-amber-800 p-2 md:p-4 md:rounded-t-2xl shadow-inner gap-2 z-10 relative flex-shrink-0">
            <div className="text-sm md:text-3xl font-black text-amber-200 tracking-wider flex items-center gap-2 whitespace-nowrap">
              WAVE {level} <span className="text-[10px] md:text-lg font-bold bg-stone-900 px-1.5 py-0.5 md:px-3 rounded md:rounded-md text-amber-500 border border-amber-800 whitespace-nowrap">남은 적: {Math.max(0, gameRef.current.maxEnemies - gameRef.current.eliminated)}</span>
            </div>
            <div className="flex gap-2 md:gap-8 items-center">
              <div className="flex items-center gap-1 md:gap-2 text-rose-500 font-black text-sm md:text-3xl drop-shadow-md">
                <Heart fill="currentColor" className="w-4 h-4 md:w-7 md:h-7"/> {hp}
              </div>
              <div className="flex items-center gap-1 md:gap-2 text-yellow-400 font-black text-sm md:text-3xl drop-shadow-md bg-stone-900 px-2 md:px-4 py-0.5 md:py-1 rounded-full border border-yellow-700 whitespace-nowrap">
                🪙 {gold}
              </div>
            </div>
          </div>

          {/* 게임 화면 캔버스 - 반응형으로 높이가 유동적으로 변함 */}
          <div className="relative w-full flex-1 bg-emerald-950 overflow-hidden shadow-inner border-y-2 md:border-x md:border-y-0 border-stone-900 cursor-crosshair min-h-[200px]">
            <div className="absolute inset-0 opacity-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPgo8cmVjdCB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBmaWxsPSIjMDY0ZTNiIj48L3JlY3Q+CjxwYXRoIGQ9Ik0wIDBMOCA4Wk04IDBMMCA4WiIgc3Ryb2tlPSIjMDQyZjJkIiBzdHJva2Utd2lkdGg9IjEiPjwvcGF0aD4KPC9zdmc+')] pointer-events-none"></div>

            <svg className="absolute inset-0 w-full h-full pointer-events-none block" viewBox="0 0 100 100" preserveAspectRatio="none">
               <polyline points="-10,15 80,15 80,50 20,50 20,85 100,85" fill="none" stroke="#451a03" strokeWidth="18" strokeLinejoin="round" strokeLinecap="round" />
               <polyline points="-10,15 80,15 80,50 20,50 20,85 100,85" fill="none" stroke="#78350f" strokeWidth="14" strokeLinejoin="round" strokeLinecap="round" />
               <polyline points="-10,15 80,15 80,50 20,50 20,85 100,85" fill="none" stroke="#92400e" strokeWidth="2" strokeDasharray="3, 5" strokeLinejoin="round" strokeLinecap="round" />
            </svg>

            <div className="absolute top-[30%] left-[40%] text-2xl md:text-5xl opacity-80 pointer-events-none">🌲</div>
            <div className="absolute top-[65%] left-[70%] text-3xl md:text-6xl opacity-80 pointer-events-none">⛰️</div>
            <div className="absolute top-[10%] left-[20%] text-xl md:text-4xl opacity-80 pointer-events-none">🌲</div>

            {isFrozen && <div className="absolute inset-0 bg-cyan-400 bg-opacity-30 z-0 transition-all duration-300 pointer-events-none"></div>}
            {isSlowed && !isFrozen && <div className="absolute inset-0 bg-amber-700 bg-opacity-30 z-0 transition-all duration-300 pointer-events-none"></div>}

            {/* 성 위치 */}
            <div className="absolute top-[85%] left-[95%] transform -translate-x-1/2 -translate-y-1/2 z-10 flex flex-col items-center pointer-events-none">
               <div className="text-4xl sm:text-5xl md:text-7xl drop-shadow-[0_15px_15px_rgba(0,0,0,0.9)] relative">🏰</div>
               <div className={`absolute -bottom-3 sm:-bottom-4 md:-bottom-6 font-black text-[10px] sm:text-xs md:text-xl px-1.5 py-0.5 md:px-4 md:py-1 rounded-md shadow-xl ${hp <= 15 ? 'bg-rose-600 animate-pulse text-white' : 'bg-stone-900 text-stone-200'} border md:border-2 border-stone-500 whitespace-nowrap`}>
                 HP {hp}
               </div>
            </div>

            {enemies.map((enemy) => (
              <div
                key={enemy.id}
                onClick={() => { activeEnemyIdRef.current = enemy.id; setActiveEnemyId(enemy.id); }}
                className="absolute z-20 transform -translate-x-1/2 -translate-y-1/2 cursor-pointer group"
                style={{ left: `${enemy.x}%`, top: `${enemy.y}%` }}
              >
                {activeEnemyId === enemy.id && <div className="absolute inset-0 rounded-full animate-ping border-2 border-yellow-400 opacity-80 scale-150"></div>}

                <div className={`relative flex flex-col items-center justify-center p-1 md:p-2 rounded-full border shadow-2xl transition-transform ${activeEnemyId === enemy.id ? 'border-yellow-400 scale-[1.3] z-30 bg-stone-800' : 'border-stone-600 bg-stone-900 hover:scale-[1.1]'}`}>
                  <span className="text-xl sm:text-2xl md:text-4xl filter drop-shadow-md leading-none">{enemy.icon}</span>
                  {activeEnemyId === enemy.id && <span className="absolute -bottom-5 md:-bottom-7 font-black whitespace-nowrap bg-yellow-400 text-stone-900 px-1.5 py-0.5 md:px-2 rounded shadow-lg z-40 text-[8px] sm:text-[10px] md:text-xs">🎯 대상</span>}
                </div>
              </div>
            ))}
          </div>

          {/* 무기 및 컨트롤 패널 */}
          <div className="bg-amber-950 border-t-2 md:border-t-4 border-amber-800 p-2 md:p-6 md:rounded-b-2xl flex flex-col items-center gap-2 md:gap-6 shadow-inner relative z-10 flex-shrink-0">

            {/* 무기 목록 (줄바꿈 표시) */}
            <div className="flex flex-row flex-wrap gap-1 md:gap-2 bg-stone-900 p-1.5 md:p-4 rounded-xl border border-stone-700 w-full shadow-inner justify-center items-center">
              {WEAPONS.map(w => {
                const requiresTarget = ['dagger', 'bomb', 'lightning', 'icespear'].includes(w.id);
                const isDisabled = gold < w.cost || (requiresTarget && enemies.length === 0);
                return (
                  <button key={w.id} onClick={() => buyWeapon(w.id, w.cost)} disabled={isDisabled}
                    className="group relative flex flex-col items-center justify-center p-1 md:p-3 bg-gradient-to-b from-stone-700 to-stone-800 hover:from-stone-600 hover:to-stone-700 disabled:from-stone-900 disabled:to-stone-900 disabled:opacity-40 border border-stone-600 rounded-lg shadow-md transition-all transform active:scale-95 disabled:active:scale-100 w-[42px] h-[52px] sm:w-[58px] sm:h-[68px] md:w-[78px] md:h-auto flex-shrink-0">
                    <span className="text-xl sm:text-2xl md:text-3xl mb-0.5 leading-none">{w.icon}</span>
                    <span className="text-[9px] md:text-xs text-amber-200 font-bold whitespace-nowrap hidden sm:block truncate w-full px-1">{w.name}</span>
                    <span className="text-[9px] sm:text-[10px] md:text-xs text-yellow-400 font-black leading-none">{w.cost}G</span>

                    <div className="absolute bottom-full mb-2 left-1/2 transform -translate-x-1/2 hidden lg:group-hover:block bg-stone-950 text-stone-200 text-xs py-1 px-2 rounded shadow-xl whitespace-nowrap border border-stone-500 z-50 pointer-events-none">
                      {w.desc}
                    </div>
                  </button>
                )
              })}
            </div>

            {/* 문제 풀이 패널 - 정답을 맞히면 골드 획득! */}
            <div className="w-full flex flex-col items-center gap-1.5 pb-1">
              <div className="text-[10px] sm:text-xs md:text-sm text-amber-300/90 text-center break-keep px-2">
                🪙 문제를 풀어 골드를 모으고, 무기를 사서 몬스터를 막으세요! <span className="hidden sm:inline">몬스터를 클릭하면 단검·폭탄·번개·얼음창의 대상이 되고, 선택하지 않으면 맨 앞 적을 공격합니다.</span>
              </div>
              <form onSubmit={handleSubmit} className="flex flex-col sm:flex-row items-center justify-center gap-2 md:gap-6 bg-stone-900 p-2 sm:p-3 md:p-6 rounded-xl md:rounded-2xl border-2 border-amber-600 shadow-[0_0_15px_rgba(217,119,6,0.3)] w-full">
                <div className="text-xs sm:text-sm md:text-2xl font-black text-amber-100 bg-stone-800 px-3 py-1.5 md:px-4 md:py-2 rounded-md border border-stone-600 whitespace-nowrap flex-shrink-0">
                   {problem.qText}
                </div>
                <ArrowRight className="text-stone-500 hidden sm:block w-4 h-4 md:w-7 md:h-7 flex-shrink-0" />

                <div className="flex gap-1 md:gap-3 items-center w-full justify-center">
                  {problem.type === 'reduce' ? (
                    <div className="flex items-center gap-1 md:gap-2">
                      <input type="number" autoFocus value={inputN} onChange={e => setInputN(e.target.value)} placeholder="분자" className="w-10 h-8 sm:w-12 sm:h-10 md:w-16 md:h-12 text-center text-sm sm:text-base md:text-xl font-black bg-stone-800 border md:border-2 border-stone-600 rounded text-amber-100 focus:border-amber-400 outline-none transition-colors px-0" />
                      <span className="text-stone-500 text-lg md:text-2xl font-light">/</span>
                      <input type="number" value={inputD} onChange={e => setInputD(e.target.value)} placeholder="분모" className="w-10 h-8 sm:w-12 sm:h-10 md:w-16 md:h-12 text-center text-sm sm:text-base md:text-xl font-black bg-stone-800 border md:border-2 border-stone-600 rounded text-amber-100 focus:border-amber-400 outline-none transition-colors px-0" />
                    </div>
                  ) : (
                    <div className="flex items-center gap-0.5 md:gap-2">
                      <input type="number" autoFocus value={inputN} onChange={e => setInputN(e.target.value)} placeholder="분자" className="w-8 h-8 sm:w-10 sm:h-10 md:w-16 md:h-12 text-center text-xs sm:text-sm md:text-xl font-black bg-stone-800 border border-stone-600 rounded text-amber-100 focus:border-amber-400 outline-none transition-colors px-0" />
                      <span className="text-stone-500 text-sm md:text-2xl font-light">/</span>
                      <input type="number" value={inputD} onChange={e => setInputD(e.target.value)} placeholder="공통" className="w-9 h-8 sm:w-12 sm:h-10 md:w-16 md:h-12 text-center text-xs sm:text-sm md:text-xl font-black bg-stone-800 border border-stone-600 rounded text-amber-100 focus:border-amber-400 outline-none transition-colors px-0" />
                      <span className="text-amber-500 font-bold text-xs sm:text-sm md:text-2xl mx-0.5 md:mx-2 pb-1">,</span>
                      <input type="number" value={inputN2} onChange={e => setInputN2(e.target.value)} placeholder="분자" className="w-8 h-8 sm:w-10 sm:h-10 md:w-16 md:h-12 text-center text-xs sm:text-sm md:text-xl font-black bg-stone-800 border border-stone-600 rounded text-amber-100 focus:border-amber-400 outline-none transition-colors px-0" />
                      <span className="text-stone-500 text-sm md:text-2xl font-light">/</span>
                      <input type="number" value={inputD} onChange={e => setInputD(e.target.value)} placeholder="공통" className="w-9 h-8 sm:w-12 sm:h-10 md:w-16 md:h-12 text-center text-xs sm:text-sm md:text-xl font-black bg-stone-800 border border-stone-600 rounded text-amber-100 focus:border-amber-400 outline-none transition-colors px-0" />
                    </div>
                  )}
                  <button type="submit" className="bg-gradient-to-t from-amber-600 to-amber-400 hover:from-amber-500 hover:to-amber-300 text-stone-900 font-black px-2 sm:px-4 md:px-6 py-1.5 md:py-3 rounded md:rounded-lg shadow-lg transition transform active:scale-95 text-xs sm:text-sm md:text-lg whitespace-nowrap ml-1 flex-shrink-0 h-8 sm:h-10 md:h-auto">
                    정답!
                  </button>
                </div>
              </form>
              <div className="h-5 md:h-6 text-xs sm:text-sm md:text-lg font-black flex items-center">
                {solveFx?.type === 'correct' && <span className="text-emerald-400 animate-bounce-short">+{solveFx.amt}G 획득! 🪙</span>}
                {solveFx?.type === 'wrong' && <span className="text-rose-400">앗, 다시 풀어봐요!</span>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. 모험(RPG) 탭 - 캐릭터 성장형
    // ==========================================

    // 분수 한 개를 분자/분모 형태로 보기 좋게 표시
    const FracView = ({ n, d, className = "" }) => (
      <span className={`inline-flex flex-col items-center align-middle leading-tight mx-1 ${className}`}>
        <span className="px-2 border-b-2 border-current">{n}</span>
        <span className="px-2">{d}</span>
      </span>
    );

    const HERO_THEME = {
      mage:    { grad: 'from-violet-500 to-fuchsia-500',  ring: 'ring-violet-400',  text: 'text-violet-200',  badge: 'bg-violet-500' },
      warrior: { grad: 'from-rose-500 to-orange-500',     ring: 'ring-rose-400',    text: 'text-rose-200',    badge: 'bg-rose-500' },
      archer:  { grad: 'from-emerald-500 to-teal-500',    ring: 'ring-emerald-400', text: 'text-emerald-200', badge: 'bg-emerald-500' }
    };

    const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

    function AdventureTab({ isActive }) {
      const [phase, setPhase] = useState('select');     // select | map | battle | clear | gameover | complete
      const [heroId, setHeroId] = useState(null);
      const [level, setLevel] = useState(1);
      const [exp, setExp] = useState(0);
      const [maxHp, setMaxHp] = useState(0);
      const [hp, setHp] = useState(0);
      const [atk, setAtk] = useState(0);
      const [progress, setProgress] = useState({});     // { stageId: stars }

      const [stageId, setStageId] = useState(1);
      const [monstersDefeated, setMonstersDefeated] = useState(0);
      const [monster, setMonster] = useState(null);
      const [problem, setProblem] = useState(null);
      const [streak, setStreak] = useState(0);
      const [locked, setLocked] = useState(false);
      const [pickedIdx, setPickedIdx] = useState(-1);
      const [feedback, setFeedback] = useState(null);    // 'correct' | 'wrong'
      const [popups, setPopups] = useState([]);
      const [anim, setAnim] = useState({ hero: '', monster: '' });
      const [levelBanner, setLevelBanner] = useState(null);
      const [clearStars, setClearStars] = useState(0);
      const [loaded, setLoaded] = useState(false);

      const popupId = useRef(0);
      const timers = useRef([]);
      const wrongRef = useRef(0);

      const addTimer = (fn, ms) => { const t = setTimeout(fn, ms); timers.current.push(t); return t; };
      const clearTimers = () => { timers.current.forEach(clearTimeout); timers.current = []; };
      useEffect(() => () => clearTimers(), []);

      // 저장 불러오기 (최초 1회)
      useEffect(() => {
        try {
          const raw = localStorage.getItem(ADV_SAVE_KEY);
          if (raw) {
            const s = JSON.parse(raw);
            if (s && s.heroId && HEROES[s.heroId]) {
              setHeroId(s.heroId);
              setLevel(s.level || 1);
              setExp(s.exp || 0);
              setMaxHp(s.maxHp || HEROES[s.heroId].maxHp);
              setHp(s.maxHp || HEROES[s.heroId].maxHp);
              setAtk(s.atk || HEROES[s.heroId].atk);
              setProgress(s.progress || {});
              setPhase('map');
            }
          }
        } catch (e) {}
        setLoaded(true);
      }, []);

      // 성장/진행 저장
      useEffect(() => {
        if (!loaded || !heroId) return;
        try {
          localStorage.setItem(ADV_SAVE_KEY, JSON.stringify({ heroId, level, exp, maxHp, atk, progress }));
        } catch (e) {}
      }, [loaded, heroId, level, exp, maxHp, atk, progress]);

      const pushPopup = (text, side, kind) => {
        const id = popupId.current++;
        setPopups(p => [...p, { id, text, side, kind }]);
        addTimer(() => setPopups(p => p.filter(x => x.id !== id)), 1000);
      };

      const buildMonster = (stage, idx) => {
        const isBoss = idx === stage.count - 1;
        const grow = 1 + idx * 0.08;
        let mhp = Math.round(stage.mhp * grow);
        let matk = Math.round(stage.matk * (1 + idx * 0.05));
        if (isBoss) mhp = Math.round(mhp * 1.5);
        const emoji = isBoss ? stage.monsters[stage.monsters.length - 1] : stage.monsters[idx % stage.monsters.length];
        return { emoji, hp: mhp, maxHp: mhp, atk: matk, isBoss };
      };

      const pickHero = (id) => {
        const h = HEROES[id];
        setHeroId(id);
        setLevel(1); setExp(0);
        setMaxHp(h.maxHp); setHp(h.maxHp); setAtk(h.atk);
        setProgress({});
        try { localStorage.removeItem(ADV_SAVE_KEY); } catch (e) {}
        setPhase('map');
      };

      const startStage = (sid) => {
        const stage = ADV_STAGES.find(s => s.id === sid);
        clearTimers();
        setStageId(sid);
        setMonstersDefeated(0);
        setStreak(0);
        wrongRef.current = 0;
        setHp(maxHp);
        setMonster(buildMonster(stage, 0));
        setProblem(makeBattleProblem(stage.kind, stage.difficulty));
        setLocked(false); setPickedIdx(-1); setFeedback(null); setPopups([]);
        setPhase('battle');
      };

      const stage = ADV_STAGES.find(s => s.id === stageId);

      const handleAnswer = (choice, idx) => {
        if (locked || phase !== 'battle' || !monster) return;
        setLocked(true);
        setPickedIdx(idx);

        if (choice.correct) {
          const dmg = Math.max(5, atk + randInt(-2, 4));
          const newMonsterHp = Math.max(0, monster.hp - dmg);
          const gained = 18 + Math.min(streak, 5) * 4;

          // 레벨업 계산
          let nl = level, ne = exp + gained, nmax = maxHp, natk = atk, nhp = hp, leveled = false;
          while (nl < 10 && ne >= expToNext(nl)) {
            ne -= expToNext(nl); nl++; nmax += 12; natk += 4;
            nhp = Math.min(nmax, nhp + Math.round(nmax * 0.25)); leveled = true;
          }
          if (nl >= 10) ne = Math.min(ne, expToNext(10));

          setMonster(m => ({ ...m, hp: newMonsterHp }));
          setExp(ne); setLevel(nl); setMaxHp(nmax); setAtk(natk); setHp(nhp);
          setStreak(s => s + 1);
          setFeedback('correct');
          setAnim({ hero: 'lunge', monster: 'hit' });
          pushPopup('-' + dmg, 'monster', 'dmg');
          pushPopup('+' + gained + ' EXP', 'hero', 'exp');
          if (leveled) { setLevelBanner({ level: nl }); addTimer(() => setLevelBanner(null), 1700); }

          const monsterDead = newMonsterHp <= 0;
          addTimer(() => {
            setAnim({ hero: '', monster: '' });
            if (monsterDead) {
              const defeated = monstersDefeated + 1;
              if (defeated >= stage.count) {
                // 스테이지 클리어
                const w = wrongRef.current;
                const stars = w <= 1 ? 3 : (w <= 4 ? 2 : 1);
                setClearStars(stars);
                setProgress(prev => ({ ...prev, [stage.id]: Math.max(prev[stage.id] || 0, stars) }));
                setHp(nmax);
                setMonstersDefeated(defeated);
                setPhase(stage.id === ADV_STAGES.length ? 'complete' : 'clear');
                setLocked(false); setPickedIdx(-1); setFeedback(null);
              } else {
                setMonstersDefeated(defeated);
                setMonster(buildMonster(stage, defeated));
                setProblem(makeBattleProblem(stage.kind, stage.difficulty));
                setLocked(false); setPickedIdx(-1); setFeedback(null);
              }
            } else {
              setProblem(makeBattleProblem(stage.kind, stage.difficulty));
              setLocked(false); setPickedIdx(-1); setFeedback(null);
            }
          }, 850);
        } else {
          const mdmg = Math.max(3, monster.atk + randInt(-2, 2));
          const newHp = Math.max(0, hp - mdmg);
          setHp(newHp);
          setStreak(0);
          wrongRef.current += 1;
          setFeedback('wrong');
          setAnim({ hero: 'hit', monster: 'lunge' });
          pushPopup('-' + mdmg, 'hero', 'dmg');

          const heroDead = newHp <= 0;
          addTimer(() => {
            setAnim({ hero: '', monster: '' });
            if (heroDead) {
              setPhase('gameover');
            } else {
              setProblem(makeBattleProblem(stage.kind, stage.difficulty));
            }
            setLocked(false); setPickedIdx(-1); setFeedback(null);
          }, 1150);
        }
      };

      const resetAll = () => {
        try { localStorage.removeItem(ADV_SAVE_KEY); } catch (e) {}
        clearTimers();
        setHeroId(null); setLevel(1); setExp(0); setMaxHp(0); setHp(0); setAtk(0);
        setProgress({}); setPhase('select');
      };

      const hero = heroId ? HEROES[heroId] : null;
      const theme = heroId ? HERO_THEME[heroId] : HERO_THEME.mage;
      const hpPct = maxHp > 0 ? Math.round((hp / maxHp) * 100) : 0;
      const hpColor = hpPct > 50 ? 'bg-emerald-500' : hpPct > 25 ? 'bg-amber-500' : 'bg-rose-500';
      const expNeed = expToNext(Math.min(level, 10));
      const expPct = level >= 10 ? 100 : Math.min(100, Math.round((exp / expNeed) * 100));

      // ===== 선택 화면 =====
      const renderSelect = () => (
        <div className="animate-fade-in flex flex-col items-center w-full max-w-3xl mx-auto px-4 py-6 md:py-10">
          <div className="text-4xl md:text-6xl mb-2 adv-float">🧙⚔️🏹</div>
          <h2 className="text-2xl md:text-4xl font-black text-white text-center drop-shadow">약분·통분 대모험</h2>
          <p className="text-violet-200 text-sm md:text-lg mt-2 mb-6 text-center break-keep">함께 모험을 떠날 영웅을 골라봐!<br className="sm:hidden"/> 문제를 맞히면 몬스터를 무찌르고 성장해요.</p>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 md:gap-4 w-full">
            {Object.values(HEROES).map(h => {
              const t = HERO_THEME[h.id];
              return (
                <button key={h.id} onClick={() => pickHero(h.id)}
                  className={`bg-white/10 hover:bg-white/20 border-2 border-white/10 hover:border-white/40 rounded-2xl p-4 md:p-5 flex flex-col items-center gap-2 transition-all hover:-translate-y-1 ring-offset-2 ring-offset-transparent`}>
                  <div className={`text-5xl md:text-6xl w-20 h-20 md:w-24 md:h-24 flex items-center justify-center rounded-full bg-gradient-to-br ${t.grad} shadow-lg`}>{h.emoji}</div>
                  <div className="font-black text-white text-base md:text-lg">{h.name}</div>
                  <div className="text-[11px] md:text-xs text-slate-200 break-keep text-center">{h.tag}</div>
                  <div className="flex gap-2 text-xs md:text-sm mt-1">
                    <span className="text-emerald-300 font-bold">❤️ {h.maxHp}</span>
                    <span className="text-rose-300 font-bold">⚔️ {h.atk}</span>
                  </div>
                  <div className="mt-1 text-xs font-black text-white bg-white/20 rounded-full px-4 py-1.5">선택하기</div>
                </button>
              );
            })}
          </div>
        </div>
      );

      // ===== 지도 화면 =====
      const renderMap = () => (
        <div className="animate-fade-in flex flex-col w-full max-w-3xl mx-auto px-4 py-5 md:py-8">
          {/* 영웅 상태 카드 */}
          <div className="bg-white/10 rounded-2xl p-4 mb-5 flex items-center gap-3 md:gap-4 border border-white/10">
            <div className={`text-3xl md:text-4xl w-14 h-14 md:w-16 md:h-16 flex items-center justify-center rounded-full bg-gradient-to-br ${theme.grad} shadow`}>{hero?.emoji}</div>
            <div className="flex-1 min-w-0">
              <div className="flex items-center justify-between gap-2">
                <span className="font-black text-white text-sm md:text-base truncate">{hero?.name}</span>
                <span className={`${theme.badge} text-white text-xs md:text-sm font-black px-2.5 py-0.5 rounded-full whitespace-nowrap`}>Lv.{level}</span>
              </div>
              <div className="mt-1.5">
                <div className="flex justify-between text-[10px] md:text-xs text-slate-300 mb-0.5"><span>❤️ {hp}/{maxHp}</span><span>⚔️ {atk}</span></div>
                <div className="w-full bg-black/30 rounded-full h-1.5 overflow-hidden"><div className={`${hpColor} h-full rounded-full transition-all`} style={{ width: hpPct + '%' }}></div></div>
                <div className="flex justify-between text-[10px] md:text-xs text-violet-200 mt-1 mb-0.5"><span>EXP</span><span>{level >= 10 ? 'MAX' : exp + '/' + expNeed}</span></div>
                <div className="w-full bg-black/30 rounded-full h-1.5 overflow-hidden"><div className="bg-violet-400 h-full rounded-full transition-all" style={{ width: expPct + '%' }}></div></div>
              </div>
            </div>
          </div>

          <h3 className="text-white font-black text-lg md:text-xl mb-3 flex items-center gap-2"><Sparkles size={20}/> 모험 지도</h3>
          <div className="flex flex-col gap-2.5">
            {ADV_STAGES.map((s, i) => {
              const unlocked = i === 0 || (progress[ADV_STAGES[i - 1].id] || 0) > 0;
              const stars = progress[s.id] || 0;
              return (
                <button key={s.id} disabled={!unlocked} onClick={() => unlocked && startStage(s.id)}
                  className={`text-left rounded-2xl p-3.5 md:p-4 flex items-center gap-3 border transition-all ${unlocked ? 'bg-white/10 hover:bg-white/20 border-white/10 hover:border-white/40 hover:translate-x-1' : 'bg-black/20 border-white/5 opacity-50 cursor-not-allowed'}`}>
                  <div className="text-2xl md:text-3xl w-11 h-11 md:w-12 md:h-12 flex items-center justify-center rounded-xl bg-black/30 flex-shrink-0">{unlocked ? s.icon : '🔒'}</div>
                  <div className="flex-1 min-w-0">
                    <div className="font-black text-white text-sm md:text-base">{s.id}. {s.name}</div>
                    <div className="text-[11px] md:text-xs text-slate-300">{s.desc} · 몬스터 {s.count}마리</div>
                  </div>
                  <div className="flex flex-col items-end gap-1 flex-shrink-0">
                    <span className={`text-[10px] md:text-xs font-black px-2 py-0.5 rounded-full ${s.kind === 'reduce' ? 'bg-blue-500' : s.kind === 'common' ? 'bg-emerald-500' : 'bg-fuchsia-500'} text-white`}>{s.kind === 'reduce' ? '약분' : s.kind === 'common' ? '통분' : '약분+통분'}</span>
                    {unlocked && <span className="text-amber-300 text-sm md:text-base tracking-tight">{'★'.repeat(stars)}{'☆'.repeat(3 - stars)}</span>}
                  </div>
                </button>
              );
            })}
          </div>
          <button onClick={resetAll} className="mt-5 mx-auto text-xs text-slate-400 hover:text-slate-200 underline underline-offset-2">처음부터 다시 시작 (영웅 다시 선택)</button>
        </div>
      );

      // ===== 보기(선택지) 렌더 =====
      const renderChoice = (c, idx) => {
        let stateCls = 'bg-white/10 hover:bg-white/25 border-white/20';
        if (feedback) {
          if (c.correct) stateCls = 'bg-emerald-500/90 border-emerald-300 scale-105';
          else if (idx === pickedIdx) stateCls = 'bg-rose-500/90 border-rose-300 adv-shake';
          else stateCls = 'bg-white/5 border-white/10 opacity-60';
        }
        return (
          <button key={idx} disabled={locked} onClick={() => handleAnswer(c, idx)}
            className={`rounded-2xl border-2 py-3 md:py-4 px-2 flex items-center justify-center text-white font-black text-xl md:text-3xl transition-all ${stateCls}`}>
            {problem.kind === 'reduce'
              ? <FracView n={c.n} d={c.d} />
              : <span className="flex items-center"><FracView n={c.n1} d={c.d} /><span className="mx-0.5 text-base md:text-2xl">,</span><FracView n={c.n2} d={c.d} /></span>}
          </button>
        );
      };

      // ===== 전투 화면 =====
      const renderBattle = () => {
        const mPct = monster ? Math.round((monster.hp / monster.maxHp) * 100) : 0;
        return (
          <div className="flex flex-col h-full w-full">
            {/* 상단 상태바 */}
            <div className="flex-shrink-0 bg-black/30 px-3 py-2 flex items-center justify-between gap-2 border-b border-white/10">
              <button onClick={() => { clearTimers(); setPhase('map'); }} className="text-slate-300 hover:text-white text-xs md:text-sm font-bold flex items-center gap-1 flex-shrink-0">← 지도</button>
              <div className="text-center min-w-0">
                <div className="text-white font-black text-xs md:text-sm truncate">{stage.icon} {stage.name}</div>
                <div className="text-[10px] md:text-xs text-amber-300">처치 {monstersDefeated}/{stage.count}</div>
              </div>
              <div className="flex items-center gap-1.5 flex-shrink-0">
                <span className={`${theme.badge} text-white text-[10px] md:text-xs font-black px-2 py-0.5 rounded-full`}>Lv.{level}</span>
                <div className="w-14 md:w-20"><div className="w-full bg-black/40 rounded-full h-1.5 overflow-hidden"><div className="bg-violet-400 h-full" style={{ width: expPct + '%' }}></div></div></div>
              </div>
            </div>

            {/* 전투 무대 */}
            <div className="relative flex-1 min-h-0 flex items-center justify-around px-4 bg-gradient-to-b from-transparent to-black/30 overflow-hidden">
              {/* 몬스터 */}
              <div className="flex flex-col items-center gap-1.5 w-32 md:w-44">
                {monster?.isBoss && <span className="text-rose-300 text-xs font-black animate-pulse">⚠ 보스</span>}
                <div className={`text-6xl md:text-8xl ${anim.monster === 'hit' ? 'adv-hit' : ''} ${anim.monster === 'lunge' ? 'adv-lunge-right' : ''}`}>{monster?.emoji}</div>
                <div className="w-full bg-black/40 rounded-full h-2 md:h-2.5 overflow-hidden border border-white/10"><div className="bg-rose-500 h-full rounded-full transition-all duration-300" style={{ width: mPct + '%' }}></div></div>
                <div className="text-[10px] md:text-xs text-slate-300">{monster?.hp}/{monster?.maxHp}</div>
              </div>

              <div className="text-2xl md:text-4xl font-black text-white/40">VS</div>

              {/* 영웅 */}
              <div className="flex flex-col items-center gap-1.5 w-32 md:w-44">
                <div className={`text-6xl md:text-8xl ${anim.hero === 'hit' ? 'adv-hit' : ''} ${anim.hero === 'lunge' ? 'adv-lunge-left' : ''}`}>{hero?.emoji}</div>
                <div className="w-full bg-black/40 rounded-full h-2 md:h-2.5 overflow-hidden border border-white/10"><div className={`${hpColor} h-full rounded-full transition-all duration-300`} style={{ width: hpPct + '%' }}></div></div>
                <div className="text-[10px] md:text-xs text-slate-300">{hp}/{maxHp}</div>
              </div>

              {/* 데미지 팝업 */}
              {popups.map(p => (
                <div key={p.id} className={`adv-pop absolute top-1/3 font-black text-xl md:text-3xl pointer-events-none ${p.side === 'monster' ? 'left-[18%]' : 'right-[18%]'} ${p.kind === 'dmg' ? 'text-rose-400' : p.kind === 'exp' ? 'text-violet-300' : 'text-emerald-300'}`}>{p.text}</div>
              ))}

              {/* 레벨업 배너 */}
              {levelBanner && (
                <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                  <div className="bg-black/60 rounded-3xl px-8 py-5 text-center adv-spin-in">
                    <div className="text-amber-300 font-black text-2xl md:text-4xl adv-glow">⭐ LEVEL UP! ⭐</div>
                    <div className="text-white font-black text-lg md:text-2xl mt-1">Lv.{levelBanner.level} · 체력+12 공격+4</div>
                  </div>
                </div>
              )}
            </div>

            {/* 문제 + 보기 */}
            <div className="flex-shrink-0 bg-black/40 border-t border-white/10 p-3 md:p-5">
              <div className="flex items-center justify-center gap-2 mb-2">
                <span className={`text-[10px] md:text-xs font-black px-2.5 py-0.5 rounded-full text-white ${problem?.kind === 'reduce' ? 'bg-blue-500' : 'bg-emerald-500'}`}>{problem?.kind === 'reduce' ? '약분' : '통분'}</span>
                {streak >= 2 && <span className="text-amber-300 text-xs md:text-sm font-bold">🔥 연속 {streak}!</span>}
                {feedback === 'correct' && <span className="text-emerald-300 text-xs md:text-sm font-bold">정답! 공격 성공 ⚔️</span>}
                {feedback === 'wrong' && <span className="text-rose-300 text-xs md:text-sm font-bold">아쉬워요! 초록색이 정답이에요</span>}
              </div>
              <div className="text-center text-white font-black text-2xl md:text-4xl mb-3 flex items-center justify-center flex-wrap gap-x-1">
                {problem?.kind === 'reduce'
                  ? <span className="flex items-center"><FracView n={problem.n} d={problem.d} className="text-amber-300" /><span className="text-lg md:text-2xl ml-2 font-bold">를 약분하면?</span></span>
                  : <span className="flex items-center flex-wrap justify-center"><FracView n={problem?.n1} d={problem?.d1} className="text-amber-300" /><span className="text-lg md:text-2xl mx-1 font-bold">와</span><FracView n={problem?.n2} d={problem?.d2} className="text-amber-300" /><span className="text-lg md:text-2xl ml-1 font-bold">를 통분하면?</span></span>}
              </div>
              <div className="grid grid-cols-2 gap-2.5 md:gap-3 max-w-xl mx-auto">
                {problem?.choices.map((c, i) => renderChoice(c, i))}
              </div>
            </div>
          </div>
        );
      };

      // ===== 클리어 / 게임오버 / 완료 화면 =====
      const renderClear = () => (
        <div className="animate-fade-in flex flex-col items-center justify-center h-full text-center px-6">
          <div className="text-6xl md:text-7xl mb-3 adv-float">🏆</div>
          <h2 className="text-2xl md:text-4xl font-black text-emerald-300">스테이지 클리어!</h2>
          <div className="text-4xl md:text-5xl my-3 text-amber-300 tracking-widest">{'★'.repeat(clearStars)}{'☆'.repeat(3 - clearStars)}</div>
          <p className="text-white font-bold text-lg">{stage?.name} 완료</p>
          <p className="text-slate-300 text-sm mt-1">체력을 모두 회복했어요! 레벨 {level} · ⚔️ {atk}</p>
          <div className="flex flex-col sm:flex-row gap-3 mt-7 w-full max-w-xs">
            {stage && stage.id < ADV_STAGES.length &&
              <button onClick={() => startStage(stage.id + 1)} className="flex-1 bg-gradient-to-r from-violet-500 to-fuchsia-500 text-white font-black py-3 rounded-xl shadow-lg hover:scale-105 transition">▶ 다음 스테이지</button>}
            <button onClick={() => setPhase('map')} className="flex-1 bg-white/15 hover:bg-white/25 text-white font-bold py-3 rounded-xl transition">🗺️ 지도로</button>
          </div>
        </div>
      );

      const renderGameOver = () => (
        <div className="animate-fade-in flex flex-col items-center justify-center h-full text-center px-6">
          <div className="text-6xl md:text-7xl mb-3">💫</div>
          <h2 className="text-2xl md:text-4xl font-black text-rose-300">앗, 쓰러졌어요!</h2>
          <p className="text-slate-300 text-sm md:text-base mt-2 break-keep">괜찮아요. 천천히 다시 풀어보면 분명 클리어할 수 있어요!</p>
          <div className="flex flex-col sm:flex-row gap-3 mt-7 w-full max-w-xs">
            <button onClick={() => startStage(stageId)} className="flex-1 bg-gradient-to-r from-rose-500 to-orange-500 text-white font-black py-3 rounded-xl shadow-lg hover:scale-105 transition">🔄 다시 도전</button>
            <button onClick={() => setPhase('map')} className="flex-1 bg-white/15 hover:bg-white/25 text-white font-bold py-3 rounded-xl transition">🗺️ 지도로</button>
          </div>
        </div>
      );

      const renderComplete = () => (
        <div className="animate-fade-in flex flex-col items-center justify-center h-full text-center px-6">
          <div className="text-6xl md:text-8xl mb-3 adv-float">{hero?.emoji}</div>
          <h2 className="text-2xl md:text-4xl font-black text-amber-300 adv-glow">🎉 모든 스테이지 클리어! 🎉</h2>
          <p className="text-white font-bold text-lg md:text-xl mt-3">{hero?.name} · 최종 레벨 {level}</p>
          <p className="text-slate-300 text-sm mt-1">약분과 통분의 진정한 마스터가 되었어요!</p>
          <div className="text-4xl md:text-5xl my-4">🏆 ⭐ 🎖️</div>
          <div className="flex flex-col sm:flex-row gap-3 mt-2 w-full max-w-xs">
            <button onClick={() => setPhase('map')} className="flex-1 bg-gradient-to-r from-violet-500 to-fuchsia-500 text-white font-black py-3 rounded-xl shadow-lg hover:scale-105 transition">🗺️ 지도로</button>
            <button onClick={resetAll} className="flex-1 bg-white/15 hover:bg-white/25 text-white font-bold py-3 rounded-xl transition">🔄 처음부터</button>
          </div>
        </div>
      );

      return (
        <div className="w-full h-full overflow-y-auto bg-gradient-to-b from-indigo-950 via-slate-900 to-violet-950">
          {phase === 'select' && renderSelect()}
          {phase === 'map' && renderMap()}
          {phase === 'battle' && monster && problem && renderBattle()}
          {phase === 'clear' && renderClear()}
          {phase === 'gameover' && renderGameOver()}
          {phase === 'complete' && renderComplete()}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
