<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>분수 러너!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); } 40% { transform: translateX(10px); }
      60% { transform: translateX(-8px); } 80% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.4s ease-in-out; }

    /* 배경 스크롤 (땅) */
    @keyframes ground-scroll {
      from { background-position: 0 0; }
      to { background-position: -160px 0; }
    }
    .ground-scroll { animation: ground-scroll 0.8s linear infinite; }
    .ground-scroll-fast { animation: ground-scroll 0.4s linear infinite; }

    /* 구름 (느린 스크롤) */
    @keyframes cloud-scroll {
      from { background-position: 0 0; }
      to { background-position: -1600px 0; }
    }
    .cloud-scroll { animation: cloud-scroll 30s linear infinite; }

    /* 캐릭터 달리기 (위아래 bobbing) */
    @keyframes run-bob {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    .run-bob { animation: run-bob 0.35s ease-in-out infinite; }

    /* 캐릭터 점프 */
    @keyframes jump {
      0% { transform: translateY(0); }
      40% { transform: translateY(-90px) rotate(-15deg); }
      70% { transform: translateY(-60px) rotate(-25deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }
    .jump { animation: jump 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    /* 캐릭터 넘어짐 (오답) */
    @keyframes stumble {
      0% { transform: translateY(0) rotate(0); }
      30% { transform: translateY(0) rotate(-25deg); }
      60% { transform: translateY(0) rotate(20deg); }
      100% { transform: translateY(0) rotate(0); }
    }
    .stumble { animation: stumble 0.5s ease-in-out; }

    /* 보너스 별 슝 */
    @keyframes star-rise {
      0% { transform: translateY(0) scale(0.6); opacity: 1; }
      100% { transform: translateY(-80px) scale(1.6); opacity: 0; }
    }
    .star-rise { animation: star-rise 0.9s ease-out forwards; }

    /* 게이트 통과 효과 */
    @keyframes gate-pass {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    .gate-pass { animation: gate-pass 0.4s ease-out forwards; }

    /* 결승 폭죽 */
    @keyframes confetti {
      0% { transform: translate(0,0) rotate(0); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) rotate(var(--r)); opacity: 0; }
    }
    .confetti { animation: confetti 1.2s ease-out forwards; }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-sky-300 overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ============== 수학 유틸 ==============
    const gcd = (a, b) => (b === 0 ? a : gcd(b, a % b));
    const lcmOf = (a, b) => (a * b) / gcd(a, b);
    const rint = (n) => Math.floor(Math.random() * n);
    const shuffle = (arr) => {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    };

    function normalizeAnswer(num, den) {
      const g = gcd(num, den);
      const rn = num / g, rd = den / g;
      const whole = Math.floor(rn / rd);
      const remN = rn % rd;
      if (remN === 0) return { whole, n: 0, d: 1 };
      return { whole, n: remN, d: rd };
    }
    function rawAnswer(num, den) {
      const whole = Math.floor(num / den);
      const remN = num % den;
      if (remN === 0) return { whole, n: 0, d: 1 };
      return { whole, n: remN, d: den };
    }
    function sameAnswer(a, b) {
      if (a.whole !== b.whole) return false;
      if (a.n === 0 && b.n === 0) return true;
      return a.n === b.n && a.d === b.d;
    }
    function validAnswer(a) {
      return a && a.whole >= 0 && a.n >= 0 && a.d >= 1 && (a.n === 0 || a.n < a.d);
    }
    function buildChoices(correct, candidates) {
      const choices = [correct];
      for (const c of candidates) {
        if (choices.length >= 3) break;
        if (validAnswer(c) && !choices.some(x => sameAnswer(x, c))) choices.push(c);
      }
      let tries = 0;
      while (choices.length < 3 && tries < 30) {
        tries++;
        const base = choices[choices.length - 1];
        const dir = Math.random() < 0.5 ? 1 : -1;
        let cand;
        if (base.n === 0) cand = { whole: Math.max(0, base.whole + dir), n: 0, d: 1 };
        else cand = { whole: Math.max(0, base.whole + dir), n: base.n, d: base.d };
        if (validAnswer(cand) && !choices.some(x => sameAnswer(x, cand))) choices.push(cand);
      }
      return shuffle(choices);
    }

    // ============== 문제 생성 ==============
    function makeSameDenomAdd() {
      const d = 2 + rint(10);
      const n1 = 1 + rint(d - 1);
      const n2 = 1 + rint(d - 1);
      const sumNum = n1 + n2;
      const correct = normalizeAnswer(sumNum, d);
      const candidates = [
        rawAnswer(sumNum, d),
        normalizeAnswer(sumNum, d * 2),
        normalizeAnswer(Math.max(1, sumNum - 1), d),
        normalizeAnswer(sumNum + 1, d),
      ];
      return { op: '+', tag: '분모가 같은 덧셈', a: { n: n1, d }, b: { n: n2, d }, correctAnswer: correct, choices: buildChoices(correct, candidates) };
    }
    function makeSameDenomSub() {
      const d = 2 + rint(10);
      let n1 = 1 + rint(d - 1);
      let n2 = 1 + rint(d - 1);
      if (n1 < n2) [n1, n2] = [n2, n1];
      if (n1 === n2) n1 = n1 < d - 1 ? n1 + 1 : n1 - 1;
      const diffNum = n1 - n2;
      const correct = normalizeAnswer(diffNum, d);
      const candidates = [
        rawAnswer(diffNum, d),
        normalizeAnswer(n1 + n2, d),
        normalizeAnswer(Math.max(1, diffNum - 1), d),
        normalizeAnswer(diffNum + 1, d),
      ];
      return { op: '-', tag: '분모가 같은 뺄셈', a: { n: n1, d }, b: { n: n2, d }, correctAnswer: correct, choices: buildChoices(correct, candidates) };
    }
    function makeDiffDenomAdd() {
      let d1, d2;
      do { d1 = 2 + rint(9); d2 = 2 + rint(9); } while (d1 === d2 || lcmOf(d1, d2) > 24);
      const n1 = 1 + rint(d1 - 1);
      const n2 = 1 + rint(d2 - 1);
      const lcm = lcmOf(d1, d2);
      const sumNum = n1 * (lcm / d1) + n2 * (lcm / d2);
      const correct = normalizeAnswer(sumNum, lcm);
      const candidates = [
        rawAnswer(sumNum, lcm),
        normalizeAnswer(n1 + n2, lcm),
        normalizeAnswer(n1 + n2, d1 + d2),
        normalizeAnswer(sumNum + 1, lcm),
      ];
      return { op: '+', tag: '통분 후 덧셈', a: { n: n1, d: d1 }, b: { n: n2, d: d2 }, correctAnswer: correct, choices: buildChoices(correct, candidates) };
    }
    function makeDiffDenomSub() {
      let d1, d2;
      do { d1 = 2 + rint(9); d2 = 2 + rint(9); } while (d1 === d2 || lcmOf(d1, d2) > 24);
      let n1 = 1 + rint(d1 - 1);
      let n2 = 1 + rint(d2 - 1);
      const lcm = lcmOf(d1, d2);
      let a = n1 * (lcm / d1), b = n2 * (lcm / d2);
      if (a === b) { n1 = n1 < d1 - 1 ? n1 + 1 : n1 - 1; a = n1 * (lcm / d1); }
      if (a < b) { [d1, d2] = [d2, d1]; [n1, n2] = [n2, n1]; [a, b] = [b, a]; }
      const diffNum = a - b;
      const correct = normalizeAnswer(diffNum, lcm);
      const candidates = [
        rawAnswer(diffNum, lcm),
        normalizeAnswer(Math.max(1, n1 - n2), lcm),
        normalizeAnswer(diffNum + 1, lcm),
        normalizeAnswer(Math.max(1, diffNum - 1), lcm),
      ];
      return { op: '-', tag: '통분 후 뺄셈', a: { n: n1, d: d1 }, b: { n: n2, d: d2 }, correctAnswer: correct, choices: buildChoices(correct, candidates) };
    }
    const generateProblem = () => {
      const r = Math.random();
      if (r < 0.25) return makeSameDenomAdd();
      if (r < 0.5) return makeSameDenomSub();
      if (r < 0.75) return makeDiffDenomAdd();
      return makeDiffDenomSub();
    };

    // ============== 모둠 ==============
    const TEAMS = [
      { id: 1, name: '1모둠', emoji: '🔴', grad: 'from-red-500 to-rose-600',     bg: 'bg-red-50',     text: 'text-red-700',     border: 'border-red-400'     },
      { id: 2, name: '2모둠', emoji: '🔵', grad: 'from-blue-500 to-indigo-600',  bg: 'bg-blue-50',    text: 'text-blue-700',    border: 'border-blue-400'    },
      { id: 3, name: '3모둠', emoji: '🟢', grad: 'from-emerald-500 to-green-600',bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-400' },
      { id: 4, name: '4모둠', emoji: '🟠', grad: 'from-orange-500 to-amber-600', bg: 'bg-orange-50',  text: 'text-orange-700',  border: 'border-orange-400'  },
      { id: 5, name: '5모둠', emoji: '🟣', grad: 'from-purple-500 to-fuchsia-600',bg: 'bg-purple-50', text: 'text-purple-700',  border: 'border-purple-400'  },
    ];
    const TEAM_SIZE = 5;
    const teamMeta = (id) => TEAMS.find(t => t.id === Number(id)) || null;

    function bestPerPlayer(entries) {
      const best = {};
      entries.forEach(e => {
        if (!e || !e.name || typeof e.time !== 'number') return;
        const key = `${e.name}#${e.team || 0}`;
        if (!best[key] || e.time < best[key].time) best[key] = e;
      });
      return Object.values(best).sort((a, b) => a.time - b.time);
    }
    function computeTeamStats(entries) {
      const playersBest = bestPerPlayer(entries);
      const teams = {};
      TEAMS.forEach(t => { teams[t.id] = { team: t.id, players: [], sum: 0, count: 0, avg: 0 }; });
      playersBest.forEach(e => {
        const t = Number(e.team);
        if (!teams[t]) return;
        teams[t].players.push(e);
      });
      const arr = Object.values(teams).map(t => {
        const players = t.players.slice().sort((a,b) => a.time - b.time);
        const sum = players.reduce((acc, p) => acc + p.time, 0);
        const count = players.length;
        const avg = count > 0 ? sum / count : 0;
        return { team: t.team, players, sum, count, avg };
      });
      arr.sort((a, b) => {
        if (a.count !== b.count) return b.count - a.count;
        if (a.count === 0) return 0;
        return a.sum - b.sum;
      });
      return arr;
    }

    // ============== 분수 표시 ==============
    const Frac = ({ n, d, color = "text-slate-800" }) => (
      <span className={`inline-flex flex-col items-center mx-1 ${color} font-black leading-none`}>
        <span className="text-current">{n}</span>
        <span className="block w-full border-b-[3px] border-current my-0.5"></span>
        <span className="text-current">{d}</span>
      </span>
    );
    const FracOrMixed = ({ whole = 0, n = 0, d = 1, color = "text-slate-800" }) => {
      if (n === 0) return <span className={`inline-block mx-1 ${color} font-black text-current`}>{whole}</span>;
      if (whole === 0) return <Frac n={n} d={d} color={color} />;
      return (
        <span className={`inline-flex items-center mx-1 ${color} font-black`}>
          <span className="mr-1 text-current">{whole}</span>
          <Frac n={n} d={d} color={color} />
        </span>
      );
    };

    // ============== 러너 캐릭터 (달리는 곰빵) ==============
    // running: 다리/팔이 교차되는 두 프레임을 빠르게 교체해서 달리는 느낌
    const RunnerChar = ({ state = 'run', size = 'md' }) => {
      // state: 'run' (달리는 중), 'jump' (점프 중), 'stumble' (넘어짐)
      const sizes = {
        sm: 'w-[60px] h-[60px]',
        md: 'w-[90px] h-[90px] sm:w-[110px] sm:h-[110px] md:w-[130px] md:h-[130px]',
      };
      const wrapAnim = state === 'jump' ? 'jump' : state === 'stumble' ? 'stumble' : 'run-bob';
      // 다리 두 프레임 토글
      const [frame, setFrame] = useState(0);
      useEffect(() => {
        if (state !== 'run') return;
        const t = setInterval(() => setFrame(f => 1 - f), 120);
        return () => clearInterval(t);
      }, [state]);

      // 다리 좌표: 두 프레임
      const legA = frame === 0
        ? { lx1: 95, ly1: 150, lx2: 80, ly2: 195, rx1: 125, ry1: 150, rx2: 145, ry2: 175 }
        : { lx1: 95, ly1: 150, lx2: 110, ly2: 195, rx1: 125, ry1: 150, rx2: 140, ry2: 195 };
      // 팔: 다리와 교차
      const armA = frame === 0
        ? { lx1: 70, ly1: 115, lx2: 50, ly2: 145, rx1: 150, ry1: 115, rx2: 175, ry2: 100 }
        : { lx1: 70, ly1: 115, lx2: 55, ly2: 95,  rx1: 150, ry1: 115, rx2: 175, ry2: 145 };

      return (
        <div className={`${wrapAnim} ${sizes[size]}`}>
          <svg viewBox="0 0 220 220" className="w-full h-full" xmlns="http://www.w3.org/2000/svg">
            {/* 몸통 (빵) */}
            <path d="M 50,80 Q 50,30 110,30 Q 170,30 170,80 Q 178,170 110,170 Q 42,170 50,80 Z"
              fill="#fde68a" stroke="#92400e" strokeWidth="5" strokeLinejoin="round" />
            {/* 입 */}
            <path d="M 92,110 Q 110,124 128,110" stroke="#92400e" strokeWidth="4" fill="none" strokeLinecap="round" />
            {/* 눈 - 달리는 표정 (^ ^) */}
            {state === 'stumble' ? (
              <>
                <path d="M 80,90 L 95,100 M 95,90 L 80,100" stroke="#92400e" strokeWidth="4" strokeLinecap="round" />
                <path d="M 125,90 L 140,100 M 140,90 L 125,100" stroke="#92400e" strokeWidth="4" strokeLinecap="round" />
              </>
            ) : state === 'jump' ? (
              <>
                <circle cx="87" cy="92" r="5" fill="#92400e" />
                <circle cx="133" cy="92" r="5" fill="#92400e" />
                <circle cx="85" cy="90" r="1.5" fill="#fff" />
                <circle cx="131" cy="90" r="1.5" fill="#fff" />
              </>
            ) : (
              <>
                <path d="M 78,95 Q 87,84 96,95" stroke="#92400e" strokeWidth="4" fill="none" strokeLinecap="round" />
                <path d="M 124,95 Q 133,84 142,95" stroke="#92400e" strokeWidth="4" fill="none" strokeLinecap="round" />
              </>
            )}
            {/* 볼터치 */}
            <circle cx="72" cy="115" r="6" fill="#fca5a5" opacity="0.7" />
            <circle cx="148" cy="115" r="6" fill="#fca5a5" opacity="0.7" />
            {/* 팔 */}
            <line x1={armA.lx1} y1={armA.ly1} x2={armA.lx2} y2={armA.ly2} stroke="#92400e" strokeWidth="6" strokeLinecap="round" />
            <line x1={armA.rx1} y1={armA.ry1} x2={armA.rx2} y2={armA.ry2} stroke="#92400e" strokeWidth="6" strokeLinecap="round" />
            {/* 다리 */}
            <line x1={legA.lx1} y1={legA.ly1} x2={legA.lx2} y2={legA.ly2} stroke="#92400e" strokeWidth="7" strokeLinecap="round" />
            <line x1={legA.rx1} y1={legA.ry1} x2={legA.rx2} y2={legA.ry2} stroke="#92400e" strokeWidth="7" strokeLinecap="round" />
          </svg>
        </div>
      );
    };

    const formatTime = (ms) => {
      const totalCs = Math.floor(ms / 10);
      const m = Math.floor(totalCs / 6000);
      const s = Math.floor((totalCs % 6000) / 100);
      const cs = totalCs % 100;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
    };

    // ============== 리더보드 (러너 게임 전용 키) ==============
    const LB_KEY = 'fraction-runner-game-leaderboard-v1';
    const loadLocalLB = () => { try { return JSON.parse(localStorage.getItem(LB_KEY) || '[]'); } catch { return []; } };
    const saveLocalLB = (entries) => { try { localStorage.setItem(LB_KEY, JSON.stringify(entries)); } catch {} };

    const isGAS = () => typeof window !== 'undefined' && window.google && window.google.script && window.google.script.run;

    function runnerWithTimeout(timeoutMs) {
      return function (callFn) {
        return new Promise(function (resolve, reject) {
          if (!isGAS()) { reject(new Error('not GAS')); return; }
          var done = false;
          var timer = setTimeout(function () {
            if (!done) { done = true; reject(new Error('서버 응답 시간 초과')); }
          }, timeoutMs);
          try {
            var runner = google.script.run
              .withSuccessHandler(function (v) { if (!done) { done = true; clearTimeout(timer); resolve(v); } })
              .withFailureHandler(function (e) {
                if (!done) { done = true; clearTimeout(timer); reject(e instanceof Error ? e : new Error((e && e.message) || String(e))); }
              });
            callFn(runner);
          } catch (e) {
            if (!done) { done = true; clearTimeout(timer); reject(e); }
          }
        });
      };
    }
    var runGAS = runnerWithTimeout(10000);

    async function fetchLeaderboard() {
      if (isGAS()) {
        try {
          const data = await runGAS(function (r) { r.getLeaderboardRunner(); });
          if (Array.isArray(data)) return data;
        } catch (e) { console.warn('getLeaderboardRunner 실패, 로컬 사용:', e); }
      }
      return loadLocalLB();
    }
    async function submitScoreRemote(name, team, time) {
      if (isGAS()) {
        try {
          const data = await runGAS(function (r) { r.submitScoreRunner(name, team, time); });
          if (Array.isArray(data)) return { data, saved: 'remote', error: null };
        } catch (e) {
          const msg = (e && e.message) || String(e);
          const entry = { name, team: Number(team) || 0, time, date: Date.now() };
          const updated = [...loadLocalLB(), entry];
          saveLocalLB(updated.slice(-200));
          return { data: updated, saved: 'local-fallback', error: msg };
        }
      }
      const entry = { name, team: Number(team) || 0, time, date: Date.now() };
      const updated = [...loadLocalLB(), entry];
      saveLocalLB(updated.slice(-200));
      return { data: updated, saved: 'local', error: null };
    }
    async function clearLeaderboardRemote(password) {
      if (isGAS()) {
        await runGAS(function (r) { r.clearLeaderboardRunner(password); });
        return [];
      }
      saveLocalLB([]);
      return [];
    }

    // ============== 메인 ==============
    const TOTAL_PROBLEMS = 20; // 러너는 한 문제당 화면 전환이 있으니 약간 줄임
    const PENALTY_MS = 8000;

    function App() {
      const [screen, setScreen] = useState('title');
      const [name, setName] = useState('');
      const [team, setTeam] = useState(0);
      const [solved, setSolved] = useState(0);
      const [problem, setProblem] = useState(null);
      const [charState, setCharState] = useState('run'); // run | jump | stumble
      const [feedback, setFeedback] = useState(null);
      const [elapsed, setElapsed] = useState(0);
      const [countdown, setCountdown] = useState(3);
      const [finalTime, setFinalTime] = useState(0);
      const [leaderboard, setLeaderboard] = useState([]);
      const [lbBusy, setLbBusy] = useState(false);
      const [lbUpdatedAt, setLbUpdatedAt] = useState(0);
      const [showPwModal, setShowPwModal] = useState(false);
      const [pwInput, setPwInput] = useState('');
      const [lbTab, setLbTab] = useState('team');
      const [confettiBits, setConfettiBits] = useState([]);
      const [usingRemote, setUsingRemote] = useState(false);
      const [submitStatus, setSubmitStatus] = useState(null);
      const [starBurst, setStarBurst] = useState(0); // 정답시 별 갯수 트리거

      const startRef = useRef(0);
      const penaltyRef = useRef(0);
      const rafRef = useRef(null);
      const lockRef = useRef(false);

      const playersBest = useMemo(() => bestPerPlayer(leaderboard), [leaderboard]);
      const teamStats = useMemo(() => computeTeamStats(leaderboard), [leaderboard]);

      const refreshLB = useCallback(async () => {
        setLbBusy(true);
        try {
          const data = await fetchLeaderboard();
          setLeaderboard(data);
          setLbUpdatedAt(Date.now());
        } catch (e) { console.warn('refreshLB 오류:', e); }
        finally { setLbBusy(false); }
      }, []);

      useEffect(() => { setUsingRemote(isGAS()); refreshLB(); }, [refreshLB]);

      useEffect(() => {
        if (screen !== 'playing') return;
        const tick = () => {
          setElapsed(Date.now() - startRef.current + penaltyRef.current);
          rafRef.current = requestAnimationFrame(tick);
        };
        rafRef.current = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafRef.current);
      }, [screen]);

      useEffect(() => {
        if (screen !== 'countdown') return;
        if (countdown <= 0) {
          startRef.current = Date.now();
          penaltyRef.current = 0;
          setElapsed(0);
          setSolved(0);
          setCharState('run');
          setProblem(generateProblem());
          setScreen('playing');
          return;
        }
        const t = setTimeout(() => setCountdown(c => c - 1), 700);
        return () => clearTimeout(t);
      }, [screen, countdown]);

      const startGame = () => {
        if (!name.trim() || !team) return;
        setCountdown(3);
        setScreen('countdown');
      };

      const handlePick = (choice) => {
        if (lockRef.current || !problem) return;
        const isCorrect = sameAnswer(choice, problem.correctAnswer);
        lockRef.current = true;

        if (isCorrect) {
          const next = solved + 1;
          setFeedback('correct');
          setCharState('jump');
          setStarBurst(s => s + 1);
          setSolved(next);
          if (next >= TOTAL_PROBLEMS) {
            setTimeout(() => {
              setScreen('finishing');
              const bits = Array.from({ length: 32 }).map((_, i) => ({
                id: i,
                tx: (Math.random() - 0.5) * 800,
                ty: (Math.random() - 0.5) * 600 - 100,
                r: Math.random() * 720 - 360,
                emoji: ['🎉','✨','⭐','💥','🎊','💫','🏆'][Math.floor(Math.random()*7)]
              }));
              setConfettiBits(bits);
              setTimeout(async () => {
                const t = Date.now() - startRef.current + penaltyRef.current;
                setFinalTime(t);
                setLbBusy(true);
                const result = await submitScoreRemote(name.trim(), team, t);
                setLeaderboard(result.data);
                setSubmitStatus({ saved: result.saved, error: result.error });
                setLbUpdatedAt(Date.now());
                setLbBusy(false);
                setScreen('result');
              }, 1600);
            }, 400);
          } else {
            setTimeout(() => {
              setProblem(generateProblem());
              setCharState('run');
              setFeedback(null);
              lockRef.current = false;
            }, 600);
          }
        } else {
          penaltyRef.current += PENALTY_MS;
          setFeedback('wrong');
          setCharState('stumble');
          setTimeout(() => {
            setCharState('run');
            setFeedback(null);
            lockRef.current = false;
          }, 600);
        }
      };

      const resetGame = (clearName = false) => {
        setScreen('title');
        setSolved(0); setElapsed(0); setFeedback(null); setProblem(null);
        setCharState('run');
        lockRef.current = false;
        if (clearName) { setName(''); setTeam(0); }
        refreshLB();
      };

      const clearLB = () => { setPwInput(''); setShowPwModal(true); };
      const doActualClear = async () => {
        setShowPwModal(false);
        setLbBusy(true);
        try {
          const data = await clearLeaderboardRemote(pwInput);
          setLeaderboard(data);
          setLbUpdatedAt(Date.now());
        } catch (e) {
          alert((e && e.message) || '비밀번호가 틀렸거나 서버 오류가 발생했습니다.');
        } finally { setLbBusy(false); }
      };

      const TeamPicker = ({ value, onChange }) => (
        <div className="grid grid-cols-5 gap-1.5 md:gap-2">
          {TEAMS.map(t => (
            <button key={t.id} onClick={() => onChange(t.id)} type="button"
              className={`py-2 md:py-2.5 rounded-xl font-black text-sm md:text-base transition border-2 ${value === t.id ? `bg-gradient-to-br ${t.grad} text-white border-white shadow-lg scale-105` : `${t.bg} ${t.text} border-transparent hover:scale-105`}`}>
              {t.id}모둠
            </button>
          ))}
        </div>
      );

      const TeamLeaderboard = ({ stats, highlightTeam }) => (
        <div className="space-y-2">
          {stats.map((ts, i) => {
            const m = teamMeta(ts.team);
            if (!m) return null;
            const isHighlight = highlightTeam === ts.team;
            const isTop = i === 0 && ts.count > 0;
            return (
              <div key={ts.team} className={`rounded-xl p-2.5 md:p-3 border-l-4 ${m.border} ${isHighlight ? 'bg-indigo-50 ring-2 ring-indigo-400' : isTop ? 'bg-yellow-50' : 'bg-slate-50'}`}>
                <div className="flex justify-between items-center mb-1">
                  <div className={`font-black text-sm md:text-base flex items-center gap-1.5 ${m.text}`}>
                    <span className="bg-white/80 text-slate-700 px-1.5 py-0.5 rounded-md text-xs">{i+1}위</span>
                    {m.emoji} {m.name}
                    {isHighlight && <span className="text-[10px] bg-indigo-500 text-white px-1.5 py-0.5 rounded-md">우리 모둠</span>}
                  </div>
                  <span className="text-xs md:text-sm font-bold text-slate-500">{ts.count}/{TEAM_SIZE}명</span>
                </div>
                <div className="flex justify-between text-xs md:text-sm">
                  <span className="text-slate-600">합산: <span className="font-mono font-bold text-slate-800">{ts.count > 0 ? formatTime(ts.sum) : '-'}</span></span>
                  <span className="text-slate-600">평균: <span className="font-mono font-bold text-slate-800">{ts.count > 0 ? formatTime(ts.avg) : '-'}</span></span>
                </div>
                {ts.players.length > 0 && (
                  <div className="mt-1.5 pl-2 border-l-2 border-slate-200 space-y-0.5">
                    {ts.players.map((p, j) => (
                      <div key={j} className="flex justify-between text-[11px] md:text-xs text-slate-600">
                        <span className="truncate">{j+1}. {p.name}</span>
                        <span className="font-mono">{formatTime(p.time)}</span>
                      </div>
                    ))}
                    {Array.from({length: Math.max(0, TEAM_SIZE - ts.players.length)}).map((_, j) => (
                      <div key={`empty-${j}`} className="flex justify-between text-[11px] md:text-xs text-slate-300">
                        <span>· · · · · ·</span>
                        <span className="font-mono">--:--.--</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );

      const IndividualLeaderboard = ({ entries, highlight }) => (
        <div className="space-y-1">
          {entries.length === 0 && <div className="text-slate-400 text-center py-3 text-sm">아직 기록이 없습니다.</div>}
          {entries.slice(0, 10).map((e, i) => {
            const m = teamMeta(e.team);
            const isMine = highlight && e.name === highlight.name && Number(e.team) === Number(highlight.team) && e.time === highlight.time;
            return (
              <div key={i} className={`flex justify-between items-center px-3 py-2 rounded-lg text-sm md:text-base font-bold ${isMine ? 'bg-indigo-200 text-indigo-900 ring-2 ring-indigo-500' : i === 0 ? 'bg-yellow-100 text-yellow-800' : i === 1 ? 'bg-slate-100 text-slate-700' : i === 2 ? 'bg-amber-100 text-amber-800' : 'bg-slate-50 text-slate-600'}`}>
                <span className="flex items-center gap-1.5 min-w-0">
                  <span>{i+1}.</span>
                  <span className="truncate">{e.name}</span>
                  {m && <span className={`text-[10px] md:text-xs px-1.5 py-0.5 rounded ${m.bg} ${m.text} font-black`}>{m.emoji}{m.id}</span>}
                  {isMine && <span> ⭐</span>}
                </span>
                <span className="font-mono">{formatTime(e.time)}</span>
              </div>
            );
          })}
        </div>
      );

      const LeaderboardSection = ({ highlight }) => (
        <>
          {showPwModal && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50" onClick={() => setShowPwModal(false)}>
              <div className="bg-white rounded-2xl p-6 w-80 shadow-2xl" onClick={e => e.stopPropagation()}>
                <h3 className="font-black text-slate-800 text-lg mb-1">🔒 선생님 인증</h3>
                <p className="text-slate-500 text-sm mb-4">명예의 전당 전체 초기화는 선생님만 가능합니다.</p>
                <input type="password" value={pwInput} onChange={e => setPwInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && doActualClear()}
                  placeholder="비밀번호" autoFocus
                  className="w-full px-4 py-2.5 rounded-xl border-2 border-slate-300 focus:border-indigo-500 outline-none mb-3 text-slate-800" />
                <div className="flex gap-2">
                  <button onClick={() => setShowPwModal(false)}
                    className="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 rounded-xl transition">취소</button>
                  <button onClick={doActualClear}
                    className="flex-1 bg-rose-500 hover:bg-rose-600 text-white font-black py-2.5 rounded-xl shadow transition">초기화</button>
                </div>
              </div>
            </div>
          )}
          <div className="text-left">
            <div className="flex items-center justify-between mb-2">
              <div className="font-black text-slate-700 flex items-center gap-1.5">
                🏆 명예의 전당
                {usingRemote
                  ? <span className="text-[10px] md:text-xs bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded-md font-bold">실시간 공유</span>
                  : <span className="text-[10px] md:text-xs bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded-md font-bold">기기 저장</span>}
              </div>
              <div className="flex gap-2 items-center">
                {lbUpdatedAt > 0 && (
                  <span className="text-[10px] text-slate-400 font-mono">
                    {new Date(lbUpdatedAt).toLocaleTimeString('ko-KR', { hour12: false })} · {leaderboard.length}건
                  </span>
                )}
                <button onClick={refreshLB} disabled={lbBusy} className="text-xs font-bold text-slate-500 hover:text-indigo-600 disabled:opacity-50">{lbBusy ? '⏳' : '🔄'} 새로고침</button>
                <button onClick={clearLB} disabled={lbBusy} className="text-xs text-slate-400 hover:text-rose-500 underline disabled:opacity-50">초기화</button>
              </div>
            </div>
            <div className="flex gap-1 bg-slate-100 p-1 rounded-xl mb-3">
              <button onClick={() => setLbTab('team')} className={`flex-1 py-2 rounded-lg font-bold text-sm transition ${lbTab === 'team' ? 'bg-white text-orange-600 shadow' : 'text-slate-500'}`}>🤝 모둠전</button>
              <button onClick={() => setLbTab('individual')} className={`flex-1 py-2 rounded-lg font-bold text-sm transition ${lbTab === 'individual' ? 'bg-white text-orange-600 shadow' : 'text-slate-500'}`}>🏆 개인전</button>
            </div>
            {lbBusy && leaderboard.length === 0 && <div className="text-slate-400 text-center py-3 text-sm">불러오는 중...</div>}
            {lbTab === 'team' && <TeamLeaderboard stats={teamStats} highlightTeam={highlight?.team} />}
            {lbTab === 'individual' && <IndividualLeaderboard entries={playersBest} highlight={highlight} />}
          </div>
        </>
      );

      // 배경 SVG 인라인 (땅 패턴, 구름)
      const groundPattern = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='40'><rect width='160' height='40' fill='%2384cc16'/><rect y='30' width='160' height='10' fill='%2365a30d'/><circle cx='20' cy='8' r='3' fill='%23a3e635'/><circle cx='60' cy='14' r='3' fill='%23a3e635'/><circle cx='100' cy='6' r='3' fill='%23a3e635'/><circle cx='140' cy='12' r='3' fill='%23a3e635'/></svg>")`;
      const cloudPattern = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='180'><g fill='white' opacity='0.85'><ellipse cx='160' cy='60' rx='70' ry='28'/><ellipse cx='200' cy='50' rx='50' ry='22'/><ellipse cx='550' cy='90' rx='80' ry='30'/><ellipse cx='600' cy='80' rx='60' ry='24'/><ellipse cx='950' cy='55' rx='75' ry='27'/><ellipse cx='1000' cy='45' rx='55' ry='23'/><ellipse cx='1350' cy='100' rx='90' ry='32'/><ellipse cx='1410' cy='90' rx='65' ry='25'/></g></svg>")`;

      // ============== 화면 렌더 ==============
      if (screen === 'title') {
        return (
          <div className="w-full h-[100dvh] bg-gradient-to-b from-sky-400 via-sky-300 to-amber-200 flex flex-col font-sans overflow-hidden">
            <div className="flex-shrink-0 flex flex-col items-center px-4 pt-4 pb-2 gap-2">
              <div className="flex items-center gap-3">
                <RunnerChar state="run" size="md" />
                <div className="text-white text-left drop-shadow-md">
                  <h1 className="text-2xl sm:text-3xl md:text-4xl font-black tracking-tight leading-tight">🏃 분수 러너!</h1>
                  <p className="text-xs sm:text-sm text-white/90 font-bold">달리며 푸는 통분·약분 게임</p>
                </div>
              </div>

              <div className="bg-white/95 rounded-2xl shadow-2xl p-3 sm:p-5 w-full max-w-lg animate-fade-in">
                <div className="bg-orange-50 border border-orange-200 rounded-xl p-2 sm:p-3 text-left text-[11px] sm:text-xs md:text-sm text-orange-900 mb-3 leading-relaxed break-keep">
                  <span className="font-bold">📜 규칙: </span>
                  {TOTAL_PROBLEMS}문제 · 달리는 캐릭터가 정답 게이트로 점프! · 오답시 넘어짐 <strong className="text-rose-600">+8초</strong> · <strong>모둠전</strong> 합산시간 경쟁
                </div>
                <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="내 이름"
                  className="w-full px-4 py-2.5 sm:py-3 rounded-xl border-2 border-slate-300 focus:border-orange-500 outline-none mb-3 font-bold text-slate-800" />
                <TeamPicker value={team} onChange={setTeam} />
                <button onClick={startGame} disabled={!name.trim() || !team}
                  className="w-full mt-3 bg-gradient-to-r from-orange-500 to-rose-500 hover:from-orange-600 hover:to-rose-600 disabled:from-slate-300 disabled:to-slate-400 text-white font-black py-3 sm:py-4 rounded-xl shadow-lg text-base sm:text-lg transition">
                  🏁 출발!
                </button>
              </div>
            </div>
            <div className="flex-1 overflow-y-auto px-4 pb-4 hide-scrollbar">
              <div className="bg-white/95 rounded-2xl shadow-2xl p-3 sm:p-5 w-full max-w-lg mx-auto">
                <LeaderboardSection />
              </div>
            </div>
          </div>
        );
      }

      if (screen === 'countdown') {
        return (
          <div className="w-full h-[100dvh] bg-gradient-to-b from-sky-400 to-amber-200 flex items-center justify-center font-sans">
            <div className="text-center">
              <RunnerChar state="run" size="md" />
              <div className="text-white text-7xl sm:text-9xl font-black drop-shadow-2xl mt-4">{countdown || 'GO!'}</div>
            </div>
          </div>
        );
      }

      if (screen === 'playing' || screen === 'finishing') {
        const progress = (solved / TOTAL_PROBLEMS) * 100;
        const isFinishing = screen === 'finishing';
        const groundCls = isFinishing ? 'ground-scroll-fast' : (charState === 'stumble' ? '' : 'ground-scroll');
        return (
          <div className={`w-full h-[100dvh] flex flex-col font-sans overflow-hidden ${feedback === 'wrong' ? 'shake' : ''}`}>
            {/* 상단 HUD */}
            <div className="flex-shrink-0 bg-slate-900/85 text-white px-3 py-2 sm:py-3 flex items-center justify-between gap-2 z-20">
              <div className="flex items-center gap-2 min-w-0">
                <span className="text-xs sm:text-sm font-bold opacity-80">{solved}/{TOTAL_PROBLEMS}</span>
                <div className="flex-1 min-w-[80px] sm:min-w-[150px] h-2.5 sm:h-3 bg-slate-700 rounded-full overflow-hidden">
                  <div className="h-full bg-gradient-to-r from-yellow-400 via-orange-400 to-rose-400 transition-all duration-300" style={{ width: `${progress}%` }} />
                </div>
              </div>
              <div className="font-mono font-black text-base sm:text-xl">{formatTime(elapsed)}</div>
            </div>

            {/* 하늘 (구름 스크롤) */}
            <div
              className="relative flex-1 flex flex-col"
              style={{ background: 'linear-gradient(to bottom, #7dd3fc 0%, #bae6fd 60%, #fef3c7 100%)' }}
            >
              <div
                className="absolute inset-0 cloud-scroll opacity-90 pointer-events-none"
                style={{ backgroundImage: cloudPattern, backgroundRepeat: 'repeat-x', backgroundSize: '1600px 180px', backgroundPosition: '0 20px' }}
              />

              {/* 문제 박스 (상단 띄움) */}
              {problem && (
                <div className="relative z-10 mx-auto mt-2 sm:mt-4 px-3 sm:px-5 py-2 sm:py-3 bg-white/95 rounded-2xl shadow-2xl border-4 border-orange-300 max-w-[92%]">
                  <div className="text-[10px] sm:text-xs font-bold text-orange-700 mb-0.5 text-center">{problem.tag}</div>
                  <div className="flex items-center justify-center gap-1 text-2xl sm:text-4xl md:text-5xl">
                    <Frac n={problem.a.n} d={problem.a.d} />
                    <span className="mx-1 font-black text-slate-800">{problem.op}</span>
                    <Frac n={problem.b.n} d={problem.b.d} />
                    <span className="ml-1 sm:ml-2 font-black text-slate-800">= ?</span>
                  </div>
                  <div className="text-[10px] sm:text-xs text-center text-slate-500 mt-1">기약분수/대분수로</div>
                </div>
              )}

              {/* 러너 캐릭터 영역 */}
              <div className="relative flex-1 flex items-end justify-start pl-4 sm:pl-12 pb-1">
                <div className="relative">
                  <RunnerChar state={charState} size="md" />
                  {/* 별 슝 (정답 피드백) */}
                  {feedback === 'correct' && (
                    <div key={starBurst} className="absolute -top-2 left-1/2 -translate-x-1/2 text-3xl sm:text-4xl star-rise pointer-events-none">⭐</div>
                  )}
                  {feedback === 'wrong' && (
                    <div className="absolute -top-2 left-1/2 -translate-x-1/2 text-2xl sm:text-3xl pointer-events-none">💢</div>
                  )}
                </div>
              </div>

              {/* 결승 폭죽 */}
              {isFinishing && (
                <div className="pointer-events-none absolute inset-0 z-30 flex items-center justify-center">
                  {confettiBits.map(b => (
                    <span key={b.id} className="absolute text-3xl confetti"
                      style={{ '--tx': `${b.tx}px`, '--ty': `${b.ty}px`, '--r': `${b.r}deg` }}>
                      {b.emoji}
                    </span>
                  ))}
                  <div className="text-5xl sm:text-7xl font-black text-white drop-shadow-2xl animate-fade-in">🏁 결승!</div>
                </div>
              )}
            </div>

            {/* 땅 (스크롤) */}
            <div
              className={`flex-shrink-0 h-[40px] sm:h-[50px] ${groundCls}`}
              style={{ backgroundImage: groundPattern, backgroundRepeat: 'repeat', backgroundSize: '160px 40px' }}
            />

            {/* 답 카드 (게이트) */}
            <div className="flex-shrink-0 bg-slate-800 px-2 py-2 sm:px-4 sm:py-3 grid grid-cols-3 gap-1.5 sm:gap-3">
              {problem && problem.choices.map((c, i) => {
                const colors = [
                  'from-sky-400 to-sky-600 border-sky-200',
                  'from-rose-400 to-rose-600 border-rose-200',
                  'from-emerald-400 to-emerald-600 border-emerald-200',
                ];
                return (
                  <button key={i} onClick={() => handlePick(c)} disabled={lockRef.current}
                    className={`relative bg-gradient-to-br ${colors[i]} text-white rounded-xl sm:rounded-2xl px-1 py-2 sm:py-3 border-[3px] sm:border-4 shadow-xl active:scale-95 hover:scale-[1.03] transition-transform disabled:opacity-60 disabled:active:scale-100 flex items-center justify-center min-h-[60px] sm:min-h-[80px]`}>
                    <span className="absolute top-1 left-1.5 text-[9px] sm:text-xs font-black opacity-80 bg-white/20 rounded px-1">게이트 {i+1}</span>
                    <div className="flex items-center justify-center text-xl sm:text-2xl md:text-3xl">
                      <FracOrMixed whole={c.whole} n={c.n} d={c.d} color="text-white" />
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        );
      }

      if (screen === 'result') {
        const highlight = { name: name.trim(), team, time: finalTime };
        return (
          <div className="w-full h-[100dvh] bg-gradient-to-br from-orange-400 via-rose-500 to-purple-600 flex flex-col font-sans overflow-hidden">
            <div className="flex-shrink-0 px-3 sm:px-4 pt-3 sm:pt-4 pb-2">
              <div className="bg-white/95 rounded-2xl shadow-2xl p-3 sm:p-5 max-w-lg mx-auto animate-fade-in">
                <div className="text-center">
                  <div className="text-3xl sm:text-5xl mb-1">🏆</div>
                  <h2 className="text-lg sm:text-2xl font-black text-slate-800">완주 성공!</h2>
                  <div className="font-mono text-3xl sm:text-5xl font-black text-orange-600 mt-1">{formatTime(finalTime)}</div>
                  <div className="text-xs sm:text-sm text-slate-500 mt-1">{name} · {teamMeta(team)?.name}</div>
                </div>

                {submitStatus && (
                  <div className={`mt-3 text-xs sm:text-sm font-bold rounded-lg p-2 text-center
                    ${submitStatus.saved === 'remote' ? 'bg-emerald-50 text-emerald-700' :
                      submitStatus.saved === 'local-fallback' ? 'bg-amber-50 text-amber-700' :
                      'bg-sky-50 text-sky-700'}`}>
                    {submitStatus.saved === 'remote' && '✅ 공유 명예의 전당에 기록됨'}
                    {submitStatus.saved === 'local-fallback' && `⚠️ 서버 저장 실패, 기기에만 임시 저장 (${submitStatus.error || '오류'})`}
                    {submitStatus.saved === 'local' && 'ℹ️ 이 기기에만 기록 저장됨 (앱스크립트 미연결)'}
                  </div>
                )}

                <div className="grid grid-cols-2 gap-2 mt-3">
                  <button onClick={() => { setCountdown(3); setScreen('countdown'); }}
                    className="bg-gradient-to-r from-orange-500 to-rose-500 hover:from-orange-600 hover:to-rose-600 text-white font-black py-2.5 sm:py-3 rounded-xl shadow transition">🔁 다시 달리기</button>
                  <button onClick={() => resetGame(true)}
                    className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-black py-2.5 sm:py-3 rounded-xl transition">🏠 처음으로</button>
                </div>
              </div>
            </div>
            <div className="flex-1 overflow-y-auto px-3 sm:px-4 pb-4 hide-scrollbar">
              <div className="bg-white/95 rounded-2xl shadow-2xl p-3 sm:p-5 max-w-lg mx-auto">
                <LeaderboardSection highlight={highlight} />
              </div>
            </div>
          </div>
        );
      }

      return null;
    }
